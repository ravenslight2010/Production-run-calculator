# Render Blueprint — deploy with one click:
#   1. Go to https://dashboard.render.com/blueprints
#   2. Click "New Blueprint Instance"
#   3. Connect your GitHub repo (this file is auto-detected)
#   4. Render provisions the database + service from the Docker image
#   5. Add the secrets in the service's "Environment" tab
#
# The API image is the slim `api` Docker target. Render runs the migration
# payload copied into that image before each deploy, then starts the bundled
# server. The full `api-migrate` target is published separately for manual
# recovery and Docker Compose.

databases:
  - name: runcalc-db
    plan: free
    databaseName: runcalc

services:
  - type: web
    name: runcalc
    runtime: image
    image:
      url: ghcr.io/ravenslight2010/runcalc-api:latest
    preDeployCommand: >-
      node migration/node_modules/drizzle-kit/bin.cjs push --force
      --config migration/drizzle.config.ts
    plan: free
    healthCheckPath: /api/readyz
    envVars:
      # ---- Database (auto-linked by Render) ----
      - key: DATABASE_URL
        fromDatabase:
          name: runcalc-db
          property: connectionString
      # ---- Application ----
      - key: NODE_ENV
        value: production
      # ---- Auth (set these in Render's dashboard) ----
      - key: STAFF_SIGNUP_CODE
        sync: false
      - key: INITIAL_MANAGER_USERNAME
        sync: false
      - key: INITIAL_MANAGER_ACCESS_CODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      # ---- AI (set this in Render's dashboard) ----
      - key: AI_INTEGRATIONS_GEMINI_API_KEY
        sync: false
      - key: AI_INTEGRATIONS_GEMINI_BASE_URL
        sync: false
      # ---- Web / CORS (optional; leave blank when web + API share the same domain) ----
      - key: REPLIT_DOMAINS
        sync: false
