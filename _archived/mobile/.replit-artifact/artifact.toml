kind = "mobile"
previewPath = "/mobile/"
title = "Run Calculator Mobile"
version = "1.0.0"
id = "artifacts/run-calculator-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 20191

[services.development]
run = "pnpm --filter @workspace/run-calculator-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/run-calculator-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/run-calculator-mobile", "run", "serve" ]

[services.env]
PORT = "20191"
BASE_PATH = "/mobile/"
