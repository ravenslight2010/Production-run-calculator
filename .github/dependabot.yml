# Keep production dependencies (web app + API server + shared libs) up to date
# and patched against advisories. The mobile app (Expo) is pinned to SDK 54 and
# is deliberately NOT auto-updated here.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    # (The Expo ignore block was removed: no expo/react-native dependency
    # exists in any workspace package.json, so the entries were vestigial.)

  # Keep pinned GitHub Actions current without changing their immutable SHA
  # pins manually. The workflow comments retain the human-readable release.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
