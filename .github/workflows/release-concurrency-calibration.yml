name: Release concurrency calibration

on:
  workflow_dispatch:

concurrency:
  group: release-concurrency-calibration
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  release-concurrency-calibration:
    name: Disposable Postgres concurrency calibration
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: release_concurrency_calibration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d release_concurrency_calibration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/release_concurrency_calibration
      SESSION_SECRET: release-concurrency-calibration-ci-session
      STAFF_SIGNUP_CODE: release-concurrency-calibration-ci
      NODE_ENV: test
      E2E_TEST_DB: "1"
      RELEASE_CONCURRENCY_APPROVED_DISPOSABLE_DB: "1"
      RELEASE_CONCURRENCY_EVIDENCE_DIR: release-concurrency-calibration
      TEST_RESULTS_REPORT_PATH: test-evidence/test-results.json
      TEST_RESULTS_ARTIFACT_NAME: automated-test-results-concurrency-calibration-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize machine-readable test report
        run: node scripts/src/test-results.mjs init

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bash scripts/src/run-release-node.sh pnpm install --frozen-lockfile

      - name: Verify calibration archive validation
        run: node scripts/src/test-results.mjs run --lane ci-release-concurrency-fixtures -- pnpm --filter @workspace/scripts run test:release-concurrency

      - name: Fetch prior healthy calibration history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/src/fetch-release-concurrency-history.sh

      - name: Run release concurrency calibration
        run: node scripts/src/test-results.mjs run --lane release-concurrency-calibration -- pnpm run check:release-concurrency

      - name: Add calibration comparison to job summary
        if: always()
        run: |
          if [[ -f release-concurrency-calibration/release-concurrency-comparison.md ]]; then
            cat release-concurrency-calibration/release-concurrency-comparison.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f release-concurrency-calibration/release-concurrency-trend.md ]]; then
            cat release-concurrency-calibration/release-concurrency-trend.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload calibration reports and shard logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-concurrency-calibration-${{ github.run_id }}
          path: release-concurrency-calibration
          if-no-files-found: warn
          retention-days: 90

      - name: Upload machine-readable test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automated-test-results-concurrency-calibration-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/test-results.json
          if-no-files-found: error
          retention-days: 14
