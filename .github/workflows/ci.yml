name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-typescript-7-approval:
    name: Verify changed TypeScript 7 approval evidence
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check whether approval evidence changed
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" -- docs/typescript-7-resource-approval-evidence.json; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.changed.outputs.value == 'true' }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: ${{ steps.changed.outputs.value == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Install dependencies
        if: ${{ steps.changed.outputs.value == 'true' }}
        run: pnpm install --frozen-lockfile
      - name: Reject unverifiable fork approval changes
        if: ${{ steps.changed.outputs.value == 'true' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "TypeScript 7 approval evidence changes must be verified from a branch in the base repository." >&2
          exit 1
      - name: Download and verify selected CI reports
        if: ${{ steps.changed.outputs.value == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/src/verify-typescript-7-resource-approval.sh

  typescript-7-codegen-bridge:
    name: TypeScript 7 codegen bridge
    runs-on: ubuntu-latest
    env:
      TEST_RESULTS_REPORT_PATH: test-evidence/test-results.json
      TEST_RESULTS_ARTIFACT_NAME: automated-test-results-codegen-${{ github.run_id }}-${{ github.run_attempt }}
    # The disposable frozen install and generated checks must not consume an
    # unbounded runner if the registry or a codegen tool stalls.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize machine-readable test report
        run: node scripts/src/test-results.mjs init
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Run disposable TypeScript 7 codegen bridge
        run: node scripts/src/test-results.mjs run --lane ci-typescript-codegen-bridge -- pnpm run check:typescript-7-codegen-bridge
      - name: Upload machine-readable test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automated-test-results-codegen-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/test-results.json
          if-no-files-found: error
          retention-days: 14

  reviewed-docker-caddy-browser:
    name: Reviewed PR Docker/Caddy browser matrix
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 145 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/main-green-pr-audit' && github.event.pull_request.base.ref == 'main' }}
    environment: pr-145-reviewed-test-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - name: Restore exact reviewed PR CI inputs
        id: restricted-inputs
        env:
          CI_REVIEWED_INPUT_AUTHORIZATION: ${{ secrets.CI_REVIEWED_INPUT_AUTHORIZATION }}
          CI_REVIEWED_GITHUB_TOKEN: ${{ github.token }}
          REVIEWED_PR_HEAD_SHA: ${{ vars.REVIEWED_PR_HEAD_SHA }}
        run: node scripts/src/restore-restricted-ci-inputs.mjs
      - name: Install frozen dependencies and real browser engines
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/run-calculator exec playwright install --with-deps chromium webkit
      - name: Verify network policy contracts
        run: node --test scripts/src/docker-caddy-build-context.test.mjs
      - name: Run real isolated Docker/Caddy browser matrix before merge
        run: |
          docker compose version
          chromium_path="$(cd artifacts/run-calculator && node -e 'const { chromium } = require("@playwright/test"); process.stdout.write(chromium.executablePath())')"
          if [[ ! -x "$chromium_path" ]]; then
            echo "Playwright Chromium was not installed at the resolved path." >&2
            exit 1
          fi
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$chromium_path" pnpm --filter @workspace/run-calculator run test:e2e:docker-caddy
      - name: Remove exact reviewed inputs
        if: always()
        run: node scripts/src/restore-restricted-ci-inputs.mjs --cleanup

  typecheck:
    name: Typecheck
    environment: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 142 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/windows-lan-self-hosting' && github.event.pull_request.base.ref == 'main') && 'pr-142-reviewed-test-inputs' || (github.event_name == 'pull_request' && github.event.pull_request.number == 145 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/main-green-pr-audit' && github.event.pull_request.base.ref == 'main') && 'pr-145-reviewed-test-inputs' || github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'main-reviewed-test-inputs' || 'unprivileged-ci' }}
    runs-on: ubuntu-latest
    env:
      TEST_RESULTS_REPORT_PATH: test-evidence/test-results.json
      TEST_RESULTS_ARTIFACT_NAME: automated-test-results-typecheck-${{ github.run_id }}-${{ github.run_attempt }}
    # Covers workspace typechecks plus catalog and routine scripts checks;
    # observed runs fit within the bounded release typecheck budget.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - name: Restore exact reviewed PR CI inputs
        id: restricted-inputs
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 142 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/windows-lan-self-hosting' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'pull_request' && github.event.pull_request.number == 145 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/main-green-pr-audit' && github.event.pull_request.base.ref == 'main') }}
        env:
          CI_REVIEWED_INPUT_AUTHORIZATION: ${{ secrets.CI_REVIEWED_INPUT_AUTHORIZATION }}
          CI_REVIEWED_GITHUB_TOKEN: ${{ github.token }}
          REVIEWED_PR_HEAD_SHA: ${{ vars.REVIEWED_PR_HEAD_SHA }}
        run: node scripts/src/restore-restricted-ci-inputs.mjs --with-archives
      - name: Restore separate main-only reviewed CI inputs
        id: main-inputs
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CI_MAIN_INPUT_AUTHORIZATION: ${{ secrets.CI_MAIN_INPUT_AUTHORIZATION }}
          CI_REVIEWED_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/src/restore-restricted-ci-inputs.mjs --main --with-archives
      - name: Initialize machine-readable test report
        run: node scripts/src/test-results.mjs init
      # pnpm version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (workspace + libs)
        run: node scripts/src/test-results.mjs run --lane ci-typecheck -- pnpm run typecheck
      - name: Validate skill catalog
        run: node scripts/src/test-results.mjs run --lane ci-skill-catalog-check -- pnpm run check:skill-catalog
      - name: Test skill catalog contract
        run: node scripts/src/test-results.mjs run --lane ci-skill-catalog-tests -- pnpm --filter @workspace/scripts run test:skill-catalog
      - name: Require IPv6 loopback for release-node TLS tests
        run: >-
          node scripts/src/test-results.mjs run --lane ci-ipv6-loopback --
          python3 scripts/src/check-ipv6-loopback.py
      - name: Run routine scripts tests
        run: node scripts/src/test-results.mjs run --lane ci-scripts-routine -- pnpm --filter @workspace/scripts run test
      - name: Upload machine-readable test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automated-test-results-typecheck-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/test-results.json
          if-no-files-found: error
          retention-days: 14

      - name: Clean reviewed PR or main CI inputs
        if: always() && (steps.restricted-inputs.outcome != 'skipped' || steps.main-inputs.outcome != 'skipped')
        run: node scripts/src/restore-restricted-ci-inputs.mjs --cleanup


  test:
    name: Unit tests (web + libs)
    environment: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 142 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/windows-lan-self-hosting' && github.event.pull_request.base.ref == 'main') && 'pr-142-reviewed-test-inputs' || (github.event_name == 'pull_request' && github.event.pull_request.number == 145 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/main-green-pr-audit' && github.event.pull_request.base.ref == 'main') && 'pr-145-reviewed-test-inputs' || github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'main-reviewed-test-inputs' || 'unprivileged-ci' }}
    runs-on: ubuntu-latest
    env:
      TEST_RESULTS_REPORT_PATH: test-evidence/test-results.json
      TEST_RESULTS_ARTIFACT_NAME: automated-test-results-unit-${{ github.run_id }}-${{ github.run_attempt }}
    # The broad web and shared-library sweep is slower than release's
    # explicitly sharded package gates, but normally completes well below this.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore exact reviewed PR CI inputs
        id: restricted-inputs
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 142 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/windows-lan-self-hosting' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'pull_request' && github.event.pull_request.number == 145 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/main-green-pr-audit' && github.event.pull_request.base.ref == 'main') }}
        env:
          CI_REVIEWED_INPUT_AUTHORIZATION: ${{ secrets.CI_REVIEWED_INPUT_AUTHORIZATION }}
          CI_REVIEWED_GITHUB_TOKEN: ${{ github.token }}
          REVIEWED_PR_HEAD_SHA: ${{ vars.REVIEWED_PR_HEAD_SHA }}
        run: node scripts/src/restore-restricted-ci-inputs.mjs
      - name: Restore separate main-only reviewed CI inputs
        id: main-inputs
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CI_MAIN_INPUT_AUTHORIZATION: ${{ secrets.CI_MAIN_INPUT_AUTHORIZATION }}
          CI_REVIEWED_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/src/restore-restricted-ci-inputs.mjs --main
      - name: Initialize machine-readable test report
        run: node scripts/src/test-results.mjs init
      # pnpm version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Run web unit tests
        run: node scripts/src/test-results.mjs run --lane ci-client-unit -- pnpm --filter @workspace/run-calculator test
      - name: Run all shared-library unit tests (including spec-import)
        # This is the broad CI sweep. The release check intentionally runs a
        # smaller, explicit set of high-value library gates.
        run: node scripts/src/test-results.mjs run --lane ci-library-sweep -- pnpm -r --filter "./lib/**" --if-present test
      - name: Upload machine-readable test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automated-test-results-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/test-results.json
          if-no-files-found: error
          retention-days: 14
      - name: Clean reviewed PR or main CI inputs
        if: always() && (steps.restricted-inputs.outcome != 'skipped' || steps.main-inputs.outcome != 'skipped')
        run: node scripts/src/restore-restricted-ci-inputs.mjs --cleanup

  reduced-motion-browser:
    name: Reduced-motion browser previews
    environment: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 142 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/windows-lan-self-hosting' && github.event.pull_request.base.ref == 'main') && 'pr-142-reviewed-test-inputs' || (github.event_name == 'pull_request' && github.event.pull_request.number == 145 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/main-green-pr-audit' && github.event.pull_request.base.ref == 'main') && 'pr-145-reviewed-test-inputs' || github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'main-reviewed-test-inputs' || 'unprivileged-ci' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      TEST_RESULTS_REPORT_PATH: test-evidence/test-results.json
      TEST_RESULTS_ARTIFACT_NAME: automated-test-results-reduced-motion-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore exact reviewed PR CI inputs
        id: restricted-inputs
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 142 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/windows-lan-self-hosting' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'pull_request' && github.event.pull_request.number == 145 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/main-green-pr-audit' && github.event.pull_request.base.ref == 'main') }}
        env:
          CI_REVIEWED_INPUT_AUTHORIZATION: ${{ secrets.CI_REVIEWED_INPUT_AUTHORIZATION }}
          CI_REVIEWED_GITHUB_TOKEN: ${{ github.token }}
          REVIEWED_PR_HEAD_SHA: ${{ vars.REVIEWED_PR_HEAD_SHA }}
        run: node scripts/src/restore-restricted-ci-inputs.mjs
      - name: Restore separate main-only reviewed CI inputs
        id: main-inputs
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CI_MAIN_INPUT_AUTHORIZATION: ${{ secrets.CI_MAIN_INPUT_AUTHORIZATION }}
          CI_REVIEWED_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/src/restore-restricted-ci-inputs.mjs --main
      - name: Initialize machine-readable test report
        run: node scripts/src/test-results.mjs init
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and WebKit with Linux dependencies
        run: pnpm --filter @workspace/run-calculator exec playwright install --with-deps chromium webkit
      - name: Run direct HTTPS transport smoke in Chromium and WebKit
        run: node scripts/src/test-results.mjs run --lane ci-browser-https -- pnpm --filter @workspace/run-calculator run test:webkit-https
      - name: Run isolated reduced-motion browser matrix
        run: node scripts/src/test-results.mjs run --lane ci-reduced-motion-browser -- pnpm --filter @workspace/run-calculator run test:e2e:reduced-motion
      - name: Build calculator and mockup preview assets
        env:
          BUILD_IDENTITY_MODE: development
          PORT: "4185"
          BASE_PATH: /
        run: |
          pnpm --filter @workspace/run-calculator run build
          PORT=4186 BASE_PATH=/ pnpm --filter @workspace/mockup-sandbox run build
      - name: Run reduced-motion matrix against optimized bundles
        run: node scripts/src/test-results.mjs run --lane ci-reduced-motion-built-browser -- pnpm --filter @workspace/run-calculator run test:e2e:reduced-motion:built
      - name: Upload machine-readable test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automated-test-results-reduced-motion-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/test-results.json
          if-no-files-found: error
          retention-days: 14

      - name: Clean reviewed PR or main CI inputs
        if: always() && (steps.restricted-inputs.outcome != 'skipped' || steps.main-inputs.outcome != 'skipped')
        run: node scripts/src/restore-restricted-ci-inputs.mjs --cleanup


  test-release-concurrency:
    name: Release concurrency fixture tests
    runs-on: ubuntu-latest
    env:
      TEST_RESULTS_REPORT_PATH: test-evidence/test-results.json
      TEST_RESULTS_ARTIFACT_NAME: automated-test-results-concurrency-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
    # Fixture-only validation should stay short while allowing cold installs.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize machine-readable test report
        run: node scripts/src/test-results.mjs init
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Validate calibration history fixtures
        # Keep this fixture-only regression check separate from the disposable
        # Postgres calibration lane and the production release-gate inventory.
        run: node scripts/src/test-results.mjs run --lane ci-release-concurrency-fixtures -- pnpm --filter @workspace/scripts run test:release-concurrency
      - name: Upload machine-readable test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automated-test-results-concurrency-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/test-results.json
          if-no-files-found: error
          retention-days: 14

  test-db:
    name: API tests (Postgres)
    environment: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 142 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/windows-lan-self-hosting' && github.event.pull_request.base.ref == 'main') && 'pr-142-reviewed-test-inputs' || (github.event_name == 'pull_request' && github.event.pull_request.number == 145 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/main-green-pr-audit' && github.event.pull_request.base.ref == 'main') && 'pr-145-reviewed-test-inputs' || github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'main-reviewed-test-inputs' || 'unprivileged-ci' }}
    runs-on: ubuntu-latest
    # Match the standard release-check job ceiling for the full API suite.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: runcalc_ci
          POSTGRES_USER: runcalc
          POSTGRES_PASSWORD: ci-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runcalc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://runcalc:ci-secret@localhost:5432/runcalc_ci
      STAFF_SIGNUP_CODE: ci-signup-code
      INITIAL_MANAGER_USERNAME: cimanager
      INITIAL_MANAGER_ACCESS_CODE: ci-manager-code
      SESSION_SECRET: ci-session-secret
      AUTH_TOKEN_SECRET: ci-auth-token-secret
      TEST_RESULTS_REPORT_PATH: test-evidence/test-results.json
      TEST_RESULTS_ARTIFACT_NAME: automated-test-results-api-postgres-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore exact reviewed PR CI inputs
        id: restricted-inputs
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 142 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/windows-lan-self-hosting' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'pull_request' && github.event.pull_request.number == 145 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/main-green-pr-audit' && github.event.pull_request.base.ref == 'main') }}
        env:
          CI_REVIEWED_INPUT_AUTHORIZATION: ${{ secrets.CI_REVIEWED_INPUT_AUTHORIZATION }}
          CI_REVIEWED_GITHUB_TOKEN: ${{ github.token }}
          REVIEWED_PR_HEAD_SHA: ${{ vars.REVIEWED_PR_HEAD_SHA }}
        run: node scripts/src/restore-restricted-ci-inputs.mjs
      - name: Restore separate main-only reviewed CI inputs
        id: main-inputs
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CI_MAIN_INPUT_AUTHORIZATION: ${{ secrets.CI_MAIN_INPUT_AUTHORIZATION }}
          CI_REVIEWED_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/src/restore-restricted-ci-inputs.mjs --main
      - name: Initialize machine-readable test report
        run: node scripts/src/test-results.mjs init
      # pnpm version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Apply schema
        id: apply-schema
        run: pnpm --filter @workspace/db run push-force
      - name: Verify serial generators on disposable databases
        env:
