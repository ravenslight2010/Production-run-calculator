name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-typescript-7-approval:
    name: Verify changed TypeScript 7 approval evidence
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check whether approval evidence changed
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" -- docs/typescript-7-resource-approval-evidence.json; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.changed.outputs.value == 'true' }}
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - if: ${{ steps.changed.outputs.value == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - name: Install dependencies
        if: ${{ steps.changed.outputs.value == 'true' }}
        run: pnpm install --frozen-lockfile
      - name: Reject unverifiable fork approval changes
        if: ${{ steps.changed.outputs.value == 'true' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "TypeScript 7 approval evidence changes must be verified from a branch in the base repository." >&2
          exit 1
      - name: Download and verify selected CI reports
        if: ${{ steps.changed.outputs.value == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/src/verify-typescript-7-resource-approval.sh

  typescript-7-codegen-bridge:
    name: TypeScript 7 codegen bridge
    runs-on: ubuntu-latest
    env:
      TEST_RESULTS_REPORT_PATH: test-evidence/test-results.json
      TEST_RESULTS_ARTIFACT_NAME: automated-test-results-codegen-${{ github.run_id }}-${{ github.run_attempt }}
    # The disposable frozen install and generated checks must not consume an
    # unbounded runner if the registry or a codegen tool stalls.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Initialize machine-readable test report
        run: node scripts/src/test-results.mjs init
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - name: Run disposable TypeScript 7 codegen bridge
        run: node scripts/src/test-results.mjs run --lane ci-typescript-codegen-bridge -- pnpm run check:typescript-7-codegen-bridge
      - name: Upload machine-readable test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automated-test-results-codegen-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/test-results.json
          if-no-files-found: error
          retention-days: 14

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    env:
      TEST_RESULTS_REPORT_PATH: test-evidence/test-results.json
      TEST_RESULTS_ARTIFACT_NAME: automated-test-results-typecheck-${{ github.run_id }}-${{ github.run_attempt }}
    # Covers workspace typechecks plus catalog and routine scripts checks;
    # observed runs fit within the bounded release typecheck budget.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          lfs: true
      - name: Initialize machine-readable test report
        run: node scripts/src/test-results.mjs init
      # pnpm version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (workspace + libs)
        run: node scripts/src/test-results.mjs run --lane ci-typecheck -- pnpm run typecheck
      - name: Validate skill catalog
        run: node scripts/src/test-results.mjs run --lane ci-skill-catalog-check -- pnpm run check:skill-catalog
      - name: Test skill catalog contract
        run: node scripts/src/test-results.mjs run --lane ci-skill-catalog-tests -- pnpm --filter @workspace/scripts run test:skill-catalog
      - name: Run routine scripts tests
        run: node scripts/src/test-results.mjs run --lane ci-scripts-routine -- pnpm --filter @workspace/scripts run test
      - name: Upload machine-readable test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automated-test-results-typecheck-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/test-results.json
          if-no-files-found: error
          retention-days: 14

  test:
    name: Unit tests (web + libs)
    runs-on: ubuntu-latest
    env:
      TEST_RESULTS_REPORT_PATH: test-evidence/test-results.json
      TEST_RESULTS_ARTIFACT_NAME: automated-test-results-unit-${{ github.run_id }}-${{ github.run_attempt }}
    # The broad web and shared-library sweep is slower than release's
    # explicitly sharded package gates, but normally completes well below this.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Initialize machine-readable test report
        run: node scripts/src/test-results.mjs init
      # pnpm version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Run web unit tests
        run: node scripts/src/test-results.mjs run --lane ci-client-unit -- pnpm --filter @workspace/run-calculator test
      - name: Run all shared-library unit tests (including spec-import)
        # This is the broad CI sweep. The release check intentionally runs a
        # smaller, explicit set of high-value library gates.
        run: node scripts/src/test-results.mjs run --lane ci-library-sweep -- pnpm -r --filter "./lib/**" --if-present test
      - name: Upload machine-readable test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automated-test-results-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/test-results.json
          if-no-files-found: error
          retention-days: 14

  test-release-concurrency:
    name: Release concurrency fixture tests
    runs-on: ubuntu-latest
    env:
      TEST_RESULTS_REPORT_PATH: test-evidence/test-results.json
      TEST_RESULTS_ARTIFACT_NAME: automated-test-results-concurrency-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
    # Fixture-only validation should stay short while allowing cold installs.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Initialize machine-readable test report
        run: node scripts/src/test-results.mjs init
      # pnpm version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Validate calibration history fixtures
        # Keep this fixture-only regression check separate from the disposable
        # Postgres calibration lane and the production release-gate inventory.
        run: node scripts/src/test-results.mjs run --lane ci-release-concurrency-fixtures -- pnpm --filter @workspace/scripts run test:release-concurrency
      - name: Upload machine-readable test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automated-test-results-concurrency-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/test-results.json
          if-no-files-found: error
          retention-days: 14

  test-db:
    name: API tests (Postgres)
    runs-on: ubuntu-latest
    # Match the standard release-check job ceiling for the full API suite.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: runcalc_ci
          POSTGRES_USER: runcalc
          POSTGRES_PASSWORD: ci-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runcalc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://runcalc:ci-secret@localhost:5432/runcalc_ci
      STAFF_SIGNUP_CODE: ci-signup-code
      INITIAL_MANAGER_USERNAME: cimanager
      INITIAL_MANAGER_ACCESS_CODE: ci-manager-code
      SESSION_SECRET: ci-session-secret
      AUTH_TOKEN_SECRET: ci-auth-token-secret
      TEST_RESULTS_REPORT_PATH: test-evidence/test-results.json
      TEST_RESULTS_ARTIFACT_NAME: automated-test-results-api-postgres-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Initialize machine-readable test report
        run: node scripts/src/test-results.mjs init
      # pnpm version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Apply schema
        id: apply-schema
        run: pnpm --filter @workspace/db run push-force
      - name: Run API server tests
        id: run-api-server-tests
        run: node scripts/src/test-results.mjs run --lane ci-api-postgres -- pnpm --filter @workspace/api-server test
      - name: Mark API test lane blocked when schema setup failed
        if: ${{ always() && steps.apply-schema.outcome != 'success' && steps.run-api-server-tests.outcome == 'skipped' }}
        run: node scripts/src/test-results.mjs block --lane ci-api-postgres
      - name: Upload machine-readable test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automated-test-results-api-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/test-results.json
          if-no-files-found: error
          retention-days: 14

  schema-safe-rollback:
    name: Schema-safe application rollback rehearsal
    runs-on: ubuntu-latest
    env:
      TEST_RESULTS_REPORT_PATH: test-evidence/test-results.json
      TEST_RESULTS_ARTIFACT_NAME: automated-test-results-schema-rollback-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Initialize machine-readable test report
        run: node scripts/src/test-results.mjs init
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Rehearse application rollback on forward schema
        run: node scripts/src/test-results.mjs run --lane ci-schema-safe-rollback -- pnpm run check:schema-safe-rollback
      - name: Summarize rollback rehearsal evidence
        if: always()
        run: |
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" && -f rollback-rehearsal-report.md ]]; then
            cat rollback-rehearsal-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain rollback rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: schema-safe-rollback-rehearsal-${{ github.run_id }}
          path: rollback-rehearsal-report.md
          if-no-files-found: error
          retention-days: 14
      - name: Upload machine-readable test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automated-test-results-schema-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/test-results.json
          if-no-files-found: error
          retention-days: 14


  security-audit:
    name: Security audit (prod deps)
    runs-on: ubuntu-latest
    # Includes dependency installation and a network-bound audit with a
    # bounded cap so registry stalls cannot hold a runner indefinitely.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # pnpm version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Report high-severity production dependency advisories
        # Reports known advisories without blocking: what remains is Expo/Metro
        # (mobile) dev tooling only. Registry failures are ignored in this
        # informational CI lane; the release gate fails closed on either.
        continue-on-error: true
        run: pnpm run audit:prod:ci


  docker:
    name: Docker image
    runs-on: ubuntu-latest
    # Allows both cached multi-stage image builds while bounding registry or
    # build-service stalls.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build api runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: api
          push: false
          platforms: linux/amd64
          tags: |
            runcalc-api:${{ github.sha }}
          cache-from: type=gha,scope=docker-build-api-${{ github.run_id }}
          cache-to: type=gha,mode=max,scope=docker-build-api-${{ github.run_id }}

      - name: Build api migration image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: api-migrate
          push: false
          platforms: linux/amd64
          tags: |
            runcalc-api-migrate:${{ github.sha }}
          cache-from: type=gha,scope=docker-build-api-migrate-${{ github.run_id }}
          cache-to: type=gha,mode=max,scope=docker-build-api-migrate-${{ github.run_id }}

      - name: Build web image (caddy static)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: web
          push: false
          platforms: linux/amd64
          tags: |
            runcalc-web:${{ github.sha }}
          cache-from: type=gha,scope=docker-build-web-${{ github.run_id }}
          cache-to: type=gha,mode=max,scope=docker-build-web-${{ github.run_id }}

  build:
    name: Build (web + API)
    runs-on: ubuntu-latest
    # Includes dependency installation and both production bundles.
    timeout-minutes: 20
    env:
      # vite.config.ts requires both PORT and BASE_PATH at config-load time;
      # PORT is unused for the static build output but must be present.
      PORT: 3000
      BASE_PATH: /
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # pnpm version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --filter @workspace/run-calculator run build
      - name: Build API server bundle
        run: pnpm --filter @workspace/api-server run build

  aggregate-test-results:
    name: Aggregate CI test results
    if: always()
    needs:
      - typescript-7-codegen-bridge
      - typecheck
      - test
      - test-release-concurrency
      - test-db
      - schema-safe-rollback
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TEST_RESULTS_REPORT_PATH: test-evidence/merged-test-results.json
      TEST_RESULTS_ARTIFACT_NAME: automated-test-results-merged-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download test reports from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: automated-test-results-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/reports
      - name: Merge and validate run-level test report
        run: node scripts/src/test-results.mjs merge --input-dir test-evidence/reports
      - name: Upload merged machine-readable test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automated-test-results-merged-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/merged-test-results.json
          if-no-files-found: ignore
          retention-days: 14
