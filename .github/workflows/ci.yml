name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    # Covers workspace typechecks plus catalog and routine scripts checks;
    # observed runs fit within the bounded release typecheck budget.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # pnpm version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (workspace + libs)
        run: pnpm run typecheck
      - name: Validate skill catalog
        run: pnpm run check:skill-catalog
      - name: Test skill catalog contract
        run: pnpm --filter @workspace/scripts run test:skill-catalog
      - name: Run routine scripts tests
        run: pnpm --filter @workspace/scripts run test

  test:
    name: Unit tests (web + libs)
    runs-on: ubuntu-latest
    # The broad web and shared-library sweep is slower than release's
    # explicitly sharded package gates, but normally completes well below this.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # pnpm version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Run web unit tests
        run: pnpm --filter @workspace/run-calculator test
      - name: Run all shared-library unit tests (including spec-import)
        # This is the broad CI sweep. The release check intentionally runs a
        # smaller, explicit set of high-value library gates.
        run: pnpm -r --filter "./lib/**" --if-present test

  test-release-concurrency:
    name: Release concurrency fixture tests
    runs-on: ubuntu-latest
    # Fixture-only validation should stay short while allowing cold installs.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # pnpm version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Validate calibration history fixtures
        # Keep this fixture-only regression check separate from the disposable
        # Postgres calibration lane and the production release-gate inventory.
        run: pnpm --filter @workspace/scripts run test:release-concurrency

  test-db:
    name: API tests (Postgres)
    runs-on: ubuntu-latest
    # Match the standard release-check job ceiling for the full API suite.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: runcalc_ci
          POSTGRES_USER: runcalc
          POSTGRES_PASSWORD: ci-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runcalc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://runcalc:ci-secret@localhost:5432/runcalc_ci
      STAFF_SIGNUP_CODE: ci-signup-code
      INITIAL_MANAGER_USERNAME: cimanager
      INITIAL_MANAGER_ACCESS_CODE: ci-manager-code
      SESSION_SECRET: ci-session-secret
      AUTH_TOKEN_SECRET: ci-auth-token-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # pnpm version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Apply schema
        run: pnpm --filter @workspace/db run push-force
      - name: Run API server tests
        run: pnpm --filter @workspace/api-server test

  schema-safe-rollback:
    name: Schema-safe application rollback rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Rehearse application rollback on forward schema
        run: pnpm run check:schema-safe-rollback
      - name: Summarize rollback rehearsal evidence
        if: always()
        run: |
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" && -f rollback-rehearsal-report.md ]]; then
            cat rollback-rehearsal-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain rollback rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: schema-safe-rollback-rehearsal-${{ github.run_id }}
          path: rollback-rehearsal-report.md
          if-no-files-found: error
          retention-days: 14


  security-audit:
    name: Security audit (prod deps)
    runs-on: ubuntu-latest
    # Includes dependency installation and a network-bound audit with a
    # bounded cap so registry stalls cannot hold a runner indefinitely.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # pnpm version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Report high-severity production dependency advisories
        # Reports known advisories without blocking: what remains is Expo/Metro
        # (mobile) dev tooling only. Registry failures are ignored in this
        # informational CI lane; the release gate fails closed on either.
        continue-on-error: true
        run: pnpm run audit:prod:ci


  docker:
    name: Docker image
    runs-on: ubuntu-latest
    # Allows both cached multi-stage image builds while bounding registry or
    # build-service stalls.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build api runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: api
          push: false
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/runcalc-api:${{ github.sha }}
          cache-from: type=gha,scope=docker-build-${{ github.run_id }}
          cache-to: type=gha,mode=max,scope=docker-build-${{ github.run_id }}

      - name: Build api migration image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: api-migrate
          push: false
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/runcalc-api-migrate:${{ github.sha }}
          cache-from: type=gha,scope=docker-build-${{ github.run_id }}
          cache-to: type=gha,mode=max,scope=docker-build-${{ github.run_id }}

      - name: Build web image (caddy static)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: web
          push: false
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/runcalc-web:${{ github.sha }}
          cache-from: type=gha,scope=docker-build-${{ github.run_id }}
          cache-to: type=gha,mode=max,scope=docker-build-${{ github.run_id }}

  docker-publish:
    name: Publish Docker images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # workflow-contract: write-exception
      # Main-branch publication is the only job allowed to write package images.
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish api runtime image
        id: publish-api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: api
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/runcalc-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=docker-publish-api-${{ github.run_id }}
          cache-to: type=gha,mode=max,scope=docker-publish-api-${{ github.run_id }}
      - name: Publish api migration image
        id: publish-api-migrate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: api-migrate
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/runcalc-api-migrate:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=docker-publish-api-migrate-${{ github.run_id }}
          cache-to: type=gha,mode=max,scope=docker-publish-api-migrate-${{ github.run_id }}
      - name: Publish web image (caddy static)
        id: publish-web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: web
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/runcalc-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=docker-publish-web-${{ github.run_id }}
          cache-to: type=gha,mode=max,scope=docker-publish-web-${{ github.run_id }}
      - name: Verify published container provenance
        if: always()
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          PRODUCER_WORKFLOW_RUN_ID: ${{ github.run_id }}
          PRODUCER_WORKFLOW: .github/workflows/ci.yml
          API_IMAGE: ghcr.io/${{ github.repository_owner }}/runcalc-api
          API_MIGRATE_IMAGE: ghcr.io/${{ github.repository_owner }}/runcalc-api-migrate
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/runcalc-web
          API_DIGEST: ${{ steps.publish-api.outputs.digest }}
          API_MIGRATE_DIGEST: ${{ steps.publish-api-migrate.outputs.digest }}
          WEB_DIGEST: ${{ steps.publish-web.outputs.digest }}
          PROVENANCE_REPORT: ${{ runner.temp }}/release-evidence-container-images.txt
        run: bash scripts/src/verify-published-container-provenance.sh
      - name: Retain container image release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-container-images-${{ github.run_id }}
          path: ${{ runner.temp }}/release-evidence-container-images.txt
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build (web + API)
    runs-on: ubuntu-latest
    # Includes dependency installation and both production bundles.
    timeout-minutes: 20
    env:
      # vite.config.ts requires both PORT and BASE_PATH at config-load time;
      # PORT is unused for the static build output but must be present.
      PORT: 3000
      BASE_PATH: /
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # pnpm version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --filter @workspace/run-calculator run build
      - name: Build API server bundle
        run: pnpm --filter @workspace/api-server run build
