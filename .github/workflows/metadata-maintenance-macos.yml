name: Metadata maintenance macOS

on:
  pull_request:
    paths:
      - ".github/workflows/metadata-maintenance-macos.yml"
      - "docs/metadata-maintenance-macos.md"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/src/distill-backfill.mts"
      - "scripts/src/distill-backfill.test.mts"
      - "scripts/src/metadata-darwin.py"
      - "scripts/src/metadata-process-identity.mts"
      - "scripts/src/run-release-darwin.py"
      - "scripts/src/run-release-node.sh"
      - "scripts/tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metadata-maintenance-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: ${{ matrix.os }} metadata locks, recovery and typecheck
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Record native runtime
        run: |
          uname -sm
          node -e 'console.log(JSON.stringify({platform: process.platform, arch: process.arch, node: process.version}))'
          pnpm --version
          python3 --version
      - name: Run synthetic metadata lock recovery tests
        run: bash scripts/src/run-release-node.sh pnpm --filter @workspace/scripts exec tsx ./src/distill-backfill.test.mts
      - name: Build referenced library declarations
        run: bash scripts/src/run-release-node.sh pnpm run typecheck:libs
      - name: Typecheck scripts
        run: bash scripts/src/run-release-node.sh pnpm --filter @workspace/scripts run typecheck
