name: Department navigation browser evidence

on:
  pull_request:
  workflow_dispatch:

jobs:
  department-navigation:
    name: Desktop and phone department journey
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: department_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d department_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/department_e2e
      SESSION_SECRET: department-navigation-ci-session
      STAFF_SIGNUP_CODE: department-navigation-ci
      NODE_ENV: test
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
      E2E_TEST_DB: "1"
      E2E_APPROVED_DESTRUCTIVE_MODE: "1"
      # /api/healthz deliberately reports 503 when an API dependency is not
      # configured. This journey never calls AI, so use a non-secret fixture
      # value that also works for pull requests from forks.
      AI_INTEGRATIONS_GEMINI_API_KEY: department-navigation-configured
      # Vite otherwise defaults its same-origin /api proxy to port 8080. This
      # journey starts the API on 5000, so make browser API calls reach that
      # ready server rather than receiving the proxy's 503.
      VITE_API_PROXY_TARGET: http://127.0.0.1:5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check responsive department projects
        run: pnpm --filter @workspace/scripts run check-department-playwright-projects

      - name: Apply schema to disposable database
        run: pnpm --filter @workspace/db run push-force

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Start API server
        run: |
          PORT=5000 pnpm --filter @workspace/api-server run start > /tmp/department-api.log 2>&1 &
          echo "API_SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for API server
        run: |
          : > /tmp/department-readiness.log
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error \
              --output /tmp/department-readiness-body.json \
              --write-out '%{http_code}' \
              http://127.0.0.1:5000/api/readyz || true)"
            printf 'attempt=%s status=%s body=' "$attempt" "$status" >> /tmp/department-readiness.log
            cat /tmp/department-readiness-body.json >> /tmp/department-readiness.log 2>/dev/null || true
            printf '\n' >> /tmp/department-readiness.log
            if [ "$status" = "200" ]; then
              exit 0
            fi
            # A failed startup is terminal. Retain its structured stage/error
            # instead of retrying the same genuine failure for another minute.
            if grep -q '"phase":"failed"' /tmp/department-readiness-body.json 2>/dev/null; then
              cat /tmp/department-readiness.log
              cat /tmp/department-api.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/department-readiness.log
          cat /tmp/department-api.log
          exit 1

      - name: Start web server
        run: |
          pnpm --filter @workspace/run-calculator run dev > /tmp/department-web.log 2>&1 &
          echo "WEB_SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for web server
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/department-web.log
          exit 1

      - name: Verify browser API proxy
        run: |
          {
            echo "direct_api_liveness"
            curl --fail --silent --show-error --include http://127.0.0.1:5000/api/livez
            echo
            echo "vite_proxy_liveness"
            curl --fail --silent --show-error --include http://127.0.0.1:5173/api/livez
          } > /tmp/department-proxy.log 2>&1 || {
            cat /tmp/department-proxy.log
            cat /tmp/department-web.log
            cat /tmp/department-api.log
            exit 1
          }

      - name: Run department navigation evidence
        run: pnpm --filter @workspace/run-calculator run test:e2e:department

      - name: Upload browser server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: department-navigation-server-logs
          path: /tmp/department-*.log

      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: department-navigation-playwright-evidence
          path: |
            artifacts/run-calculator/playwright-report
            artifacts/run-calculator/test-results/department
          if-no-files-found: warn

      - name: Stop browser servers
        if: always()
        run: |
          kill "${WEB_SERVER_PID:-}" "${API_SERVER_PID:-}" 2>/dev/null || true
