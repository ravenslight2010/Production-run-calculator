name: Release check

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_full:
        description: Run the full browser and phone/tablet WebKit release journeys and retain full evidence
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release-check-standard:
    name: Release gates and retained standard evidence
    environment: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 142 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/windows-lan-self-hosting' && github.event.pull_request.base.ref == 'main') && 'pr-142-reviewed-test-inputs' || (github.event_name == 'pull_request' && github.event.pull_request.number == 145 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/main-green-pr-audit' && github.event.pull_request.base.ref == 'main') && 'pr-145-reviewed-test-inputs' || github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'main-reviewed-test-inputs' || 'unprivileged-ci' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read

    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: release_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d release_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/release_check
      SESSION_SECRET: release-check-ci-session
      STAFF_SIGNUP_CODE: release-check-ci
      NODE_ENV: test
      E2E_TEST_DB: "1"
      E2E_APPROVED_DESTRUCTIVE_MODE: "1"
      # A fresh service database cannot prove the retained production repair
      # history. The verifier's focused tests run in ordinary CI; release-check
      # refuses this switch outside this disposable CI contract.
      RELEASE_CHECK_SKIP_PRODUCTION_SOURCE_LIBRARY_RECONCILIATION: "1"
      SOURCE_LIBRARY_RECONCILIATION_ENVIRONMENT: development
      OPERATIONAL_REPORT_SIGNING_KEYS: '{"activeKeyId":"release-check-current","keys":{"release-check-current":"release-check-disposable-signing-key-000000000000000000000000"}}'
      REPORT_KEY_ROTATION_PREFLIGHT_ENVIRONMENT: disposable-ci
      RELEASE_EVIDENCE_DIR: release-evidence
      RELEASE_CHECK_MAX_CONCURRENCY: "4"
      TEST_RESULTS_REPORT_PATH: test-evidence/test-results.json
      TEST_RESULTS_ARTIFACT_NAME: automated-test-results-release-standard-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Isolated zip-asset inventory gates inspect the real archives, not
          # LFS pointer files.
          lfs: true
      - name: Restore exact reviewed PR CI inputs
        id: restricted-inputs
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 142 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/windows-lan-self-hosting' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'pull_request' && github.event.pull_request.number == 145 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/main-green-pr-audit' && github.event.pull_request.base.ref == 'main') }}
        env:
          CI_REVIEWED_INPUT_AUTHORIZATION: ${{ secrets.CI_REVIEWED_INPUT_AUTHORIZATION }}
          CI_REVIEWED_GITHUB_TOKEN: ${{ github.token }}
          REVIEWED_PR_HEAD_SHA: ${{ vars.REVIEWED_PR_HEAD_SHA }}
        run: node scripts/src/restore-restricted-ci-inputs.mjs --with-archives
      - name: Restore separate main-only reviewed CI inputs
        id: main-inputs
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CI_MAIN_INPUT_AUTHORIZATION: ${{ secrets.CI_MAIN_INPUT_AUTHORIZATION }}
          CI_REVIEWED_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/src/restore-restricted-ci-inputs.mjs --main --with-archives
      - name: Initialize machine-readable test report
        run: node scripts/src/test-results.mjs init

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"

      - name: Install PostgreSQL binaries for isolated browser and sync gates
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql
          pg_bin="$(dirname "$(find /usr/lib/postgresql -type f -name postgres | sort -V | tail -1)")"
          echo "$pg_bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bash scripts/src/run-release-node.sh pnpm install --frozen-lockfile

      - name: Build production API image and verify its Node.js version
        run: |
          set -euo pipefail
          api_image="release-check-api:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expected_node_version="v$(tr -d '\r\n' < .nvmrc)"
          docker build --pull --target api --tag "$api_image" .
          actual_node_version="$(docker run --rm "$api_image" node --version)"
          if [[ "$actual_node_version" != "$expected_node_version" ]]; then
            echo "Production API image Node.js version ${actual_node_version} does not match .nvmrc (${expected_node_version})." >&2
            exit 1
          fi
          printf 'Production API image Node.js version matches .nvmrc: %s\n' "$actual_node_version"

      - name: Install WebKit and Linux runtime dependencies
        run: pnpm --filter @workspace/run-calculator exec playwright install --with-deps webkit

      - name: Remove stale evidence
        run: rm -rf release-evidence && mkdir -p release-evidence

      - name: Collect prior TypeScript 7 comparison evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/src/fetch-typescript-7-history.sh

      - name: Apply schema to disposable database
        run: pnpm --filter @workspace/db run push-force

      - name: Run release gates once and retain standard evidence
        id: run-standard-release-check
        env:
          TYPESCRIPT_7_RUNNER_IMAGE: ${{ runner.os }}-${{ runner.arch }}
          TYPESCRIPT_7_DECLARATION_CONTRACT_ARTIFACT_DIR: ${{ runner.temp }}/typescript-7-contract-standard-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/src/test-results.mjs run --lane release-standard -- pnpm run release:check

      - name: Verify compact TypeScript declaration artifact
        if: always()
        id: verify-standard-typescript-contract-artifact
        env:
          TYPESCRIPT_7_DECLARATION_CONTRACT_ARTIFACT_DIR: ${{ runner.temp }}/typescript-7-contract-standard-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          pnpm --filter @workspace/scripts exec tsx
          ./src/typescript-7-contract-artifact.mts verify
          "$TYPESCRIPT_7_DECLARATION_CONTRACT_ARTIFACT_DIR"

      - name: Upload compact TypeScript declaration artifact
        if: ${{ always() && steps.verify-standard-typescript-contract-artifact.outputs.available == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-7-declaration-contracts-standard-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/typescript-7-contract-standard-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

      - name: Mark standard release lane blocked when setup failed
        if: ${{ always() && steps.run-standard-release-check.outcome == 'skipped' }}
        run: node scripts/src/test-results.mjs block --lane release-standard


      - name: Verify release evidence allowlist
        if: always()
        run: pnpm --filter @workspace/scripts run check:release-evidence

      - name: Generate standard release evidence handoff
        if: always()
        continue-on-error: true
        env:
          HANDOFF_MODE: standard
          HANDOFF_EVIDENCE_DIR: release-evidence
        run: |
          mkdir -p "$HANDOFF_EVIDENCE_DIR"
          handoff_path="$HANDOFF_EVIDENCE_DIR/release-evidence-handoff.md"
          if revision="$(bash scripts/src/run-release-node.sh node --input-type=module -e \
            'import { captureReleaseIdentity } from "./scripts/src/release-source-identity.mjs"; console.log(captureReleaseIdentity(process.cwd()).revision)')"; then
            :
          else
            revision=""
          fi
          handoff_status=127
          if [[ "$revision" =~ ^test-sha256:[a-f0-9]{64}$ ]]; then
            if bash scripts/src/run-release-node.sh \
              pnpm --filter @workspace/scripts exec tsx \
              ./src/release-evidence-handoff.mts \
              --mode "$HANDOFF_MODE" \
              --revision "$revision" \
              --evidence-dir "$HANDOFF_EVIDENCE_DIR" \
              > "$handoff_path" 2>/dev/null; then
              handoff_status=0
            else
              handoff_status=$?
            fi
          fi
          if [[ "$handoff_status" -eq 0 ]] \
            && grep -Fqx "# Release Evidence Handoff" "$handoff_path" \
            && grep -Fqx "Requested mode: **$HANDOFF_MODE**" "$handoff_path" \
            && grep -Fqx "Requested revision: \`$revision\`" "$handoff_path" \
            && grep -Fqx "Test evidence status: **PASS**" "$handoff_path" \
            && grep -Fq "Production GO: NOT CLAIMED" "$handoff_path"; then
            exit 0
          fi
          if [[ "$handoff_status" -ne 0 ]] \
            && grep -Fqx "# Release Evidence Handoff" "$handoff_path" \
            && grep -Fqx "Requested mode: **$HANDOFF_MODE**" "$handoff_path" \
            && grep -Fqx "Requested revision: \`$revision\`" "$handoff_path" \
            && grep -Eq '^Test evidence status: \*\*(FAIL|NO-GO|MISSING|STALE|INCOMPLETE|INCOMPLETE CHECKPOINT)\*\*$' "$handoff_path" \
            && grep -Fq "Production GO: NOT CLAIMED" "$handoff_path"; then
            exit 0
          fi
          requested_revision="${revision:-unavailable}"
          cat > "$handoff_path" <<EOF
          # Release Evidence Handoff

          Requested mode: **$HANDOFF_MODE**
          Requested revision: \`$requested_revision\`
          Test evidence status: **INCOMPLETE**
          Handoff generation: **FAILED**

          The revision-bound handoff could not be generated or validated. Review the retained report and checkpoint separately; this status is not a release pass.

          **Production GO: NOT CLAIMED by this handoff.**
          EOF

      - name: Upload standard release evidence
        if: always()
        id: upload-standard-release-evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-standard-${{ github.run_id }}
          path: release-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Upload machine-readable test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automated-test-results-release-standard-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/test-results.json
          if-no-files-found: error
          retention-days: 14

      - name: Summarize stopped standard release check
        if: always()
        env:
          CHECKPOINT_DIR: release-evidence
          CHECKPOINT_ARTIFACT_URL: ${{ steps.upload-standard-release-evidence.outputs.artifact-url }}
          CHECKPOINT_ARTIFACT_NAME: release-evidence-standard-${{ github.run_id }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_BASE_REPOSITORY: ${{ github.repository }}
          RELEASE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          RELEASE_CHECK_OUTCOME: ${{ steps.run-standard-release-check.outcome }}
          RELEASE_MODE: standard
          VERIFY_CHECKPOINT_ARTIFACT_LINK: "1"
          RESUME_COMMAND: pnpm run release:check -- --resume
          REGENERATE_COMMAND: pnpm run release:check
        run: |
          bash scripts/src/release-stopped-summary.sh

      - name: Clean reviewed PR or main CI inputs
        if: always() && (steps.restricted-inputs.outcome != 'skipped' || steps.main-inputs.outcome != 'skipped')
        run: node scripts/src/restore-restricted-ci-inputs.mjs --cleanup


  release-check-full:
    environment: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 142 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/windows-lan-self-hosting' && github.event.pull_request.base.ref == 'main') && 'pr-142-reviewed-test-inputs' || (github.event_name == 'pull_request' && github.event.pull_request.number == 145 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/main-green-pr-audit' && github.event.pull_request.base.ref == 'main') && 'pr-145-reviewed-test-inputs' || github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'main-reviewed-test-inputs' || 'unprivileged-ci' }}
    name: Release gates and retained full evidence
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read

    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: release_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d release_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/release_check
      SESSION_SECRET: release-check-ci-session
      STAFF_SIGNUP_CODE: release-check-ci
      NODE_ENV: test
      E2E_TEST_DB: "1"
      E2E_APPROVED_DESTRUCTIVE_MODE: "1"
      # See the standard job: this excludes unavailable production history,
      # not synthetic production reconciliation evidence.
      RELEASE_CHECK_SKIP_PRODUCTION_SOURCE_LIBRARY_RECONCILIATION: "1"
      SOURCE_LIBRARY_RECONCILIATION_ENVIRONMENT: development
      OPERATIONAL_REPORT_SIGNING_KEYS: '{"activeKeyId":"release-check-current","keys":{"release-check-current":"release-check-disposable-signing-key-000000000000000000000000"}}'
      REPORT_KEY_ROTATION_PREFLIGHT_ENVIRONMENT: disposable-ci
      RELEASE_EVIDENCE_DIR: release-evidence-full
      RELEASE_CHECK_MAX_CONCURRENCY: "4"
      TEST_RESULTS_REPORT_PATH: test-evidence/test-results.json
      TEST_RESULTS_ARTIFACT_NAME: automated-test-results-release-full-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Isolated zip-asset inventory gates inspect the real archives, not
          # LFS pointer files.
          lfs: true
      - name: Restore exact reviewed PR CI inputs
        id: restricted-inputs
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 142 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/windows-lan-self-hosting' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'pull_request' && github.event.pull_request.number == 145 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/main-green-pr-audit' && github.event.pull_request.base.ref == 'main') }}
        env:
          CI_REVIEWED_INPUT_AUTHORIZATION: ${{ secrets.CI_REVIEWED_INPUT_AUTHORIZATION }}
          CI_REVIEWED_GITHUB_TOKEN: ${{ github.token }}
          REVIEWED_PR_HEAD_SHA: ${{ vars.REVIEWED_PR_HEAD_SHA }}
        run: node scripts/src/restore-restricted-ci-inputs.mjs --with-archives
      - name: Restore separate main-only reviewed CI inputs
        id: main-inputs
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CI_MAIN_INPUT_AUTHORIZATION: ${{ secrets.CI_MAIN_INPUT_AUTHORIZATION }}
          CI_REVIEWED_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/src/restore-restricted-ci-inputs.mjs --main --with-archives
      - name: Initialize machine-readable test report
        run: node scripts/src/test-results.mjs init

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"

      - name: Install PostgreSQL binaries for isolated browser and sync gates
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql
          pg_bin="$(dirname "$(find /usr/lib/postgresql -type f -name postgres | sort -V | tail -1)")"
          echo "$pg_bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bash scripts/src/run-release-node.sh pnpm install --frozen-lockfile

      - name: Install WebKit and Linux runtime dependencies
        run: pnpm --filter @workspace/run-calculator exec playwright install --with-deps webkit

      - name: Remove stale full evidence
        run: rm -rf release-evidence-full && mkdir -p release-evidence-full

      - name: Collect prior TypeScript 7 comparison evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/src/fetch-typescript-7-history.sh

      - name: Apply schema to disposable database
        run: pnpm --filter @workspace/db run push-force

      - name: Remove stale responsive WebKit diagnostics
        env:
          PLAYWRIGHT_COMPATIBILITY_DEBUG_DIR: ${{ runner.temp }}/responsive-webkit-debug-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [[ "$PLAYWRIGHT_COMPATIBILITY_DEBUG_DIR" != "$RUNNER_TEMP"/responsive-webkit-debug-* ]]; then
            echo "Responsive WebKit debug output must stay under the runner temporary directory." >&2
            exit 1
          fi
          rm -rf -- "$PLAYWRIGHT_COMPATIBILITY_DEBUG_DIR"

      - name: Run release gates once and retain full evidence
        id: run-full-release-check
        env:
          TYPESCRIPT_7_RUNNER_IMAGE: ${{ runner.os }}-${{ runner.arch }}
          TYPESCRIPT_7_DECLARATION_CONTRACT_ARTIFACT_DIR: ${{ runner.temp }}/typescript-7-contract-full-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_COMPATIBILITY_DEBUG_DIR: ${{ runner.temp }}/responsive-webkit-debug-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/src/test-results.mjs run --lane release-full -- pnpm run release:check:full

      - name: Verify compact TypeScript declaration artifact
        if: always()
        id: verify-full-typescript-contract-artifact
        env:
          TYPESCRIPT_7_DECLARATION_CONTRACT_ARTIFACT_DIR: ${{ runner.temp }}/typescript-7-contract-full-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          pnpm --filter @workspace/scripts exec tsx
          ./src/typescript-7-contract-artifact.mts verify
          "$TYPESCRIPT_7_DECLARATION_CONTRACT_ARTIFACT_DIR"

      - name: Upload compact TypeScript declaration artifact
        if: ${{ always() && steps.verify-full-typescript-contract-artifact.outputs.available == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-7-declaration-contracts-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/typescript-7-contract-full-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

      - name: Mark full release lane blocked when setup failed
        if: ${{ always() && steps.run-full-release-check.outcome == 'skipped' }}
        run: node scripts/src/test-results.mjs block --lane release-full


      - name: Verify full release evidence allowlist
        if: always()
        run: pnpm run release:check:full -- --verify-evidence

      - name: Generate full release evidence handoff
        if: always()
        continue-on-error: true
        env:
          HANDOFF_MODE: full
          HANDOFF_EVIDENCE_DIR: release-evidence-full
        run: |
          mkdir -p "$HANDOFF_EVIDENCE_DIR"
          handoff_path="$HANDOFF_EVIDENCE_DIR/release-evidence-handoff.md"
          if revision="$(bash scripts/src/run-release-node.sh node --input-type=module -e \
            'import { captureReleaseIdentity } from "./scripts/src/release-source-identity.mjs"; console.log(captureReleaseIdentity(process.cwd()).revision)')"; then
            :
          else
            revision=""
          fi
          handoff_status=127
          if [[ "$revision" =~ ^test-sha256:[a-f0-9]{64}$ ]]; then
            if bash scripts/src/run-release-node.sh \
              pnpm --filter @workspace/scripts exec tsx \
              ./src/release-evidence-handoff.mts \
              --mode "$HANDOFF_MODE" \
              --revision "$revision" \
              --evidence-dir "$HANDOFF_EVIDENCE_DIR" \
              > "$handoff_path" 2>/dev/null; then
              handoff_status=0
            else
              handoff_status=$?
            fi
          fi
          if [[ "$handoff_status" -eq 0 ]] \
            && grep -Fqx "# Release Evidence Handoff" "$handoff_path" \
            && grep -Fqx "Requested mode: **$HANDOFF_MODE**" "$handoff_path" \
            && grep -Fqx "Requested revision: \`$revision\`" "$handoff_path" \
            && grep -Fqx "Test evidence status: **PASS**" "$handoff_path" \
            && grep -Fq "Production GO: NOT CLAIMED" "$handoff_path"; then
            exit 0
          fi
          if [[ "$handoff_status" -ne 0 ]] \
            && grep -Fqx "# Release Evidence Handoff" "$handoff_path" \
            && grep -Fqx "Requested mode: **$HANDOFF_MODE**" "$handoff_path" \
            && grep -Fqx "Requested revision: \`$revision\`" "$handoff_path" \
            && grep -Eq '^Test evidence status: \*\*(FAIL|NO-GO|MISSING|STALE|INCOMPLETE|INCOMPLETE CHECKPOINT)\*\*$' "$handoff_path" \
            && grep -Fq "Production GO: NOT CLAIMED" "$handoff_path"; then
            exit 0
          fi
          requested_revision="${revision:-unavailable}"
          cat > "$handoff_path" <<EOF
          # Release Evidence Handoff

          Requested mode: **$HANDOFF_MODE**
          Requested revision: \`$requested_revision\`
          Test evidence status: **INCOMPLETE**
          Handoff generation: **FAILED**

          The revision-bound handoff could not be generated or validated. Review the retained report and checkpoint separately; this status is not a release pass.

          **Production GO: NOT CLAIMED by this handoff.**
          EOF

      - name: Upload full release evidence
        if: always()
        id: upload-full-release-evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-full-${{ github.run_id }}
          path: release-evidence-full
          if-no-files-found: warn
          retention-days: 14

      - name: Upload machine-readable test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automated-test-results-release-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/test-results.json
          if-no-files-found: error
          retention-days: 14

      - name: Check for sanitized responsive WebKit diagnostics
        if: always()
        id: responsive-webkit-debug-artifact
        env:
          DEBUG_DIR: ${{ runner.temp }}/responsive-webkit-debug-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [[ -f "$DEBUG_DIR/manifest.json" && -f "$DEBUG_DIR/trace-summary.json" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload sanitized responsive WebKit failure diagnostics
        if: always() && steps.responsive-webkit-debug-artifact.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: responsive-webkit-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/responsive-webkit-debug-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 3

      - name: Summarize stopped full release check
        if: always()
        env:
          CHECKPOINT_DIR: release-evidence-full
          CHECKPOINT_ARTIFACT_URL: ${{ steps.upload-full-release-evidence.outputs.artifact-url }}
          CHECKPOINT_ARTIFACT_NAME: release-evidence-full-${{ github.run_id }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_BASE_REPOSITORY: ${{ github.repository }}
          RELEASE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          RELEASE_CHECK_OUTCOME: ${{ steps.run-full-release-check.outcome }}
          RELEASE_MODE: full
          VERIFY_CHECKPOINT_ARTIFACT_LINK: "1"
          RESUME_COMMAND: pnpm run release:check:full -- --resume
          REGENERATE_COMMAND: pnpm run release:check:full
        run: |
          bash scripts/src/release-stopped-summary.sh

      - name: Clean reviewed PR or main CI inputs
        if: always() && (steps.restricted-inputs.outcome != 'skipped' || steps.main-inputs.outcome != 'skipped')
        run: node scripts/src/restore-restricted-ci-inputs.mjs --cleanup


  aggregate-test-results:
    name: Aggregate release test results
    if: always()
    needs:
      - release-check-standard
      - release-check-full
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TEST_RESULTS_REPORT_PATH: test-evidence/merged-test-results.json
      TEST_RESULTS_ARTIFACT_NAME: automated-test-results-merged-release-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_RESULTS_EXPECT_FULL_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # download-artifact v8 flattens even pattern downloads when only one
      # artifact matches. Use explicit producer names and directories so the
      # merger can verify directory/report provenance in standard AND full runs.
      - name: Download release test reports from this workflow run
        id: download-release-test-reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: automated-test-results-release-standard-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/reports/automated-test-results-release-standard-${{ github.run_id }}-${{ github.run_attempt }}
          digest-mismatch: error
      - name: Download full release test report from this workflow run
        id: download-full-release-test-report
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: automated-test-results-release-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/reports/automated-test-results-release-full-${{ github.run_id }}-${{ github.run_attempt }}
          digest-mismatch: error
      - name: Merge and validate run-level test report
        id: merge-release-test-report
        run: node scripts/src/test-results.mjs merge --input-dir test-evidence/reports
      - name: Upload merged machine-readable test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automated-test-results-merged-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/merged-test-results.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Summarize missing merged test report
        if: ${{ always() && (steps.download-release-test-reports.outcome != 'success' || steps.merge-release-test-report.outcome != 'success') }}
        env:
          TEST_RESULTS_DOWNLOAD_OUTCOME: ${{ steps.download-release-test-reports.outcome == 'success' && (steps.download-full-release-test-report.outcome == 'success' || steps.download-full-release-test-report.outcome == 'skipped') && 'success' || 'failure' }}
          TEST_RESULTS_MERGE_OUTCOME: ${{ steps.merge-release-test-report.outcome }}
        run: node scripts/src/test-results.mjs summarize-aggregation
