name: Windows metadata maintenance

on:
  pull_request:
    paths:
      - ".github/workflows/windows-metadata-maintenance.yml"
      - "docs/windows-metadata-maintenance.md"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "scripts/**"
      - "lib/distill-dataset/**"
      - "lib/spec-import/**"

permissions:
  contents: read

concurrency:
  group: windows-metadata-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Native Windows x64 metadata lock and focused tests
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          architecture: x64
      - name: Verify supported runtime
        shell: pwsh
        run: |
          $manifest = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedPnpm = $manifest.packageManager -replace '^pnpm@', ''
          if ((pnpm --version) -ne $expectedPnpm) { throw "Unexpected pnpm version" }
          if ([Environment]::Is64BitOperatingSystem -eq $false -or
              [Environment]::Is64BitProcess -eq $false) { throw "Windows x64 is required" }
          $powershell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $version = & $powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($version -notlike "5.1*") { throw "Windows PowerShell 5.1 is required" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/scripts run test:metadata-maintenance
      - run: pnpm --filter @workspace/distill-dataset run test
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/scripts run typecheck
