name: Local AI smoke check

# Manual-only verification that the local-first AI adapter
# (lib/integrations-openai-ai-server) works against a REAL self-hosted
# OpenAI-compatible server, not just the in-process mock used by the routine
# `pnpm --filter @workspace/scripts run test` gate.
#
# WHY: The adapter dispatches to a self-hosted server when LOCAL_AI_BASE_URL is
# set and to Gemini otherwise (see lib/integrations-openai-ai-server/src/
# client.ts and models.ts). The routine test suite only exercises the mock path
# so it stays fast and offline. This workflow closes that gap by running a real
# OpenAI-compatible server on the runner, pointing the adapter at it, and
# running the same smoke check in real mode. It is workflow_dispatch-only
# because it pulls a container image and model weights, which is too heavy for
# every PR.
#
# PROVENANCE: This workflow deliberately does NOT download any executable or
# archive. Per .github/workflows/ci-binary-provenance.md, a direct CI binary
# download requires a verifiable GitHub artifact attestation, which the model
# server and model publishers do not provide. Instead the server runs from a
# digest-pinned container image and the model is pulled inside that container,
# matching the repository's pinned-service-image policy.
#
# The check itself lives in scripts/src/check-local-ai.mts and is also run
# locally via `pnpm --filter @workspace/scripts run check:local-ai`.

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Ollama model tag to serve (e.g. qwen2.5:0.5b)'
        required: false
        default: 'qwen2.5:0.5b'

permissions:
  contents: read

concurrency:
  group: local-ai-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-ai-smoke:
    name: Real-mode local AI adapter smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Digest-pinned Ollama image (see the provenance inventory). Never
      # override this with an unpinned tag: the image is the trust boundary.
      OLLAMA_IMAGE: ollama/ollama@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
      OLLAMA_CONTAINER: local-ai-ollama
      MODEL: ${{ inputs.model || 'qwen2.5:0.5b' }}
      # Point the adapter at the container started below. LOCAL_AI_BASE_URL is
      # the switch that selects the self-hosted backend over Gemini.
      LOCAL_AI_BASE_URL: http://127.0.0.1:11434/v1
      LOCAL_AI_API_KEY: ollama
      LOCAL_MODEL_FULL: ${{ inputs.model || 'qwen2.5:0.5b' }}
      LOCAL_MODEL_CHEAP: ${{ inputs.model || 'qwen2.5:0.5b' }}
      # Force the transport-failure path to surface instead of silently falling
      # back to Gemini, so a broken local server fails the job loudly.
      LOCAL_AI_FALLBACK_TO_GEMINI: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Ollama server (digest-pinned container)
        run: |
          set -euo pipefail
          docker run --detach \
            --name "$OLLAMA_CONTAINER" \
            --publish 11434:11434 \
            --env OLLAMA_HOST=0.0.0.0:11434 \
            "$OLLAMA_IMAGE"

      - name: Wait for Ollama server
        run: |
          set -euo pipefail
          echo "Waiting for Ollama on port 11434…"
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:11434/v1/models > /dev/null 2>&1; then
              echo "Ollama ready (attempt ${attempt})."
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Ollama did not become ready within 120 s."
          docker logs "$OLLAMA_CONTAINER" || true
          exit 1

      - name: Pull the model inside the container
        run: |
          set -euo pipefail
          echo "Pulling ${MODEL} inside the container…"
          for attempt in $(seq 1 3); do
            if docker exec "$OLLAMA_CONTAINER" ollama pull "$MODEL"; then
              exit 0
            fi
            echo "Pull attempt ${attempt} failed; retrying…"
            sleep 5
          done
          echo "ERROR: could not pull ${MODEL} after 3 attempts."
          exit 1

      - name: Run local AI adapter smoke check (real mode)
        run: pnpm --filter @workspace/scripts run check:local-ai

      - name: Capture Ollama server log
        if: always()
        run: docker logs "$OLLAMA_CONTAINER" > /tmp/ollama-server.log 2>&1 || true

      - name: Upload Ollama server log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ollama-server-log-${{ github.run_id }}
          path: /tmp/ollama-server.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Ollama server
        if: always()
        run: docker rm --force "$OLLAMA_CONTAINER" || true
