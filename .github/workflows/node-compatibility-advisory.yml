name: Node Compatibility Advisory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/node-compatibility-advisory.yml"
      - "Dockerfile"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "lib/**"
      - "artifacts/api-server/**"
      - "artifacts/run-calculator/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: node-compatibility-advisory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    name: Compare Node 24.21.0 and Node 26.10.0 (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: node_compatibility
          POSTGRES_USER: runcalc
          POSTGRES_PASSWORD: ci-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runcalc -d node_compatibility"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_COMPATIBILITY_RUNNER_LABEL: ubuntu-latest
      NODE_COMPATIBILITY_ADMIN_DATABASE_URL: postgres://runcalc:ci-secret@localhost:5432/node_compatibility
      STAFF_SIGNUP_CODE: ci-signup-code
      INITIAL_MANAGER_USERNAME: cimanager
      INITIAL_MANAGER_ACCESS_CODE: ci-manager-code
      SESSION_SECRET: ci-session-secret
      AUTH_TOKEN_SECRET: ci-auth-token-secret
      NODE_ENV: test
      E2E_TEST_DB: "1"
      E2E_APPROVED_DESTRUCTIVE_MODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node 24 baseline
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Record exact Node 24 binary
        run: echo "NODE24_BIN=$(command -v node)" >> "$GITHUB_ENV"
      - name: Set up Node 26 candidate
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.10.0
      - name: Record comparison binaries
        run: |
          echo "NODE26_BIN=$(command -v node)" >> "$GITHUB_ENV"
          echo "PNPM_BIN=$(command -v pnpm)" >> "$GITHUB_ENV"
      - name: Run bounded same-runner comparison
        env:
          NODE_COMPATIBILITY_OUTPUT_DIR: ${{ runner.temp }}/node-compatibility-advisory
        run: node scripts/src/node-compatibility-advisory.mjs
      - name: Upload isolated advisory report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-compatibility-advisory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/node-compatibility-advisory/
          if-no-files-found: warn
          retention-days: 14
