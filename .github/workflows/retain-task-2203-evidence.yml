name: Retain task 2203 TypeScript evidence

on:
  push:
    branches:
      - task-2203-retain-evidence

permissions:
  actions: read
  contents: write

jobs:
  retain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Download exact CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "task-2203-retain-evidence"
          mkdir -p /tmp/ts7-evidence
          gh run download 35025590499 \
            --name release-evidence-standard-35025590499 \
            --dir /tmp/ts7-evidence/69b
          gh run download 35025590315 \
            --name release-evidence-standard-35025590315 \
            --dir /tmp/ts7-evidence/27d
          gh run download 35025590360 \
            --name release-evidence-standard-35025590360 \
            --dir /tmp/ts7-evidence/08e
      - name: Verify and retain comparison reports
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const samples = [
            ["69b", "69b52dee6878e73bb182aa185ee7d7d0387b664c"],
            ["27d", "27dcd1a87facdd8b17d2801ccf4ee6fd8251c2d6"],
            ["08e", "08ec2e4d338935aee3511ac8ce0b1aedbfec239d"],
          ];
          function findReport(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const candidate = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                const nested = findReport(candidate);
                if (nested) return nested;
              } else if (entry.name === "typescript-7-comparison.json") {
                return candidate;
              }
            }
            return null;
          }
          const output = "docs/evidence/typescript-7";
          fs.mkdirSync(output, { recursive: true });
          for (const [short, revision] of samples) {
            const source = findReport(`/tmp/ts7-evidence/${short}`);
            if (!source) {
              throw new Error(`Missing TypeScript 7 CI report for ${revision}`);
            }
            fs.copyFileSync(source, path.join(output, `${revision}.json`));
          }
          NODE
      - name: Commit retained reports
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/typescript-7
          git commit -m "Retain TypeScript 7 CI resource evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"