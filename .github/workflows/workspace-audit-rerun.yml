name: Full-workspace dependency audit (report-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-audit:
    name: Report full-workspace dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout selected workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Report full-workspace dependency advisories
        continue-on-error: true
        env:
          WORKSPACE_AUDIT_REVISION: ${{ github.sha }}
          WORKSPACE_AUDIT_REPORT_PATH: workspace-audit-report.md
        run: pnpm --filter @workspace/scripts run audit:workspace-report
      - name: Upload sanitized workspace audit snapshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-audit-report
          path: workspace-audit-report.md
          if-no-files-found: ignore
          retention-days: 14
