openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: runs
    description: Production run history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List saved production runs
      responses:
        "200":
          description: List of saved runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductionRun"
    post:
      operationId: createRun
      tags: [runs]
      summary: Save a production run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionRunInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionRun"
        "400":
          description: Invalid input

  /runs/{id}:
    delete:
      operationId: deleteRun
      tags: [runs]
      summary: Delete a saved run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ProductionRun:
      type: object
      required:
        - id
        - label
        - casesNeeded
        - casesLeft
        - skidsCompleted
        - pizzasPerMin
        - totalTimeSec
        - batchesNeeded
        - inputs
        - createdAt
      properties:
        id:
          type: integer
        label:
          type: string
        casesNeeded:
          type: integer
        casesLeft:
          type: integer
        skidsCompleted:
          type: integer
        pizzasPerMin:
          type: string
        totalTimeSec:
          type: integer
        batchesNeeded:
          type: string
        inputs:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    ProductionRunInput:
      type: object
      required:
        - casesNeeded
        - casesLeft
        - skidsCompleted
        - pizzasPerMin
        - totalTimeSec
        - batchesNeeded
        - inputs
      properties:
        label:
          type: string
        casesNeeded:
          type: integer
        casesLeft:
          type: integer
        skidsCompleted:
          type: integer
        pizzasPerMin:
          type: string
        totalTimeSec:
          type: integer
        batchesNeeded:
          type: string
        inputs:
          type: object
          additionalProperties: true
