openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: runs
    description: Production run history
  - name: inventory
    description: Stock / inventory control
  - name: roles
    description: Staff roles and access control
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List saved production runs
      responses:
        "200":
          description: List of saved runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductionRun"
    post:
      operationId: createRun
      tags: [runs]
      summary: Save a production run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionRunInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionRun"
        "400":
          description: Invalid input

  /runs/{id}:
    delete:
      operationId: deleteRun
      tags: [runs]
      summary: Delete a saved run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List inventory items with lots and on-hand
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

  /inventory/items:
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Create an inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Invalid input

  /inventory/items/{id}:
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update an inventory item (name, reorder threshold)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventoryItemInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "404":
          description: Not found
    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      summary: Delete an inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /inventory/restock:
    post:
      operationId: restockInventory
      tags: [inventory]
      summary: Add a received lot (creates the item if missing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestockInput"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Invalid input

  /inventory/adjust:
    post:
      operationId: adjustInventory
      tags: [inventory]
      summary: Manually adjust on-hand quantity (delta-based)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustInput"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Invalid input
        "404":
          description: Not found

  /inventory/consume:
    post:
      operationId: consumeInventory
      tags: [inventory]
      summary: Deduct stock for a completed run (idempotent by runId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumeInput"
      responses:
        "200":
          description: Consumption result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumeResult"
        "400":
          description: Invalid input

  /inventory/merge:
    post:
      operationId: mergeInventory
      tags: [inventory]
      summary: Fold one or more source items' stock into a target item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeInventoryInput"
      responses:
        "200":
          description: Merge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeInventoryResult"
        "400":
          description: Invalid input

  /inventory/ledger:
    get:
      operationId: listInventoryLedger
      tags: [inventory]
      summary: List movement history (optionally filtered by item)
      parameters:
        - name: itemId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryLedgerEntry"

  /inventory/settings:
    get:
      operationId: getInventorySettings
      tags: [inventory]
      summary: Get global inventory settings (expiry lead time)
      responses:
        "200":
          description: Inventory settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySettings"
    put:
      operationId: updateInventorySettings
      tags: [inventory]
      summary: Update global inventory settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventorySettingsInput"
      responses:
        "200":
          description: Updated inventory settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySettings"
        "400":
          description: Invalid input

  /inventory/identify-photo:
    post:
      operationId: identifyInventoryPhoto
      tags: [inventory]
      summary: Identify incoming stock items from a photo (AI vision); read-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifyPhotoInput"
      responses:
        "200":
          description: Identified stock items (each requires user confirmation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifyPhotoResult"
        "400":
          description: Invalid input
        "502":
          description: Vision provider error

  /me:
    get:
      operationId: getMe
      tags: [roles]
      summary: Current signed-in user's identity and role
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /users:
    get:
      operationId: listStaff
      tags: [roles]
      summary: List staff members and their roles (manager only)
      responses:
        "200":
          description: Staff roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
        "403":
          description: Manager role required

  /users/{userId}/role:
    put:
      operationId: setStaffRole
      tags: [roles]
      summary: Change a staff member's role (manager only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffRoleUpdate"
      responses:
        "200":
          description: Updated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          description: Invalid input
        "403":
          description: Manager role required

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ProductionRun:
      type: object
      required:
        - id
        - label
        - casesNeeded
        - casesLeft
        - skidsCompleted
        - pizzasPerMin
        - totalTimeSec
        - batchesNeeded
        - inputs
        - createdAt
      properties:
        id:
          type: integer
        label:
          type: string
        casesNeeded:
          type: integer
        casesLeft:
          type: integer
        skidsCompleted:
          type: integer
        pizzasPerMin:
          type: string
        totalTimeSec:
          type: integer
        batchesNeeded:
          type: string
        inputs:
          type: object
          additionalProperties: true
        notes:
          type: string
        createdAt:
          type: string
          format: date-time

    ProductionRunInput:
      type: object
      required:
        - casesNeeded
        - casesLeft
        - skidsCompleted
        - pizzasPerMin
        - totalTimeSec
        - batchesNeeded
        - inputs
      properties:
        label:
          type: string
        casesNeeded:
          type: integer
        casesLeft:
          type: integer
        skidsCompleted:
          type: integer
        pizzasPerMin:
          type: string
        totalTimeSec:
          type: integer
        batchesNeeded:
          type: string
        inputs:
          type: object
          additionalProperties: true
        notes:
          type: string

    InventoryLot:
      type: object
      required:
        - id
        - itemId
        - lotNumber
        - qtyReceived
        - qtyRemaining
        - createdAt
      properties:
        id:
          type: integer
        itemId:
          type: integer
        lotNumber:
          type: string
        qtyReceived:
          type: number
        qtyRemaining:
          type: number
        receivedDate:
          type: [string, "null"]
        expirationDate:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time

    InventoryItem:
      type: object
      required:
        - id
        - key
        - category
        - name
        - unit
        - reorderThreshold
        - onHand
        - lots
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        key:
          type: string
        category:
          type: string
        name:
          type: string
        unit:
          type: string
        reorderThreshold:
          type: number
        onHand:
          type: number
        lots:
          type: array
          items:
            $ref: "#/components/schemas/InventoryLot"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateInventoryItemInput:
      type: object
      required:
        - key
        - category
        - name
        - unit
      properties:
        key:
          type: string
        category:
          type: string
        name:
          type: string
        unit:
          type: string
        reorderThreshold:
          type: number

    UpdateInventoryItemInput:
      type: object
      properties:
        name:
          type: string
        reorderThreshold:
          type: number

    RestockInput:
      type: object
      required:
        - itemKey
        - category
        - name
        - unit
        - qty
      properties:
        itemKey:
          type: string
        category:
          type: string
        name:
          type: string
        unit:
          type: string
        qty:
          type: number
        lotNumber:
          type: string
        receivedDate:
          type: [string, "null"]
        expirationDate:
          type: [string, "null"]

    AdjustInput:
      type: object
      required:
        - itemId
        - qtyDelta
      properties:
        itemId:
          type: integer
        qtyDelta:
          type: number
        note:
          type: string

    ConsumeLine:
      type: object
      required:
        - itemKey
        - qty
      properties:
        itemKey:
          type: string
        qty:
          type: number

    ConsumeInput:
      type: object
      required:
        - runId
        - lines
      properties:
        runId:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ConsumeLine"

    MergeInventoryItem:
      type: object
      required:
        - fromKey
        - toKey
        - toName
        - category
        - unit
      properties:
        fromKey:
          type: string
        toKey:
          type: string
        toName:
          type: string
        category:
          type: string
        unit:
          type: string

    MergeInventoryInput:
      type: object
      required:
        - merges
      properties:
        merges:
          type: array
          items:
            $ref: "#/components/schemas/MergeInventoryItem"

    MergeInventoryResult:
      type: object
      required:
        - merged
      properties:
        merged:
          type: integer

    ConsumeResult:
      type: object
      required:
        - applied
      properties:
        applied:
          type: boolean
        consumed:
          type: integer

    InventoryLedgerEntry:
      type: object
      required:
        - id
        - itemId
        - type
        - qtyDelta
        - note
        - createdAt
      properties:
        id:
          type: integer
        itemId:
          type: integer
        lotId:
          type: [integer, "null"]
        type:
          type: string
        qtyDelta:
          type: number
        runId:
          type: [string, "null"]
        note:
          type: string
        createdAt:
          type: string
          format: date-time

    InventorySettings:
      type: object
      required:
        - expirySoonDays
      properties:
        expirySoonDays:
          type: integer

    UpdateInventorySettingsInput:
      type: object
      required:
        - expirySoonDays
      properties:
        expirySoonDays:
          type: integer

    PhotoCandidate:
      type: object
      required:
        - key
        - category
        - name
        - unit
      properties:
        key:
          type: string
        category:
          type: string
        name:
          type: string
        unit:
          type: string

    IdentifyPhotoInput:
      type: object
      required:
        - imageBase64
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image data (no data URI prefix)
        mimeType:
          type: string
          description: Image MIME type, e.g. image/jpeg
        candidates:
          type: array
          description: Known inventory + production items to match against
          items:
            $ref: "#/components/schemas/PhotoCandidate"

    PhotoGuess:
      type: object
      required:
        - name
        - qty
        - unit
        - category
        - matchedKey
        - confidence
      properties:
        name:
          type: string
        qty:
          type: number
        unit:
          type: string
        category:
          type: string
          enum: [ingredient, packaging]
        matchedKey:
          type: [string, "null"]
          description: Stable key of a matched known item, or null for a new item
        confidence:
          type: number
          description: 0..1 model confidence in this identification

    IdentifyPhotoResult:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PhotoGuess"

    StaffMember:
      type: object
      required:
        - userId
        - role
        - email
        - name
      properties:
        userId:
          type: string
        role:
          type: string
          enum: [manager, operator]
        email:
          type: [string, "null"]
        name:
          type: [string, "null"]

    StaffRoleUpdate:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [manager, operator]
