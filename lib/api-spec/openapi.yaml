              schema:
                $ref: "#/components/schemas/AiCorrectionList"
        "400":
          description: Invalid input

  /ai-memory/facility:
    get:
      operationId: listFacilityKnowledge
      tags: [aiMemory]
      summary: List the shared facility-wide AI knowledge pool
      description: >-
        Returns every durable operational fact in the shared facility-knowledge
        pool (domain-tagged plain-language observations the whole team and every
        AI feature have learned over time). Distinct from the name-corrections
        pool. AI helpers fold this into their prompts via a shared context
        builder, so a pattern learned in one feature is visible to all. Requires
        the `use-ai-tools` capability — reading the raw pool is a bulk-disclosure
        risk, and no client feature reads it directly (prompts are grounded
        server-side).
      responses:
        "200":
          description: All shared facility knowledge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityKnowledgeList"
        "403":
          description: Missing the use-ai-tools capability
    post:
      operationId: saveFacilityKnowledge
      tags: [aiMemory]
      summary: Record facility knowledge (case-insensitive upsert by domain + key)
      description: >-
        Persists a batch of durable operational facts into the shared
        facility-knowledge pool. Existing entries (matched case-insensitively on
        domain + key) are updated in place; new ones are inserted. Available to
        any signed-in user, but every entry must match the exact domain + key
        shape AND the fixed fact template one of the handful of real client
        features produces (e.g. proactive-alert dismissals, quality-check
        confirmations), with only a short bounded substring left free —
        anything else, including a well-formed domain/key with an
        out-of-template fact, is rejected. Some domains additionally require
        the same capability their own UI already gates the feature behind.
        This keeps the route from being usable as an open-ended facility-wide
        prompt-injection primitive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveFacilityKnowledgeInput"
      responses:
        "200":
          description: The full updated knowledge pool after the upsert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityKnowledgeList"
        "400":
          description: Invalid input

