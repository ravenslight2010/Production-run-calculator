openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Username + password authentication
  - name: runs
    description: Production run history
  - name: inventory
    description: Stock / inventory control
  - name: roles
    description: Staff roles and access control
  - name: ai
    description: AI assistant (optimization recommendations)
  - name: incidents
    description: Issue reports, crash capture, and AI diagnosis
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/sign-up:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create a staff account and start a session
      description: >-
        Creates a new username + password account. The first account ever
        created becomes a manager; all later accounts default to operator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
        "409":
          description: Username already taken

  /auth/sign-in:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
        "401":
          description: Invalid username or password

  /auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      summary: Sign out (clears the session cookie)
      responses:
        "204":
          description: Signed out

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the signed-in user's password
      description: >-
        Updates the signed-in user's password. The current password must be
        provided and is verified before the stored scrypt hash is replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordCredentials"
      responses:
        "204":
          description: Password changed
        "400":
          description: Invalid input
        "401":
          description: Not signed in, or current password incorrect

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a manager-approved password reset
      description: >-
        A signed-out user requests recovery for a forgotten password. Always
        responds 200 regardless of whether the username exists, so the endpoint
        never reveals which accounts are real. When the account exists a pending
        reset request is recorded for a manager to approve.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Request accepted (whether or not the account exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid input

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Complete a password reset using a manager-issued code
      description: >-
        Verifies the single-use, short-lived code a manager issued for the
        account and, if valid and unexpired, replaces the password. The code is
        consumed on success so it can never be reused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset
        "400":
          description: Invalid input
        "401":
          description: Code is invalid, expired, or already used

  /password-reset-requests:
    get:
      operationId: listPasswordResetRequests
      tags: [auth]
      summary: List pending password reset requests (manager only)
      description: >-
        Returns the staff members currently waiting for a manager to approve a
        forgotten-password reset.
      responses:
        "200":
          description: Pending reset requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PasswordResetRequest"
        "403":
          description: Manager role required

  /password-reset-requests/{id}/approve:
    post:
      operationId: approvePasswordReset
      tags: [auth]
      summary: Approve a password reset and mint a relay code (manager only)
      description: >-
        Approves a pending reset request and returns a short-lived single-use
        code shown to the manager exactly once. The manager relays it to the
        locked-out staff member, who uses it with /auth/reset-password.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reset approved; relay code issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovePasswordResetResult"
        "403":
          description: Manager role required
        "404":
          description: No pending request with that id

  /password-reset-requests/{id}/decline:
    post:
      operationId: declinePasswordReset
      tags: [auth]
      summary: Decline a pending password reset request (manager only)
      description: >-
        Declines a pending reset request, removing it from the pending list
        without issuing a code. Useful for rejecting a suspicious or mistaken
        request.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Request declined
        "403":
          description: Manager role required
        "404":
          description: No pending request with that id

  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List saved production runs
      responses:
        "200":
          description: List of saved runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductionRun"
    post:
      operationId: createRun
      tags: [runs]
      summary: Save a production run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionRunInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionRun"
        "400":
          description: Invalid input

  /runs/{id}:
    delete:
      operationId: deleteRun
      tags: [runs]
      summary: Delete a saved run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List inventory items with lots and on-hand
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

  /inventory/items:
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Create an inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Invalid input

  /inventory/items/{id}:
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update an inventory item (name, reorder threshold)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventoryItemInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "404":
          description: Not found
    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      summary: Delete an inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /inventory/restock:
    post:
      operationId: restockInventory
      tags: [inventory]
      summary: Add a received lot (creates the item if missing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestockInput"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Invalid input

  /inventory/adjust:
    post:
      operationId: adjustInventory
      tags: [inventory]
      summary: Manually adjust on-hand quantity (delta-based)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustInput"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Invalid input
        "404":
          description: Not found

  /inventory/consume:
    post:
      operationId: consumeInventory
      tags: [inventory]
      summary: Deduct stock for a completed run (idempotent by runId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumeInput"
      responses:
        "200":
          description: Consumption result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumeResult"
        "400":
          description: Invalid input

  /inventory/merge:
    post:
      operationId: mergeInventory
      tags: [inventory]
      summary: Fold one or more source items' stock into a target item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeInventoryInput"
      responses:
        "200":
          description: Merge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeInventoryResult"
        "400":
          description: Invalid input

  /inventory/ledger:
    get:
      operationId: listInventoryLedger
      tags: [inventory]
      summary: List movement history (optionally filtered by item)
      parameters:
        - name: itemId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryLedgerEntry"

  /inventory/settings:
    get:
      operationId: getInventorySettings
      tags: [inventory]
      summary: Get global inventory settings (expiry lead time)
      responses:
        "200":
          description: Inventory settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySettings"
    put:
      operationId: updateInventorySettings
      tags: [inventory]
      summary: Update global inventory settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventorySettingsInput"
      responses:
        "200":
          description: Updated inventory settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySettings"
        "400":
          description: Invalid input

  /inventory/identify-photo:
    post:
      operationId: identifyInventoryPhoto
      tags: [inventory]
      summary: Identify incoming stock items from a photo (AI vision); read-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifyPhotoInput"
      responses:
        "200":
          description: Identified stock items (each requires user confirmation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifyPhotoResult"
        "400":
          description: Invalid input
        "502":
          description: Vision provider error

  /ai/optimize:
    post:
      operationId: aiOptimize
      tags: [ai]
      summary: AI optimization recommendations for runs and break timing
      description: >-
        Analyzes the current day's runs, scheduled runs, and recent history and
        returns grouped/ranked recommendation cards. Read-only — never applies
        any change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeInput"
      responses:
        "200":
          description: Optimization recommendations (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/fill-missing:
    post:
      operationId: aiFillMissing
      tags: [ai]
      summary: Suggest values for blank run-setup fields (AI); read-only
      description: >-
        Given a run's known brand/flavor/context and a list of still-blank
        scalar fields, returns a suggested value plus a short rationale for each.
        Read-only — never writes anything; the client decides what (if anything)
        to commit. Used by the "Fill in missing data" setup assistant for fields
        that have no known profile/spec/default source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FillMissingInput"
      responses:
        "200":
          description: Suggested values (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillMissingResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /incidents:
    post:
      operationId: reportIncident
      tags: [incidents]
      summary: Report an issue or a crash and get an AI diagnosis
      description: >-
        Records an incident (a user-reported problem or an auto-captured crash)
        and returns a plain-language AI diagnosis plus a suggested workaround.
        Allowed for any signed-in user. The diagnosis is also stored on the
        incident for managers to review later. Rate-limited per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportIncidentInput"
      responses:
        "200":
          description: Incident recorded; diagnosis returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentDiagnosis"
        "400":
          description: Invalid input
        "429":
          description: Too many requests
    get:
      operationId: listIncidents
      tags: [incidents]
      summary: List incidents (manager only)
      description: >-
        Returns recorded incidents (newest first) for a manager to review,
        including the captured context and the AI diagnosis.
      responses:
        "200":
          description: Incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
        "403":
          description: Manager role required

  /incidents/unreviewed-count:
    get:
      operationId: getUnreviewedIncidentCount
      tags: [incidents]
      summary: Count of unreviewed incidents (manager only)
      description: >-
        Returns the number of incidents still marked new/unreviewed, used to
        drive the manager nav badge.
      responses:
        "200":
          description: Unreviewed incident count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreviewedIncidentCount"
        "403":
          description: Manager role required

  /incidents/{id}:
    get:
      operationId: getIncident
      tags: [incidents]
      summary: Get one incident (manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "403":
          description: Manager role required
        "404":
          description: No incident with that id

  /incidents/{id}/review:
    post:
      operationId: reviewIncident
      tags: [incidents]
      summary: Mark an incident reviewed (manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "403":
          description: Manager role required
        "404":
          description: No incident with that id

  /incidents/{id}/resolve:
    post:
      operationId: resolveIncident
      tags: [incidents]
      summary: Mark an incident resolved (manager only)
      description: >-
        Marks an incident resolved (its underlying problem is considered
        fixed/handled). "resolved" implies "reviewed".
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "403":
          description: Manager role required
        "404":
          description: No incident with that id

  /me:
    get:
      operationId: getMe
      tags: [roles]
      summary: Current signed-in user's identity and role
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /me/onboarding-seen:
    post:
      operationId: markOnboardingSeen
      tags: [roles]
      summary: Mark the first-login "Get Started" overview as seen
      description: >-
        Sets the current user's onboardingSeen flag so the "Get Started"
        overview never auto-opens again on any of their devices. Idempotent.
      responses:
        "200":
          description: Updated current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /me/tour-completed:
    post:
      operationId: markTourCompleted
      tags: [roles]
      summary: Mark the guided tour as completed
      description: >-
        Sets the current user's tourCompleted flag once they reach the guided
        tour's final step, so the app can tell a brand-new user from one who has
        already finished the tour. Idempotent.
      responses:
        "200":
          description: Updated current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /users:
    get:
      operationId: listStaff
      tags: [roles]
      summary: List staff members and their roles (manager only)
      responses:
        "200":
          description: Staff roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
        "403":
          description: Manager role required

  /users/{userId}/role:
    put:
      operationId: setStaffRole
      tags: [roles]
      summary: Change a staff member's role (manager only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffRoleUpdate"
      responses:
        "200":
          description: Updated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          description: Invalid input
        "403":
          description: Manager role required

  /users/{userId}/password:
    put:
      operationId: resetStaffPassword
      tags: [roles]
      summary: Reset a staff member's password (manager only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetStaffPassword"
      responses:
        "204":
          description: Password reset
        "400":
          description: Invalid input
        "403":
          description: Manager role required
        "404":
          description: User not found

  /users/{userId}:
    delete:
      operationId: deleteStaffMember
      tags: [roles]
      summary: Remove a staff member (manager only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Staff member removed
        "400":
          description: Cannot remove the last manager
        "403":
          description: Manager role required
        "404":
          description: User not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ProductionRun:
      type: object
      required:
        - id
        - label
        - casesNeeded
        - casesLeft
        - skidsCompleted
        - pizzasPerMin
        - totalTimeSec
        - batchesNeeded
        - inputs
        - createdAt
      properties:
        id:
          type: integer
        label:
          type: string
        casesNeeded:
          type: integer
        casesLeft:
          type: integer
        skidsCompleted:
          type: integer
        pizzasPerMin:
          type: string
        totalTimeSec:
          type: integer
        batchesNeeded:
          type: string
        inputs:
          type: object
          additionalProperties: true
        notes:
          type: string
        createdAt:
          type: string
          format: date-time

    ProductionRunInput:
      type: object
      required:
        - casesNeeded
        - casesLeft
        - skidsCompleted
        - pizzasPerMin
        - totalTimeSec
        - batchesNeeded
        - inputs
      properties:
        label:
          type: string
        casesNeeded:
          type: integer
        casesLeft:
          type: integer
        skidsCompleted:
          type: integer
        pizzasPerMin:
          type: string
        totalTimeSec:
          type: integer
        batchesNeeded:
          type: string
        inputs:
          type: object
          additionalProperties: true
        notes:
          type: string

    InventoryLot:
      type: object
      required:
        - id
        - itemId
        - lotNumber
        - qtyReceived
        - qtyRemaining
        - createdAt
      properties:
        id:
          type: integer
        itemId:
          type: integer
        lotNumber:
          type: string
        qtyReceived:
          type: number
        qtyRemaining:
          type: number
        receivedDate:
          type: [string, "null"]
        expirationDate:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time

    InventoryItem:
      type: object
      required:
        - id
        - key
        - category
        - name
        - unit
        - reorderThreshold
        - onHand
        - lots
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        key:
          type: string
        category:
          type: string
        name:
          type: string
        unit:
          type: string
        reorderThreshold:
          type: number
        onHand:
          type: number
        lots:
          type: array
          items:
            $ref: "#/components/schemas/InventoryLot"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateInventoryItemInput:
      type: object
      required:
        - key
        - category
        - name
        - unit
      properties:
        key:
          type: string
        category:
          type: string
        name:
          type: string
        unit:
          type: string
        reorderThreshold:
          type: number

    UpdateInventoryItemInput:
      type: object
      properties:
        name:
          type: string
        reorderThreshold:
          type: number

    RestockInput:
      type: object
      required:
        - itemKey
        - category
        - name
        - unit
        - qty
      properties:
        itemKey:
          type: string
        category:
          type: string
        name:
          type: string
        unit:
          type: string
        qty:
          type: number
        lotNumber:
          type: string
        receivedDate:
          type: [string, "null"]
        expirationDate:
          type: [string, "null"]

    AdjustInput:
      type: object
      required:
        - itemId
        - qtyDelta
      properties:
        itemId:
          type: integer
        qtyDelta:
          type: number
        note:
          type: string

    ConsumeLine:
      type: object
      required:
        - itemKey
        - qty
      properties:
        itemKey:
          type: string
        qty:
          type: number

    ConsumeInput:
      type: object
      required:
        - runId
        - lines
      properties:
        runId:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ConsumeLine"

    MergeInventoryItem:
      type: object
      required:
        - fromKey
        - toKey
        - toName
        - category
        - unit
      properties:
        fromKey:
          type: string
        toKey:
          type: string
        toName:
          type: string
        category:
          type: string
        unit:
          type: string

    MergeInventoryInput:
      type: object
      required:
        - merges
      properties:
        merges:
          type: array
          items:
            $ref: "#/components/schemas/MergeInventoryItem"

    MergeOutcome:
      type: object
      required:
        - fromKey
        - toKey
        - status
      properties:
        fromKey:
          type: string
        toKey:
          type: string
        status:
          type: string
          enum: [applied, skipped]
        reason:
          type: string
          enum: [blank-key, same-key, source-not-tracked, same-item]

    MergeInventoryResult:
      type: object
      required:
        - merged
        - results
      properties:
        merged:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/MergeOutcome"

    ConsumeResult:
      type: object
      required:
        - applied
      properties:
        applied:
          type: boolean
        consumed:
          type: integer

    InventoryLedgerEntry:
      type: object
      required:
        - id
        - itemId
        - type
        - qtyDelta
        - note
        - createdAt
      properties:
        id:
          type: integer
        itemId:
          type: integer
        lotId:
          type: [integer, "null"]
        type:
          type: string
        qtyDelta:
          type: number
        runId:
          type: [string, "null"]
        note:
          type: string
        createdAt:
          type: string
          format: date-time

    InventorySettings:
      type: object
      required:
        - expirySoonDays
      properties:
        expirySoonDays:
          type: integer

    UpdateInventorySettingsInput:
      type: object
      required:
        - expirySoonDays
      properties:
        expirySoonDays:
          type: integer

    PhotoCandidate:
      type: object
      required:
        - key
        - category
        - name
        - unit
      properties:
        key:
          type: string
        category:
          type: string
        name:
          type: string
        unit:
          type: string

    IdentifyPhotoInput:
      type: object
      required:
        - imageBase64
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image data (no data URI prefix)
        mimeType:
          type: string
          description: Image MIME type, e.g. image/jpeg
        candidates:
          type: array
          description: Known inventory + production items to match against
          items:
            $ref: "#/components/schemas/PhotoCandidate"

    PhotoGuess:
      type: object
      required:
        - name
        - qty
        - unit
        - category
        - matchedKey
        - confidence
      properties:
        name:
          type: string
        qty:
          type: number
        unit:
          type: string
        category:
          type: string
          enum: [ingredient, packaging]
        matchedKey:
          type: [string, "null"]
          description: Stable key of a matched known item, or null for a new item
        confidence:
          type: number
          description: 0..1 model confidence in this identification

    IdentifyPhotoResult:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PhotoGuess"

    AuthCredentials:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 6
          maxLength: 200

    AuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/StaffMember"

    ChangePasswordCredentials:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 200
        newPassword:
          type: string
          minLength: 6
          maxLength: 200

    StaffMember:
      type: object
      required:
        - userId
        - role
        - email
        - name
        - onboardingSeen
        - tourCompleted
      properties:
        userId:
          type: string
        role:
          type: string
          enum: [manager, operator]
        email:
          type: [string, "null"]
        name:
          type: [string, "null"]
        onboardingSeen:
          type: boolean
          description: >-
            Whether the user has dismissed the first-login "Get Started"
            overview.
        tourCompleted:
          type: boolean
          description: >-
            Whether the user has finished the guided tour (reached its final
            step).

    StaffRoleUpdate:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [manager, operator]

    ResetStaffPassword:
      type: object
      required:
        - newPassword
      properties:
        newPassword:
          type: string
          minLength: 6
          maxLength: 200

    OkResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean

    ForgotPasswordRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64

    ResetPasswordRequest:
      type: object
      required:
        - username
        - code
        - newPassword
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        code:
          type: string
          minLength: 1
          maxLength: 64
        newPassword:
          type: string
          minLength: 6
          maxLength: 200

    PasswordResetRequest:
      type: object
      required:
        - id
        - userId
        - username
        - requestedAt
      properties:
        id:
          type: string
        userId:
          type: string
        username:
          type: string
        requestedAt:
          type: string
          format: date-time

    ApprovePasswordResetResult:
      type: object
      required:
        - username
        - code
        - expiresAt
      properties:
        username:
          type: string
        code:
          type: string
        expiresAt:
          type: string
          format: date-time

    OptimizeStoppage:
      type: object
      required:
        - reason
        - durationSec
        - open
      properties:
        reason:
          type: string
        durationSec:
          type: number
        open:
          type: boolean
          description: True if the stoppage is still in progress (no end time)

    OptimizeRun:
      type: object
      required:
        - id
        - label
        - brand
        - flavor
        - dieType
        - status
        - casesNeeded
        - casesMade
        - casesLeft
        - plannedPpm
        - actualPpm
        - minutesRemaining
        - netElapsedSec
        - downtimeSec
        - stoppages
      properties:
        id:
          type: string
        label:
          type: string
        brand:
          type: string
        flavor:
          type: string
        dieType:
          type: string
        status:
          type: string
          enum: [running, upcoming, finished]
        casesNeeded:
          type: number
        casesMade:
          type: number
        casesLeft:
          type: number
        plannedPpm:
          type: number
          description: Planned pizzas-per-minute from line config
        actualPpm:
          type: [number, "null"]
          description: Observed pizzas-per-minute, or null if not yet measurable
        minutesRemaining:
          type: [number, "null"]
        netElapsedSec:
          type: number
        downtimeSec:
          type: number
        stoppages:
          type: array
          items:
            $ref: "#/components/schemas/OptimizeStoppage"

    OptimizeScheduledRun:
      type: object
      required:
        - date
        - brand
        - flavor
        - dieType
        - casesNeeded
      properties:
        date:
          type: string
        brand:
          type: string
        flavor:
          type: string
        dieType:
          type: string
        casesNeeded:
          type: number

    OptimizeInput:
      type: object
      required:
        - date
        - nowMs
        - runs
      properties:
        date:
          type: string
        nowMs:
          type: number
          description: Client clock (ms epoch) so the model can reason about timing
        runToTime:
          type: string
          description: Target completion time of day (HH:MM), or empty if unset
        todayPpm:
          type: number
          description: Today's aggregate pizzas-per-minute so far
        benchmarkPpm:
          type: [number, "null"]
          description: Historical average pizzas-per-minute, or null if no history
        runs:
          type: array
          description: Today's runs (running, upcoming, and finished)
          items:
            $ref: "#/components/schemas/OptimizeRun"
        scheduledRuns:
          type: array
          description: Future planned runs
          items:
            $ref: "#/components/schemas/OptimizeScheduledRun"
        historyRuns:
          type: array
          description: Recent finished runs from prior days
          items:
            $ref: "#/components/schemas/OptimizeRun"

    OptimizeAction:
      type: object
      description: >-
        Optional one-tap action a manager can apply from a recommendation.
        Advisory until explicitly tapped; each kind maps to an existing client
        mutation. Run-targeted kinds reference today's run ids.
      required:
        - kind
        - label
      properties:
        kind:
          type: string
          enum: [set_target_time, set_run_target, reorder_run]
        label:
          type: string
          description: Short imperative button caption
        time:
          type: string
          description: "Target finish time HH:MM (set_target_time)"
        runId:
          type: string
          description: Target run id (set_run_target, reorder_run)
        casesNeeded:
          type: number
          description: New case target (set_run_target)
        beforeRunId:
          type: [string, "null"]
          description: >-
            reorder_run: move runId immediately before this run id, or null to
            move it last

    OptimizeRecommendation:
      type: object
      required:
        - category
        - title
        - detail
        - impact
        - appliesTo
      properties:
        category:
          type: string
          enum: [run, break, efficiency]
        title:
          type: string
        detail:
          type: string
        impact:
          type: string
          enum: [high, medium, low]
        appliesTo:
          type: [string, "null"]
          description: Run label or scope this applies to, or null for shift-wide
        action:
          oneOf:
            - $ref: "#/components/schemas/OptimizeAction"
            - type: "null"
          description: Optional one-tap action, or null when nothing is safely applicable

    OptimizeResult:
      type: object
      required:
        - recommendations
        - generatedAt
      properties:
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/OptimizeRecommendation"
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when data is insufficient for analysis

    FillMissingField:
      type: object
      description: One still-blank run-setup field the model should suggest a value for.
      required:
        - key
        - label
        - category
        - kind
      properties:
        key:
          type: string
          description: Stable field key (matches the run-settings field name)
        label:
          type: string
          description: Human-readable field label
        category:
          type: string
          enum:
            [identity, line, packaging, sauce, applicator, pepperoni, dough]
        kind:
          type: string
          enum: [number, text, select]
        options:
          type: array
          description: Allowed values when kind is "select"
          items:
            type: string

    FillMissingContextItem:
      type: object
      description: A field already filled in, given to the model for grounding.
      required:
        - key
        - label
        - value
      properties:
        key:
          type: string
        label:
          type: string
        value:
          type: string

    FillMissingInput:
      type: object
      required:
        - brand
        - flavor
        - fields
      properties:
        brand:
          type: string
        flavor:
          type: string
        dieType:
          type: string
          description: Die/size of the run, if known
        context:
          type: array
          description: Fields already known, for grounding the suggestions
          items:
            $ref: "#/components/schemas/FillMissingContextItem"
        fields:
          type: array
          description: The blank fields needing a suggested value
          items:
            $ref: "#/components/schemas/FillMissingField"

    FillMissingSuggestion:
      type: object
      required:
        - key
        - value
        - rationale
      properties:
        key:
          type: string
          description: The field key this suggestion is for (echoes a requested key)
        value:
          type: string
          description: Suggested value, as a string (numbers/selects coerced client-side)
        rationale:
          type: string
          description: Short plain-language reason for the suggested value

    FillMissingResult:
      type: object
      required:
        - suggestions
        - generatedAt
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/FillMissingSuggestion"
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when no suggestions could be made

    IncidentContext:
      type: object
      description: Captured details about a reported issue or a crash
      properties:
        description:
          type: string
          description: The user's own words describing what went wrong (user reports)
        errorMessage:
          type: string
          description: The uncaught error's message (crashes)
        errorStack:
          type: string
          description: The uncaught error's stack/component trace (crashes)
        userAgent:
          type: string
          description: Client user-agent / device string, when available

    ReportIncidentInput:
      type: object
      required:
        - source
        - screen
        - appPlatform
      properties:
        source:
          type: string
          enum: [user_report, auto_crash]
        screen:
          type: string
          description: Screen/route the user was on
          maxLength: 200
        appPlatform:
          type: string
          enum: [web, mobile]
        appVersion:
          type: string
          maxLength: 100
        description:
          type: string
          description: The user's description of the problem (user reports)
          maxLength: 4000
        errorMessage:
          type: string
          description: Uncaught error message (crashes)
          maxLength: 4000
        errorStack:
          type: string
          description: Uncaught error stack (crashes)
          maxLength: 8000
        userAgent:
          type: string
          maxLength: 500

    IncidentDiagnosis:
      type: object
      required:
        - incidentId
        - diagnosis
        - workaround
      properties:
        incidentId:
          type: string
        diagnosis:
          type: string
          description: Plain-language explanation of what likely went wrong
        workaround:
          type: string
          description: Suggested next step / workaround for the user

    Incident:
      type: object
      required:
        - id
        - source
        - reporterId
        - reporterName
        - reporterRole
        - screen
        - appPlatform
        - appVersion
        - context
        - diagnosis
        - workaround
        - status
        - createdAt
        - reviewedAt
        - resolvedAt
      properties:
        id:
          type: string
        source:
          type: string
          enum: [user_report, auto_crash]
        reporterId:
          type: [string, "null"]
        reporterName:
          type: [string, "null"]
        reporterRole:
          type: [string, "null"]
        screen:
          type: string
        appPlatform:
          type: string
        appVersion:
          type: [string, "null"]
        context:
          $ref: "#/components/schemas/IncidentContext"
        diagnosis:
          type: [string, "null"]
        workaround:
          type: [string, "null"]
        status:
          type: string
          enum: [new, reviewed, resolved]
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, "null"]
          format: date-time
        resolvedAt:
          type: [string, "null"]
          format: date-time

    UnreviewedIncidentCount:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
