openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Username + password authentication
  - name: runs
    description: Production run history
  - name: inventory
    description: Stock / inventory control
  - name: roles
    description: Staff roles and access control
  - name: ai
    description: AI assistant (optimization recommendations)
  - name: incidents
    description: Issue reports, crash capture, and AI diagnosis
  - name: specImport
    description: Learned spec-sheet / recipe import aliases
  - name: productionRules
    description: Manager-defined factory-wide production rules
  - name: aiMemory
    description: Shared AI memory (facility knowledge + per-user conversation history)
  - name: cheeseRecipes
  - name: runTemplates
    description: Facility-wide saved run-setup templates
  - name: supervisorPin
    description: Facility-wide supervisor PIN setting
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/sign-up:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create a staff account and start a session
      description: >-
        Creates a new username + password account. Requires a facility access
        code (configured server-side out of band and shared only with
        legitimate staff) — sign-up is otherwise closed to the public
        internet. The very first account ever created becomes a manager; all
        later accounts default to operator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpCredentials"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
        "403":
          description: Missing or invalid access code
        "409":
          description: Username already taken

  /auth/username-available:
    get:
      operationId: checkUsernameAvailable
      tags: [auth]
      summary: Check whether a username is available for sign-up
      description: >-
        Lightweight, read-only lookup used by the sign-up form to tell users in
        real time whether a username is still free. Public — sign-up is itself
        public. The check is case-insensitive, mirroring account creation.
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: Availability result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsernameAvailability"
        "400":
          description: Invalid input

  /auth/sign-in:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
        "401":
          description: Invalid username or password

  /auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      summary: Sign out (clears the session cookie)
      responses:
        "204":
          description: Signed out

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the signed-in user's password
      description: >-
        Updates the signed-in user's password. The current password must be
        provided and is verified before the stored scrypt hash is replaced.
        Changing the password invalidates every previously-issued session
        token (including the one used for this request), so a fresh token is
        returned and must replace the caller's stored session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordCredentials"
      responses:
        "200":
          description: Password changed; a fresh session token is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
        "401":
          description: Not signed in, or current password incorrect

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a manager-approved password reset
      description: >-
        A signed-out user requests recovery for a forgotten password. Always
        responds 200 regardless of whether the username exists, so the endpoint
        never reveals which accounts are real. When the account exists a pending
        reset request is recorded for a manager to approve.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Request accepted (whether or not the account exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid input

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Complete a password reset using a manager-issued code
      description: >-
        Verifies the single-use, short-lived code a manager issued for the
        account and, if valid and unexpired, replaces the password. The code is
        consumed on success so it can never be reused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset
        "400":
          description: Invalid input
        "401":
          description: Code is invalid, expired, or already used

  /password-reset-requests:
    get:
      operationId: listPasswordResetRequests
      tags: [auth]
      summary: List pending password reset requests (manager only)
      description: >-
        Returns the staff members currently waiting for a manager to approve a
        forgotten-password reset.
      responses:
        "200":
          description: Pending reset requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PasswordResetRequest"
        "403":
          description: Manager role required

  /password-reset-requests/{id}/approve:
    post:
      operationId: approvePasswordReset
      tags: [auth]
      summary: Approve a password reset and mint a relay code (manager only)
      description: >-
        Approves a pending reset request and returns a short-lived single-use
        code shown to the manager exactly once. The manager relays it to the
        locked-out staff member, who uses it with /auth/reset-password.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reset approved; relay code issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovePasswordResetResult"
        "403":
          description: Manager role required
        "404":
          description: No pending request with that id

  /password-reset-requests/{id}/decline:
    post:
      operationId: declinePasswordReset
      tags: [auth]
      summary: Decline a pending password reset request (manager only)
      description: >-
        Declines a pending reset request, removing it from the pending list
        without issuing a code. Useful for rejecting a suspicious or mistaken
        request.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Request declined
        "403":
          description: Manager role required
        "404":
          description: No pending request with that id

  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List saved production runs
      responses:
        "200":
          description: List of saved runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductionRun"
    post:
      operationId: createRun
      tags: [runs]
      summary: Save a production run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionRunInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionRun"
        "400":
          description: Invalid input

  /runs/{id}:
    delete:
      operationId: deleteRun
      tags: [runs]
      summary: Delete a saved run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List inventory items with lots and on-hand
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

  /inventory/items:
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Create an inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Invalid input

  /inventory/items/{id}:
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update an inventory item (name, reorder threshold)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventoryItemInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "404":
          description: Not found
    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      summary: Delete an inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /inventory/restock:
    post:
      operationId: restockInventory
      tags: [inventory]
      summary: Add a received lot (creates the item if missing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestockInput"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Invalid input

  /inventory/adjust:
    post:
      operationId: adjustInventory
      tags: [inventory]
      summary: Manually adjust on-hand quantity (delta-based)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustInput"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Invalid input
        "404":
          description: Not found

  /inventory/consume:
    post:
      operationId: consumeInventory
      tags: [inventory]
      summary: Deduct stock for a completed run (idempotent by runId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumeInput"
      responses:
        "200":
          description: Consumption result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumeResult"
        "400":
          description: Invalid input

  /inventory/merge:
    post:
      operationId: mergeInventory
      tags: [inventory]
      summary: Fold one or more source items' stock into a target item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeInventoryInput"
      responses:
        "200":
          description: Merge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeInventoryResult"
        "400":
          description: Invalid input

  /inventory/locations:
    get:
      operationId: listInventoryLocations
      tags: [inventory]
      summary: List stock locations (onsite first)
      responses:
        "200":
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryLocation"
    post:
      operationId: createInventoryLocation
      tags: [inventory]
      summary: Create a stock location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryLocationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryLocation"
        "400":
          description: Invalid input
        "409":
          description: Duplicate name

  /inventory/locations/{id}:
    patch:
      operationId: updateInventoryLocation
      tags: [inventory]
      summary: Rename a location or set it as onsite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventoryLocationInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryLocation"
        "400":
          description: Invalid input
        "404":
          description: Not found
        "409":
          description: Duplicate name
    delete:
      operationId: deleteInventoryLocation
      tags: [inventory]
      summary: Delete an empty, non-onsite location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: Location is onsite or still holds stock

  /inventory/transfer:
    post:
      operationId: transferInventory
      tags: [inventory]
      summary: Move stock from one location to another (preserves lots)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Invalid input
        "404":
          description: Not found
        "409":
          description: No stock available at the source location

  /inventory/ledger:
    get:
      operationId: listInventoryLedger
      tags: [inventory]
      summary: List movement history (optionally filtered by item)
      parameters:
        - name: itemId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryLedgerEntry"

  /inventory/settings:
    get:
      operationId: getInventorySettings
      tags: [inventory]
      summary: Get global inventory settings (expiry lead time)
      responses:
        "200":
          description: Inventory settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySettings"
    put:
      operationId: updateInventorySettings
      tags: [inventory]
      summary: Update global inventory settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventorySettingsInput"
      responses:
        "200":
          description: Updated inventory settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySettings"
        "400":
          description: Invalid input

  /inventory/identify-photo:
    post:
      operationId: identifyInventoryPhoto
      tags: [inventory]
      summary: Identify incoming stock items from a photo (AI vision); read-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifyPhotoInput"
      responses:
        "200":
          description: Identified stock items (each requires user confirmation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifyPhotoResult"
        "400":
          description: Invalid input
        "502":
          description: Vision provider error

  /inventory/quality-photo:
    post:
      operationId: qualityCheckPhoto
      tags: [inventory]
      summary: Assess finished-product quality from a photo (AI vision); read-only
      description: >-
        Looks at a photo of a finished pizza or crust and returns a
        plain-language quality assessment (size, topping coverage, appearance
        defects) plus a confidence score. Read-only — never records anything; the
        manager reviews the assessment and decides whether to confirm it. A
        confirmed outcome is written back into the shared facility memory by the
        client through the existing facility-knowledge write path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityCheckPhotoInput"
      responses:
        "200":
          description: A quality assessment (advisory only; requires confirmation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityCheckResult"
        "400":
          description: Invalid input
        "413":
          description: Image too large
        "429":
          description: Rate limited
        "502":
          description: Vision provider error

  /inventory/production-sheet-photo:
    post:
      operationId: productionSheetPhoto
      tags: [inventory]
      summary: Extract a production/run plan from a photo of a paper run sheet (AI vision); read-only
      description: >-
        Looks at a photo of a paper production/run sheet and extracts the
        distinct run rows it can read (brand, flavor, die size, cases needed,
        and an optional date) so they can be reviewed and added to the schedule.
        Read-only — never writes anything; each extracted row requires explicit
        user confirmation before it is applied through the existing schedule path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionSheetPhotoInput"
      responses:
        "200":
          description: Extracted run rows (advisory only; each requires confirmation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionSheetPhotoResult"
        "400":
          description: Invalid input
        "413":
          description: Image too large
        "429":
          description: Rate limited
        "502":
          description: Vision provider error

  /inventory/label-verify:
    post:
      operationId: verifyLabelPhoto
      tags: [inventory]
      summary: Verify a finished-product label or pallet placard against expected values (AI vision); read-only
      description: >-
        Looks at a photo of a finished-product label or pallet placard, reads the
        visible fields, and compares them against the expected values the client
        provides (brand, flavor, die size, date, lot code, case count). Returns a
        per-field match/mismatch breakdown plus an overall verdict. Read-only —
        never writes anything; a person reviews the result and decides what to do.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelVerifyInput"
      responses:
        "200":
          description: A per-field verification result (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelVerifyResult"
        "400":
          description: Invalid input
        "413":
          description: Image too large
        "429":
          description: Rate limited
        "502":
          description: Vision provider error

  /inventory/quality-checks:
    post:
      operationId: recordQualityCheck
      tags: [inventory]
      summary: Record a reviewed-and-confirmed quality check (manager only)
      description: >-
        Persists a structured record of a quality check a manager reviewed and
        confirmed (product type, verdict, confidence, summary, specific issues,
        optional notes and a small photo thumbnail). This builds a browsable
        history managers can audit and use to spot trends over time. The
        advisory /inventory/quality-photo endpoint never writes — this is the
        deliberate, user-driven save.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityCheckRecordInput"
      responses:
        "200":
          description: The recorded quality check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityCheckRecord"
        "400":
          description: Invalid input
        "403":
          description: Manager role required
    get:
      operationId: listQualityChecks
      tags: [inventory]
      summary: List past quality checks (manager only)
      description: >-
        Returns recorded quality checks (newest first) for a manager to review,
        optionally filtered by product type and/or status.
      parameters:
        - name: productType
          in: query
          required: false
          schema:
            type: string
            enum: [pizza, crust, other]
          description: Only return checks for this product type
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pass, warn, fail]
          description: Only return checks with this verdict
      responses:
        "200":
          description: Quality check history (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QualityCheckRecord"
        "403":
          description: Manager role required

  /inventory/waste-insight:
    post:
      operationId: wasteInsight
      tags: [inventory]
      summary: Flag items trending toward expiry and suggest run-order to use them first
      description: >-
        Reads current inventory and the configured expiry lead time, flags lots
        that are expired or expiring soon, and (when anything is flagged) asks
        the AI for a plain-language run-order suggestion to consume the
        at-risk stock first. Grounded in the real inventory data and the shared
        facility memory. Read-only — never applies any change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WasteInsightInput"
      responses:
        "200":
          description: Flagged items plus an advisory run-order suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WasteInsightResult"
        "400":
          description: Invalid input
        "429":
          description: Rate limited
        "502":
          description: AI provider error

  /ai/optimize:
    post:
      operationId: aiOptimize
      tags: [ai]
      summary: AI optimization recommendations for runs and break timing
      description: >-
        Analyzes the current day's runs, scheduled runs, and recent history and
        returns grouped/ranked recommendation cards. Read-only — never applies
        any change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeInput"
      responses:
        "200":
          description: Optimization recommendations (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/ask:
    post:
      operationId: aiAsk
      tags: [ai]
      summary: Ask the AI a free-form question about the day
      description: >-
        Answers a plain-language question grounded strictly in the day's real
        run data, the shared facility memory, and the asking user's recent
        conversation turns. Keeps per-user follow-up context, never invents data
        (says so when it can't answer), and records the exchange back into that
        user's conversation memory. Read-only — never applies any change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskInput"
      responses:
        "200":
          description: A grounded answer plus the user's updated conversation window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/command:
    post:
      operationId: aiCommand
      tags: [ai]
      summary: Classify a spoken phrase as a question or an executable command
      description: >-
        Takes a single spoken utterance plus the live day-state and classifies it
        as either a QUESTION (the client routes it to /ai/ask, unchanged) or a
        COMMAND. For a command, returns one or more structured actions drawn from
        a fixed vocabulary, with every fuzzy reference already resolved against
        the grounding (a run by brand/flavor → run id, an inventory item by name →
        item key/id) and a friendly label attached. Returns an explicit "none"
        when nothing actionable was understood. This endpoint never mutates
        anything itself — the client runs the actions through its existing
        handlers (with role gating and Undo).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandInput"
      responses:
        "200":
          description: Classification result — question, command actions, or none
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/recipe-assistant:
    post:
      operationId: aiRecipeAssistant
      tags: [ai]
      summary: Recipe & ingredient helper — scale, substitute, explain (AI); read-only
      description: >-
        Answers a plain-language question about the current run's recipes and
        ingredients — scaling a recipe, suggesting a substitution, or explaining
        a formula — grounded strictly in the supplied recipe rows, the known
        ingredient pool, the shared name-corrections, and the facility memory.
        Advisory only: never edits or commits a recipe, never invents
        ingredients or quantities (says so plainly when the data is
        insufficient). Read-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeAssistInput"
      responses:
        "200":
          description: A grounded plain-language answer (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeAssistResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/spec-reconcile:
    post:
      operationId: aiSpecReconcile
      tags: [ai]
      summary: Cross-reference a saved spec sheet against the current recipes (AI summary); read-only
      description: >-
        Loads the saved spec sheet by id, deterministically diffs its recipes
        against the supplied current recipe library (missing recipes, missing /
        extra ingredients, pound mismatches), then asks the AI for a short
        plain-language summary of what's off. Read-only and fail-safe: the
        deterministic discrepancy list is always returned even if the AI summary
        is unavailable. Available to any signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecReconcileInput"
      responses:
        "200":
          description: Deterministic discrepancies plus an advisory plain-language summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecReconcileResult"
        "400":
          description: Invalid input
        "404":
          description: No saved spec sheet with that id

  /ai/mix-reconcile:
    post:
      operationId: aiMixReconcile
      tags: [ai]
      summary: Narrate already-computed mix discrepancies (AI summary); read-only
      description: >-
        The deterministic diff of the current mixes against the imported premix
        and spec sheets runs on the client (the shared @workspace/mix-reconcile
        lib). This endpoint takes that exact discrepancy list and asks the AI for
        a short plain-language summary of what's off. Read-only and fail-safe: an
        AI error simply yields an empty summary, never an error. It never invents
        or applies anything. Available to any signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MixReconcileInput"
      responses:
        "200":
          description: An advisory plain-language summary of the supplied discrepancies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MixReconcileResult"
        "400":
          description: Invalid input

  /ai/mix-assistant:
    post:
      operationId: aiMixAssistant
      tags: [ai]
      summary: Mixes helper — answer plain-language questions about the mixes (AI); read-only
      description: >-
        Answers a plain-language question grounded strictly in the current mix
        definitions and the facility memory. Advisory only: it explains and
        computes but never edits a mix or applies anything (no structured
        suggestion). Available to any signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MixAssistInput"
      responses:
        "200":
          description: A grounded plain-language answer (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MixAssistResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/proactive-alert:
    post:
      operationId: aiProactiveAlert
      tags: [ai]
      summary: At-most-one proactive shift alert (AI); read-only
      description: >-
        Same live-day input as /ai/optimize, but evaluated on a cadence while a
        day is running. Returns at most a single timely, dismissible nudge
        (falling behind plan, or a natural break/changeover window) — or null
        when nothing is worth surfacing right now. Read-only; the client owns
        de-duplication and cooldown via the returned stable alert key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeInput"
      responses:
        "200":
          description: At most one proactive alert (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProactiveAlertResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/proactive-settings:
    get:
      operationId: getProactiveAlertSettings
      tags: [ai]
      summary: Get global proactive-alert settings (cadence, cooldown, on/off)
      responses:
        "200":
          description: Proactive-alert settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProactiveAlertSettings"
    put:
      operationId: updateProactiveAlertSettings
      tags: [ai]
      summary: Update global proactive-alert settings (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProactiveAlertSettingsInput"
      responses:
        "200":
          description: Updated proactive-alert settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProactiveAlertSettings"
        "400":
          description: Invalid input

  /ai/forecast:
    post:
      operationId: aiForecast
      tags: [ai]
      summary: Predict an upcoming day's run plan (AI); read-only
      description: >-
        Given recent finished production history (grouped by day) and any
        already-scheduled future runs, predicts a suggested run plan for one
        upcoming day — what to run, rough case quantities, and a sensible
        sequence — plus a plain-language rationale and an honest confidence
        level. Grounded strictly in the supplied history and shared facility
        memory; explicit about uncertainty and returns a null forecast (with a
        note) when history is too thin to predict responsibly. Read-only — never
        writes or commits anything; the manager reviews and adjusts the
        suggestion into the editable schedule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForecastInput"
      responses:
        "200":
          description: A suggested run plan for the target day (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/summary:
    post:
      operationId: aiSummary
      tags: [ai]
      summary: Plain-language end-of-day / weekly production recap (AI); read-only
      description: >-
        Given a day's (or rolling week's) runs — planned vs. produced cases,
        downtime/stoppages, unfinished runs, and any reported issues — returns a
        short, plain-language recap for floor staff and managers. The numeric
        stats are computed deterministically server-side; the AI only narrates
        them and never invents figures. Read-only — never writes or commits run
        data. Fail-safe: if the AI is unavailable or returns nothing usable, a
        deterministic plain-language summary built from the same stats is returned
        instead, so the caller always gets a usable recap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummaryInput"
      responses:
        "200":
          description: A plain-language recap plus the deterministic stats it was built from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryResult"
        "400":
          description: Invalid input

  /ai/forecast-accuracy:
    post:
      operationId: aiForecastAccuracy
      tags: [ai]
      summary: Review how accurate past forecasts were vs. what actually ran; read-only
      description: >-
        Compares previously recorded demand forecasts (kept in shared facility
        memory) against the supplied actual finished production history for those
        dates. Returns a per-date review of predicted vs. actual products and
        case quantities plus a lightweight accuracy signal, so managers can see
        how well the forecaster has been doing and the AI can learn from misses.
        Read-only — never writes or commits run data; only the deterministic
        comparison is computed (no AI call).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForecastAccuracyInput"
      responses:
        "200":
          description: Per-date forecast-vs-actual reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastAccuracyResult"
        "400":
          description: Invalid input

  /ai/incident-clusters:
    post:
      operationId: aiIncidentClusters
      tags: [ai]
      summary: Group reported issues / crashes into root-cause themes (AI); manager-only, read-only
      description: >-
        Reads the recorded incident log (manager-only) and groups recurring
        reports and crashes into a small number of root-cause themes, each with a
        plain-language hypothesis and a suggested next step. The AI only proposes
        groupings and narration; the server verifies every incident id, recomputes
        the per-theme counts deterministically, and never invents incidents or
        edits anything. Read-only and advisory. Fail-safe: if the AI is
        unavailable or returns nothing usable, a deterministic grouping (by screen
        and platform) is returned instead so managers always get a useful view.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentClustersInput"
      responses:
        "200":
          description: Root-cause clusters across the incident log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentClustersResult"
        "400":
          description: Invalid input

  /ai/anomalies:
    post:
      operationId: aiAnomalies
      tags: [ai]
      summary: Flag production runs that drifted from their historical norm (AI narration); read-only
      description: >-
        Given today's finished runs plus recent finished-run history, deterministically
        flags runs whose downtime, yield (cases attained vs. planned), or stoppage count
        drifted meaningfully from a per-product baseline. The drift detection is computed
        server-side and is fully deterministic; the AI is only asked to NARRATE a short
        plain-language summary, and only when at least one anomaly is flagged (no flags →
        no AI call). Read-only and advisory — never edits or commits run data. Fail-safe:
        if the AI is unavailable, the deterministic anomaly list is still returned with an
        empty narration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnomalyInput"
      responses:
        "200":
          description: Deterministic anomaly flags plus an optional plain-language narration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyResult"
        "400":
          description: Invalid input

  /ai/schedule-optimize:
    post:
      operationId: aiScheduleOptimize
      tags: [ai]
      summary: Suggest an optimal run order for the day (AI narration); read-only
      description: >-
        Given the runs planned for one day, deterministically proposes an ordering that
        schedules allergen runs at the end of the day, groups same brand/die together to
        minimize line changeovers, and honors factory sequence production rules. The
        ordering and all before/after metrics are computed server-side and are fully
        deterministic (shared @workspace/schedule-optimize lib); the AI is only asked to
        NARRATE a short plain-language explanation, and only when a better order exists
        (no improvement → no AI call). Read-only and advisory — never edits or commits the
        schedule. Fail-safe: if the AI is unavailable, the deterministic suggested order
        is still returned with an empty narration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleOptimizeInput"
      responses:
        "200":
          description: Deterministic suggested order plus an optional plain-language narration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleOptimizeResponse"
        "400":
          description: Invalid input

  /ai/fill-missing:
    post:
      operationId: aiFillMissing
      tags: [ai]
      summary: Suggest values for blank run-setup fields (AI); read-only
      description: >-
        Given a run's known brand/flavor/context and a list of still-blank
        scalar fields, returns a suggested value plus a short rationale for each.
        Read-only — never writes anything; the client decides what (if anything)
        to commit. Used by the "Fill in missing data" setup assistant for fields
        that have no known profile/spec/default source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FillMissingInput"
      responses:
        "200":
          description: Suggested values (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillMissingResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/match-import:
    post:
      operationId: aiMatchImport
      tags: [ai]
      summary: Match imported brand/flavor names to saved ones (AI); read-only
      description: >-
        Given the saved brands and their flavors plus a list of imported
        brand/flavor names that did NOT exactly match, returns the best saved
        match for each (only when confident). Read-only — never writes anything;
        the client uses the matches as pre-selected suggestions in the Excel
        import dialog and the user can still override. Falls back silently to
        the client's fuzzy matching when unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchImportInput"
      responses:
        "200":
          description: Suggested matches (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchImportResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/match-premix:
    post:
      operationId: aiMatchPremix
      tags: [ai]
      summary: Match imported premix product names to saved brand+flavor (AI); read-only
      description: >-
        Given the saved brands and their flavors plus a list of imported premix
        PRODUCT names that did NOT ground to a saved product locally, returns the
        best saved brand (and flavor when clear) for each (only when confident).
        Read-only — never writes anything; the client uses the matches as
        pre-selected suggestions in the premix import dialog and the user can
        still override. Falls back silently to the client's local grounding when
        unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchPremixInput"
      responses:
        "200":
          description: Suggested premix matches (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchPremixResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/parse-spec-sheet:
    post:
      operationId: aiParseSpecSheet
      tags: [ai]
      summary: Interpret an uploaded Excel spec sheet / recipe workbook (AI)
      description: >-
        Given the flattened text of an uploaded .xlsx workbook plus the app's
        known canonical lists (brands, flavors, applicator/pepperoni types,
        recipe ingredients) and learned aliases, returns structured spec
        profiles and dough/sauce/cheese recipes. Read-only — never writes
        anything; the client canonicalizes names and applies the import.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseSpecSheetInput"
      responses:
        "200":
          description: Structured spec profiles + recipes (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseSpecSheetResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/suggest-merges:
    post:
      operationId: aiSuggestMerges
      tags: [ai]
      summary: Suggest groups of duplicate ingredient names to merge (AI)
      description: >-
        Given the app's full pool of mergeable ingredient/die names (plus any
        learned merge aliases), returns groups of likely duplicates, each with a
        recommended canonical name to keep. Read-only — never writes anything;
        the user reviews the suggestions and applies merges through the existing
        merge path. Falls back silently to remembered (alias-derived) suggestions
        when unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestMergesInput"
      responses:
        "200":
          description: Suggested merge groups (advisory only) — scoped to the request's category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestMergesResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /merge-aliases:
    get:
      operationId: listMergeAliases
      tags: [mergeAliases]
      summary: List learned ingredient-merge aliases (merged-away name -> kept name)
      description: >-
        Returns every learned merge alias — a saved mapping from an
        ingredient name that was merged away to the canonical name it was folded
        into. Clients supply these to the AI suggester and surface remembered
        suggestions deterministically. Available to any signed-in user.
      parameters:
        - name: category
          in: query
          required: false
          description: >-
            Which merge tab's pool to scope the alias list to. Defaults to
            "ingredient" for backward compatibility.
          schema:
            $ref: "#/components/schemas/MergeSuggestCategory"
        - name: brand
          in: query
          required: false
          description: >-
            When category is "flavor", scopes the alias list to a single
            brand's flavor pool. Ignored for every other category.
          schema:
            type: string
      responses:
        "200":
          description: All learned merge aliases in the requested category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeAliasList"
    post:
      operationId: saveMergeAliases
      tags: [mergeAliases]
      summary: Save learned ingredient-merge aliases (case-insensitive upsert)
      description: >-
        Persists a batch of merged-away -> kept name mappings recorded when a
        merge is confirmed. Existing aliases (matched case-insensitively on
        externalName, within the same category/brand) are updated; new ones
        are inserted. Available to any signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveMergeAliasesInput"
      responses:
        "200":
          description: The full updated alias list after the upsert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeAliasList"
        "400":
          description: Invalid input

  /denied-merges:
    get:
      operationId: listDeniedMerges
      tags: [deniedMerges]
      summary: List denied (ignored) ingredient-merge pairs
      description: >-
        Returns every denied merge pair — an unordered pair of ingredient names
        the user explicitly told the app to never propose merging together. The
        merge suggester filters these out of both AI and remembered suggestions.
        Available to any signed-in user.
      parameters:
        - name: category
          in: query
          required: false
          description: >-
            Which merge tab's pool to scope the denied-pair list to. Defaults
            to "ingredient" for backward compatibility.
          schema:
            $ref: "#/components/schemas/MergeSuggestCategory"
        - name: brand
          in: query
          required: false
          description: >-
            When category is "flavor", scopes the denied-pair list to a
            single brand's flavor pool. Ignored for every other category.
          schema:
            type: string
      responses:
        "200":
          description: All denied merge pairs in the requested category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeniedMergeList"
    post:
      operationId: saveDeniedMerges
      tags: [deniedMerges]
      summary: Save denied (ignored) ingredient-merge pairs
      description: >-
        Persists a batch of unordered name pairs the user denied, scoped to a
        category (and brand, for flavors). Pairs are normalized (trimmed,
        lowercased, sorted) and deduped; a pair that already exists is left
        as-is. Available to any signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDeniedMergesInput"
      responses:
        "200":
          description: The full updated denied-pair list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeniedMergeList"
        "400":
          description: Invalid input
    delete:
      operationId: deleteDeniedMerges
      tags: [deniedMerges]
      summary: Un-deny (remove) ingredient-merge pairs
      description: >-
        Removes a batch of denied pairs so they may be suggested again. Pairs are
        matched case-insensitively regardless of order. Available to any
        signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDeniedMergesInput"
      responses:
        "200":
          description: The full updated denied-pair list after removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeniedMergeList"
        "400":
          description: Invalid input

  /merged-away:
    get:
      operationId: listMergedAway
      tags: [mergedAway]
      summary: List durable merged-away ingredient/die names
      description: >-
        Returns the factory-wide tombstone of names that were merged away. The
        list never silently shrinks (only an explicit re-add removes a name), so
        every device can fetch it on load and strip these names from its master
        lists regardless of which device seeded the current day. Available to any
        signed-in user.
      responses:
        "200":
          description: All merged-away names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergedAwayList"
    post:
      operationId: saveMergedAway
      tags: [mergedAway]
      summary: Record merged-away ingredient/die names
      description: >-
        Persists a batch of names that were merged away. Names are normalized
        (trimmed, lowercased) and deduped; a name that already exists is left as
        is. Available to any signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveMergedAwayInput"
      responses:
        "200":
          description: The full updated merged-away name list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergedAwayList"
        "400":
          description: Invalid input
    delete:
      operationId: deleteMergedAway
      tags: [mergedAway]
      summary: Un-tombstone (remove) merged-away names
      description: >-
        Removes a batch of names from the tombstone so they may be used again —
        called when the user explicitly re-adds a previously merged-away name.
        Matched case-insensitively. Available to any signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveMergedAwayInput"
      responses:
        "200":
          description: The full updated merged-away name list after removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergedAwayList"
        "400":
          description: Invalid input

  /production-rules:
    get:
      operationId: listProductionRules
      tags: [productionRules]
      summary: List manager-defined production rules
      description: >-
        Returns every factory-wide production rule. Rules are global policy (not
        part of the per-day sync payload). Reading is available to any signed-in
        user so both apps can evaluate them; editing is manager-only.
      responses:
        "200":
          description: All production rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionRuleList"
    post:
      operationId: saveProductionRules
      tags: [productionRules]
      summary: Create or update production rules (manager only)
      description: >-
        Upserts a batch of production rules by id. Each rule is normalized and
        validated server-side; malformed rules are dropped. Manager role required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProductionRulesInput"
      responses:
        "200":
          description: The full updated rule list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionRuleList"
        "400":
          description: Invalid input
        "403":
          description: Manager role required
    delete:
      operationId: deleteProductionRules
      tags: [productionRules]
      summary: Delete production rules by id (manager only)
      description: >-
        Removes a batch of production rules by id. Manager role required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteProductionRulesInput"
      responses:
        "200":
          description: The full updated rule list after removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionRuleList"
        "400":
          description: Invalid input
        "403":
          description: Manager role required

  /freezer-pull-items:
    get:
      operationId: listFreezerPullItems
      tags: [freezerPullItems]
      summary: List manager-defined freezer-pull items
      description: >-
        Returns every factory-wide freezer-pull item (ingredients that must be
        pulled from the freezer a set number of days before the run that uses
        them). These are global policy (not part of the per-day sync payload).
        Reading is available to any signed-in user so both apps can build the
        warehouse pull notices; editing is manager-only.
      responses:
        "200":
          description: All freezer-pull items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreezerPullItemList"
    post:
      operationId: saveFreezerPullItems
      tags: [freezerPullItems]
      summary: Create or update freezer-pull items (manager only)
      description: >-
        Upserts a batch of freezer-pull items by id. Each item is normalized and
        validated server-side; malformed items are dropped. Manager role required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveFreezerPullItemsInput"
      responses:
        "200":
          description: The full updated item list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreezerPullItemList"
        "400":
          description: Invalid input
        "403":
          description: Manager role required
    delete:
      operationId: deleteFreezerPullItems
      tags: [freezerPullItems]
      summary: Delete freezer-pull items by id (manager only)
      description: >-
        Removes a batch of freezer-pull items by id. Manager role required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
