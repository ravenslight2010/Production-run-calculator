openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Username + password authentication
  - name: runs
    description: Production run history
  - name: inventory
    description: Stock / inventory control
  - name: roles
    description: Staff roles and access control
  - name: ai
    description: AI assistant (optimization recommendations)
  - name: incidents
    description: Issue reports, crash capture, and AI diagnosis
  - name: specImport
    description: Learned spec-sheet / recipe import aliases
  - name: productionRules
    description: Manager-defined factory-wide production rules
  - name: aiMemory
    description: Shared AI memory (facility knowledge + per-user conversation history)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/sign-up:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create a staff account and start a session
      description: >-
        Creates a new username + password account. The first account ever
        created becomes a manager; all later accounts default to operator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
        "409":
          description: Username already taken

  /auth/username-available:
    get:
      operationId: checkUsernameAvailable
      tags: [auth]
      summary: Check whether a username is available for sign-up
      description: >-
        Lightweight, read-only lookup used by the sign-up form to tell users in
        real time whether a username is still free. Public — sign-up is itself
        public. The check is case-insensitive, mirroring account creation.
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: Availability result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsernameAvailability"
        "400":
          description: Invalid input

  /auth/sign-in:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
        "401":
          description: Invalid username or password

  /auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      summary: Sign out (clears the session cookie)
      responses:
        "204":
          description: Signed out

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the signed-in user's password
      description: >-
        Updates the signed-in user's password. The current password must be
        provided and is verified before the stored scrypt hash is replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordCredentials"
      responses:
        "204":
          description: Password changed
        "400":
          description: Invalid input
        "401":
          description: Not signed in, or current password incorrect

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a manager-approved password reset
      description: >-
        A signed-out user requests recovery for a forgotten password. Always
        responds 200 regardless of whether the username exists, so the endpoint
        never reveals which accounts are real. When the account exists a pending
        reset request is recorded for a manager to approve.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Request accepted (whether or not the account exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid input

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Complete a password reset using a manager-issued code
      description: >-
        Verifies the single-use, short-lived code a manager issued for the
        account and, if valid and unexpired, replaces the password. The code is
        consumed on success so it can never be reused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset
        "400":
          description: Invalid input
        "401":
          description: Code is invalid, expired, or already used

  /password-reset-requests:
    get:
      operationId: listPasswordResetRequests
      tags: [auth]
      summary: List pending password reset requests (manager only)
      description: >-
        Returns the staff members currently waiting for a manager to approve a
        forgotten-password reset.
      responses:
        "200":
          description: Pending reset requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PasswordResetRequest"
        "403":
          description: Manager role required

  /password-reset-requests/{id}/approve:
    post:
      operationId: approvePasswordReset
      tags: [auth]
      summary: Approve a password reset and mint a relay code (manager only)
      description: >-
        Approves a pending reset request and returns a short-lived single-use
        code shown to the manager exactly once. The manager relays it to the
        locked-out staff member, who uses it with /auth/reset-password.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reset approved; relay code issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovePasswordResetResult"
        "403":
          description: Manager role required
        "404":
          description: No pending request with that id

  /password-reset-requests/{id}/decline:
    post:
      operationId: declinePasswordReset
      tags: [auth]
      summary: Decline a pending password reset request (manager only)
      description: >-
        Declines a pending reset request, removing it from the pending list
        without issuing a code. Useful for rejecting a suspicious or mistaken
        request.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Request declined
        "403":
          description: Manager role required
        "404":
          description: No pending request with that id

  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List saved production runs
      responses:
        "200":
          description: List of saved runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductionRun"
    post:
      operationId: createRun
      tags: [runs]
      summary: Save a production run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionRunInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionRun"
        "400":
          description: Invalid input

  /runs/{id}:
    delete:
      operationId: deleteRun
      tags: [runs]
      summary: Delete a saved run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List inventory items with lots and on-hand
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

  /inventory/items:
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Create an inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Invalid input

  /inventory/items/{id}:
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update an inventory item (name, reorder threshold)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventoryItemInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "404":
          description: Not found
    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      summary: Delete an inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /inventory/restock:
    post:
      operationId: restockInventory
      tags: [inventory]
      summary: Add a received lot (creates the item if missing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestockInput"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Invalid input

  /inventory/adjust:
    post:
      operationId: adjustInventory
      tags: [inventory]
      summary: Manually adjust on-hand quantity (delta-based)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustInput"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Invalid input
        "404":
          description: Not found

  /inventory/consume:
    post:
      operationId: consumeInventory
      tags: [inventory]
      summary: Deduct stock for a completed run (idempotent by runId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumeInput"
      responses:
        "200":
          description: Consumption result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumeResult"
        "400":
          description: Invalid input

  /inventory/merge:
    post:
      operationId: mergeInventory
      tags: [inventory]
      summary: Fold one or more source items' stock into a target item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeInventoryInput"
      responses:
        "200":
          description: Merge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeInventoryResult"
        "400":
          description: Invalid input

  /inventory/locations:
    get:
      operationId: listInventoryLocations
      tags: [inventory]
      summary: List stock locations (onsite first)
      responses:
        "200":
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryLocation"
    post:
      operationId: createInventoryLocation
      tags: [inventory]
      summary: Create a stock location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryLocationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryLocation"
        "400":
          description: Invalid input
        "409":
          description: Duplicate name

  /inventory/locations/{id}:
    patch:
      operationId: updateInventoryLocation
      tags: [inventory]
      summary: Rename a location or set it as onsite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventoryLocationInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryLocation"
        "400":
          description: Invalid input
        "404":
          description: Not found
        "409":
          description: Duplicate name
    delete:
      operationId: deleteInventoryLocation
      tags: [inventory]
      summary: Delete an empty, non-onsite location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: Location is onsite or still holds stock

  /inventory/transfer:
    post:
      operationId: transferInventory
      tags: [inventory]
      summary: Move stock from one location to another (preserves lots)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Invalid input
        "404":
          description: Not found
        "409":
          description: No stock available at the source location

  /inventory/ledger:
    get:
      operationId: listInventoryLedger
      tags: [inventory]
      summary: List movement history (optionally filtered by item)
      parameters:
        - name: itemId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryLedgerEntry"

  /inventory/settings:
    get:
      operationId: getInventorySettings
      tags: [inventory]
      summary: Get global inventory settings (expiry lead time)
      responses:
        "200":
          description: Inventory settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySettings"
    put:
      operationId: updateInventorySettings
      tags: [inventory]
      summary: Update global inventory settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventorySettingsInput"
      responses:
        "200":
          description: Updated inventory settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySettings"
        "400":
          description: Invalid input

  /inventory/identify-photo:
    post:
      operationId: identifyInventoryPhoto
      tags: [inventory]
      summary: Identify incoming stock items from a photo (AI vision); read-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifyPhotoInput"
      responses:
        "200":
          description: Identified stock items (each requires user confirmation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifyPhotoResult"
        "400":
          description: Invalid input
        "502":
          description: Vision provider error

  /inventory/quality-photo:
    post:
      operationId: qualityCheckPhoto
      tags: [inventory]
      summary: Assess finished-product quality from a photo (AI vision); read-only
      description: >-
        Looks at a photo of a finished pizza or crust and returns a
        plain-language quality assessment (size, topping coverage, appearance
        defects) plus a confidence score. Read-only — never records anything; the
        manager reviews the assessment and decides whether to confirm it. A
        confirmed outcome is written back into the shared facility memory by the
        client through the existing facility-knowledge write path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityCheckPhotoInput"
      responses:
        "200":
          description: A quality assessment (advisory only; requires confirmation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityCheckResult"
        "400":
          description: Invalid input
        "413":
          description: Image too large
        "429":
          description: Rate limited
        "502":
          description: Vision provider error

  /inventory/quality-checks:
    post:
      operationId: recordQualityCheck
      tags: [inventory]
      summary: Record a reviewed-and-confirmed quality check (manager only)
      description: >-
        Persists a structured record of a quality check a manager reviewed and
        confirmed (product type, verdict, confidence, summary, specific issues,
        optional notes and a small photo thumbnail). This builds a browsable
        history managers can audit and use to spot trends over time. The
        advisory /inventory/quality-photo endpoint never writes — this is the
        deliberate, user-driven save.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityCheckRecordInput"
      responses:
        "200":
          description: The recorded quality check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityCheckRecord"
        "400":
          description: Invalid input
        "403":
          description: Manager role required
    get:
      operationId: listQualityChecks
      tags: [inventory]
      summary: List past quality checks (manager only)
      description: >-
        Returns recorded quality checks (newest first) for a manager to review,
        optionally filtered by product type and/or status.
      parameters:
        - name: productType
          in: query
          required: false
          schema:
            type: string
            enum: [pizza, crust, other]
          description: Only return checks for this product type
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pass, warn, fail]
          description: Only return checks with this verdict
      responses:
        "200":
          description: Quality check history (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QualityCheckRecord"
        "403":
          description: Manager role required

  /inventory/waste-insight:
    post:
      operationId: wasteInsight
      tags: [inventory]
      summary: Flag items trending toward expiry and suggest run-order to use them first
      description: >-
        Reads current inventory and the configured expiry lead time, flags lots
        that are expired or expiring soon, and (when anything is flagged) asks
        the AI for a plain-language run-order suggestion to consume the
        at-risk stock first. Grounded in the real inventory data and the shared
        facility memory. Read-only — never applies any change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WasteInsightInput"
      responses:
        "200":
          description: Flagged items plus an advisory run-order suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WasteInsightResult"
        "400":
          description: Invalid input
        "429":
          description: Rate limited
        "502":
          description: AI provider error

  /ai/optimize:
    post:
      operationId: aiOptimize
      tags: [ai]
      summary: AI optimization recommendations for runs and break timing
      description: >-
        Analyzes the current day's runs, scheduled runs, and recent history and
        returns grouped/ranked recommendation cards. Read-only — never applies
        any change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeInput"
      responses:
        "200":
          description: Optimization recommendations (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/ask:
    post:
      operationId: aiAsk
      tags: [ai]
      summary: Ask the AI a free-form question about the day
      description: >-
        Answers a plain-language question grounded strictly in the day's real
        run data, the shared facility memory, and the asking user's recent
        conversation turns. Keeps per-user follow-up context, never invents data
        (says so when it can't answer), and records the exchange back into that
        user's conversation memory. Read-only — never applies any change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskInput"
      responses:
        "200":
          description: A grounded answer plus the user's updated conversation window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/command:
    post:
      operationId: aiCommand
      tags: [ai]
      summary: Classify a spoken phrase as a question or an executable command
      description: >-
        Takes a single spoken utterance plus the live day-state and classifies it
        as either a QUESTION (the client routes it to /ai/ask, unchanged) or a
        COMMAND. For a command, returns one or more structured actions drawn from
        a fixed vocabulary, with every fuzzy reference already resolved against
        the grounding (a run by brand/flavor → run id, an inventory item by name →
        item key/id) and a friendly label attached. Returns an explicit "none"
        when nothing actionable was understood. This endpoint never mutates
        anything itself — the client runs the actions through its existing
        handlers (with role gating and Undo).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandInput"
      responses:
        "200":
          description: Classification result — question, command actions, or none
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/recipe-assistant:
    post:
      operationId: aiRecipeAssistant
      tags: [ai]
      summary: Recipe & ingredient helper — scale, substitute, explain (AI); read-only
      description: >-
        Answers a plain-language question about the current run's recipes and
        ingredients — scaling a recipe, suggesting a substitution, or explaining
        a formula — grounded strictly in the supplied recipe rows, the known
        ingredient pool, the shared name-corrections, and the facility memory.
        Advisory only: never edits or commits a recipe, never invents
        ingredients or quantities (says so plainly when the data is
        insufficient). Read-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeAssistInput"
      responses:
        "200":
          description: A grounded plain-language answer (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeAssistResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/proactive-alert:
    post:
      operationId: aiProactiveAlert
      tags: [ai]
      summary: At-most-one proactive shift alert (AI); read-only
      description: >-
        Same live-day input as /ai/optimize, but evaluated on a cadence while a
        day is running. Returns at most a single timely, dismissible nudge
        (falling behind plan, or a natural break/changeover window) — or null
        when nothing is worth surfacing right now. Read-only; the client owns
        de-duplication and cooldown via the returned stable alert key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeInput"
      responses:
        "200":
          description: At most one proactive alert (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProactiveAlertResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/proactive-settings:
    get:
      operationId: getProactiveAlertSettings
      tags: [ai]
      summary: Get global proactive-alert settings (cadence, cooldown, on/off)
      responses:
        "200":
          description: Proactive-alert settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProactiveAlertSettings"
    put:
      operationId: updateProactiveAlertSettings
      tags: [ai]
      summary: Update global proactive-alert settings (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProactiveAlertSettingsInput"
      responses:
        "200":
          description: Updated proactive-alert settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProactiveAlertSettings"
        "400":
          description: Invalid input

  /ai/forecast:
    post:
      operationId: aiForecast
      tags: [ai]
      summary: Predict an upcoming day's run plan (AI); read-only
      description: >-
        Given recent finished production history (grouped by day) and any
        already-scheduled future runs, predicts a suggested run plan for one
        upcoming day — what to run, rough case quantities, and a sensible
        sequence — plus a plain-language rationale and an honest confidence
        level. Grounded strictly in the supplied history and shared facility
        memory; explicit about uncertainty and returns a null forecast (with a
        note) when history is too thin to predict responsibly. Read-only — never
        writes or commits anything; the manager reviews and adjusts the
        suggestion into the editable schedule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForecastInput"
      responses:
        "200":
          description: A suggested run plan for the target day (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/forecast-accuracy:
    post:
      operationId: aiForecastAccuracy
      tags: [ai]
      summary: Review how accurate past forecasts were vs. what actually ran; read-only
      description: >-
        Compares previously recorded demand forecasts (kept in shared facility
        memory) against the supplied actual finished production history for those
        dates. Returns a per-date review of predicted vs. actual products and
        case quantities plus a lightweight accuracy signal, so managers can see
        how well the forecaster has been doing and the AI can learn from misses.
        Read-only — never writes or commits run data; only the deterministic
        comparison is computed (no AI call).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForecastAccuracyInput"
      responses:
        "200":
          description: Per-date forecast-vs-actual reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastAccuracyResult"
        "400":
          description: Invalid input

  /ai/fill-missing:
    post:
      operationId: aiFillMissing
      tags: [ai]
      summary: Suggest values for blank run-setup fields (AI); read-only
      description: >-
        Given a run's known brand/flavor/context and a list of still-blank
        scalar fields, returns a suggested value plus a short rationale for each.
        Read-only — never writes anything; the client decides what (if anything)
        to commit. Used by the "Fill in missing data" setup assistant for fields
        that have no known profile/spec/default source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FillMissingInput"
      responses:
        "200":
          description: Suggested values (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillMissingResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/match-import:
    post:
      operationId: aiMatchImport
      tags: [ai]
      summary: Match imported brand/flavor names to saved ones (AI); read-only
      description: >-
        Given the saved brands and their flavors plus a list of imported
        brand/flavor names that did NOT exactly match, returns the best saved
        match for each (only when confident). Read-only — never writes anything;
        the client uses the matches as pre-selected suggestions in the Excel
        import dialog and the user can still override. Falls back silently to
        the client's fuzzy matching when unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchImportInput"
      responses:
        "200":
          description: Suggested matches (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchImportResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/parse-spec-sheet:
    post:
      operationId: aiParseSpecSheet
      tags: [ai]
      summary: Interpret an uploaded Excel spec sheet / recipe workbook (AI)
      description: >-
        Given the flattened text of an uploaded .xlsx workbook plus the app's
        known canonical lists (brands, flavors, applicator/pepperoni types,
        recipe ingredients) and learned aliases, returns structured spec
        profiles and dough/sauce/cheese recipes. Read-only — never writes
        anything; the client canonicalizes names and applies the import.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseSpecSheetInput"
      responses:
        "200":
          description: Structured spec profiles + recipes (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseSpecSheetResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /ai/suggest-merges:
    post:
      operationId: aiSuggestMerges
      tags: [ai]
      summary: Suggest groups of duplicate ingredient names to merge (AI)
      description: >-
        Given the app's full pool of mergeable ingredient/die names (plus any
        learned merge aliases), returns groups of likely duplicates, each with a
        recommended canonical name to keep. Read-only — never writes anything;
        the user reviews the suggestions and applies merges through the existing
        merge path. Falls back silently to remembered (alias-derived) suggestions
        when unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestMergesInput"
      responses:
        "200":
          description: Suggested merge groups (advisory only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestMergesResult"
        "400":
          description: Invalid input
        "502":
          description: AI provider error

  /merge-aliases:
    get:
      operationId: listMergeAliases
      tags: [mergeAliases]
      summary: List learned ingredient-merge aliases (merged-away name -> kept name)
      description: >-
        Returns every learned merge alias — a saved mapping from an
        ingredient name that was merged away to the canonical name it was folded
        into. Clients supply these to the AI suggester and surface remembered
        suggestions deterministically. Available to any signed-in user.
      responses:
        "200":
          description: All learned merge aliases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeAliasList"
    post:
      operationId: saveMergeAliases
      tags: [mergeAliases]
      summary: Save learned ingredient-merge aliases (case-insensitive upsert)
      description: >-
        Persists a batch of merged-away -> kept name mappings recorded when a
        merge is confirmed. Existing aliases (matched case-insensitively on
        externalName) are updated; new ones are inserted. Available to any
        signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveMergeAliasesInput"
      responses:
        "200":
          description: The full updated alias list after the upsert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeAliasList"
        "400":
          description: Invalid input

  /denied-merges:
    get:
      operationId: listDeniedMerges
      tags: [deniedMerges]
      summary: List denied (ignored) ingredient-merge pairs
      description: >-
        Returns every denied merge pair — an unordered pair of ingredient names
        the user explicitly told the app to never propose merging together. The
        merge suggester filters these out of both AI and remembered suggestions.
        Available to any signed-in user.
      responses:
        "200":
          description: All denied merge pairs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeniedMergeList"
    post:
      operationId: saveDeniedMerges
      tags: [deniedMerges]
      summary: Save denied (ignored) ingredient-merge pairs
      description: >-
        Persists a batch of unordered name pairs the user denied. Pairs are
        normalized (trimmed, lowercased, sorted) and deduped; a pair that already
        exists is left as-is. Available to any signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDeniedMergesInput"
      responses:
        "200":
          description: The full updated denied-pair list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeniedMergeList"
        "400":
          description: Invalid input
    delete:
      operationId: deleteDeniedMerges
      tags: [deniedMerges]
      summary: Un-deny (remove) ingredient-merge pairs
      description: >-
        Removes a batch of denied pairs so they may be suggested again. Pairs are
        matched case-insensitively regardless of order. Available to any
        signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDeniedMergesInput"
      responses:
        "200":
          description: The full updated denied-pair list after removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeniedMergeList"
        "400":
          description: Invalid input

  /production-rules:
    get:
      operationId: listProductionRules
      tags: [productionRules]
      summary: List manager-defined production rules
      description: >-
        Returns every factory-wide production rule. Rules are global policy (not
        part of the per-day sync payload). Reading is available to any signed-in
        user so both apps can evaluate them; editing is manager-only.
      responses:
        "200":
          description: All production rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionRuleList"
    post:
      operationId: saveProductionRules
      tags: [productionRules]
      summary: Create or update production rules (manager only)
      description: >-
        Upserts a batch of production rules by id. Each rule is normalized and
        validated server-side; malformed rules are dropped. Manager role required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProductionRulesInput"
      responses:
        "200":
          description: The full updated rule list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionRuleList"
        "400":
          description: Invalid input
        "403":
          description: Manager role required
    delete:
      operationId: deleteProductionRules
      tags: [productionRules]
      summary: Delete production rules by id (manager only)
      description: >-
        Removes a batch of production rules by id. Manager role required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteProductionRulesInput"
      responses:
        "200":
          description: The full updated rule list after removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionRuleList"
        "400":
          description: Invalid input
        "403":
          description: Manager role required

  /ai-corrections:
    get:
      operationId: listAiCorrections
      tags: [aiCorrections]
      summary: List the shared factory-wide AI name corrections
      description: >-
        Returns every confirmed name correction in the shared pool (domain-tagged
        fromText -> toText), recorded whenever staff confirm a correction in any
        AI helper. Clients supply these to the AI helpers to ground name
        resolution. Available to any signed-in user.
      responses:
        "200":
          description: All shared AI corrections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCorrectionList"
    post:
      operationId: saveAiCorrections
      tags: [aiCorrections]
      summary: Save confirmed AI name corrections (case-insensitive upsert)
      description: >-
        Persists a batch of confirmed name corrections recorded when staff apply
        a suggestion in any AI helper. Existing entries (matched
        case-insensitively on domain + fromText) are updated; new ones inserted.
        Additive — each helper keeps its own alias table too. Available to any
        signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAiCorrectionsInput"
      responses:
        "200":
          description: The full updated correction list after the upsert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCorrectionList"
        "400":
          description: Invalid input

  /ai-memory/facility:
    get:
      operationId: listFacilityKnowledge
      tags: [aiMemory]
      summary: List the shared facility-wide AI knowledge pool
      description: >-
        Returns every durable operational fact in the shared facility-knowledge
        pool (domain-tagged plain-language observations the whole team and every
        AI feature have learned over time). Distinct from the name-corrections
        pool. AI helpers fold this into their prompts via a shared context
        builder, so a pattern learned in one feature is visible to all. Available
        to any signed-in user.
      responses:
        "200":
          description: All shared facility knowledge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityKnowledgeList"
    post:
      operationId: saveFacilityKnowledge
      tags: [aiMemory]
      summary: Record facility knowledge (case-insensitive upsert by domain + key)
      description: >-
        Persists a batch of durable operational facts into the shared
        facility-knowledge pool. Existing entries (matched case-insensitively on
        domain + key) are updated in place; new ones are inserted. This is the
        single shared write path AI features use to record observations back into
        facility memory. Available to any signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveFacilityKnowledgeInput"
      responses:
        "200":
          description: The full updated knowledge pool after the upsert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityKnowledgeList"
        "400":
          description: Invalid input

  /ai-memory/conversation:
    get:
      operationId: getConversationHistory
      tags: [aiMemory]
      summary: Get the current user's recent AI conversation turns
      description: >-
        Returns the signed-in user's most recent AI conversation turns (oldest
        first), a rolling per-user window so follow-up questions keep context.
        Scoped to the caller only — never another user's history.
      responses:
        "200":
          description: The current user's recent conversation turns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationHistory"
    post:
      operationId: appendConversation
      tags: [aiMemory]
      summary: Append turns to the current user's AI conversation memory
      description: >-
        Appends one or more turns (user and/or assistant messages) to the
        signed-in user's conversation memory, then trims to the rolling window so
        the log never grows without bound. Scoped to the caller only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendConversationInput"
      responses:
        "200":
          description: The current user's recent conversation turns after appending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationHistory"
        "400":
          description: Invalid input

  /spec-import-aliases:
    get:
      operationId: listSpecImportAliases
      tags: [specImport]
      summary: List learned spec-import aliases (messy label -> canonical name)
      description: >-
        Returns every learned spec-import alias — a saved mapping from a raw
        spreadsheet label to the app's canonical name it resolves to, across all
        name-kinds (brand, flavor, applicator type, pepperoni type, recipe
        ingredients). Clients supply these to the AI parser and apply them
        deterministically. Available to any signed-in user (operators included).
      responses:
        "200":
          description: All learned spec-import aliases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecImportAliasList"
    post:
      operationId: saveSpecImportAliases
      tags: [specImport]
      summary: Save learned spec-import aliases (case-insensitive upsert)
      description: >-
        Persists a batch of label mappings resolved during a spec-sheet import.
        Existing aliases (matched case-insensitively on kind + externalName +
        context) are updated; new ones are inserted. Available to any signed-in
        user (operators included).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveSpecImportAliasesInput"
      responses:
        "200":
          description: The full updated alias list after the upsert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecImportAliasList"
        "400":
          description: Invalid input

  /import-aliases:
    get:
      operationId: listImportAliases
      tags: [importAliases]
      summary: List learned import aliases (brand/flavor name mappings)
      description: >-
        Returns every learned import alias — a saved mapping from a raw imported
        brand/flavor name to the saved (canonical) name a user previously
        confirmed it matches. Clients use these to auto-apply remembered matches
        in the Excel import dialog before falling back to AI/fuzzy matching.
        Available to any signed-in user (operators included).
      responses:
        "200":
          description: All learned aliases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAliasList"
    post:
      operationId: saveImportAliases
      tags: [importAliases]
      summary: Save learned import aliases (case-insensitive upsert)
      description: >-
        Persists a batch of brand/flavor name mappings confirmed by the user
        during an Excel import. Existing aliases (matched case-insensitively on
        type + externalName + brandContext) are updated; new ones are inserted.
        Available to any signed-in user (operators included).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveImportAliasesInput"
      responses:
        "200":
          description: The full updated alias list after the upsert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAliasList"
        "400":
          description: Invalid input

  /fill-missing-values:
    get:
      operationId: listFillMissingValues
      tags: [fillMissingValues]
      summary: List learned fill-missing values (per product + field)
      description: >-
        Returns every learned "fill in missing data" value — a value a user
        previously confirmed for a blank run-setup field, keyed by the run's
        product (brand + flavor) and the field. Clients use these to propose the
        remembered value as a top-priority source before falling back to
        profile/spec/default/AI. Available to any signed-in user.
      responses:
        "200":
          description: All learned values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillMissingValueList"
    post:
      operationId: saveFillMissingValues
      tags: [fillMissingValues]
      summary: Save learned fill-missing values (case-insensitive upsert)
      description: >-
        Persists a batch of confirmed field values, keyed case-insensitively on
        brand + flavor + fieldKey. Existing entries are updated; new ones are
        inserted. Available to any signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveFillMissingValuesInput"
      responses:
        "200":
          description: The full updated value list after the upsert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillMissingValueList"
        "400":
          description: Invalid input

  /photo-aliases:
    get:
      operationId: listPhotoAliases
      tags: [photoAliases]
      summary: List learned photo-intake aliases (guessName -> itemKey)
      description: >-
        Returns every learned photo-intake alias — a saved mapping from a vision
        model's guessed item name to the inventory item key a user confirmed it
        matches. Clients use these to auto-apply remembered matches when
        identifying inventory from a photo. Available to any signed-in user.
      responses:
        "200":
          description: All learned photo aliases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoAliasList"
    post:
      operationId: savePhotoAliases
      tags: [photoAliases]
      summary: Save learned photo-intake aliases (case-insensitive upsert)
      description: >-
        Persists a batch of guessName -> itemKey mappings confirmed by the user
        during photo intake. Existing entries (matched case-insensitively on
        guessName) are updated; new ones are inserted. Available to any signed-in
        user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePhotoAliasesInput"
      responses:
        "200":
          description: The full updated alias list after the upsert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoAliasList"
        "400":
          description: Invalid input

  /incidents:
    post:
      operationId: reportIncident
      tags: [incidents]
      summary: Report an issue or a crash and get an AI diagnosis
      description: >-
        Records an incident (a user-reported problem or an auto-captured crash)
        and returns a plain-language AI diagnosis plus a suggested workaround.
        Allowed for any signed-in user. The diagnosis is also stored on the
        incident for managers to review later. Rate-limited per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportIncidentInput"
      responses:
        "200":
          description: Incident recorded; diagnosis returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentDiagnosis"
        "400":
          description: Invalid input
        "429":
          description: Too many requests
    get:
      operationId: listIncidents
      tags: [incidents]
      summary: List incidents (manager only)
      description: >-
        Returns recorded incidents (newest first) for a manager to review,
        including the captured context and the AI diagnosis.
      responses:
        "200":
          description: Incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
        "403":
          description: Manager role required

  /incidents/unreviewed-count:
    get:
      operationId: getUnreviewedIncidentCount
      tags: [incidents]
      summary: Count of unreviewed incidents (manager only)
      description: >-
        Returns the number of incidents still marked new/unreviewed, used to
        drive the manager nav badge.
      responses:
        "200":
          description: Unreviewed incident count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreviewedIncidentCount"
        "403":
          description: Manager role required

  /incidents/{id}:
    get:
      operationId: getIncident
      tags: [incidents]
      summary: Get one incident (manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "403":
          description: Manager role required
        "404":
          description: No incident with that id

  /incidents/{id}/review:
    post:
      operationId: reviewIncident
      tags: [incidents]
      summary: Mark an incident reviewed (manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "403":
          description: Manager role required
        "404":
          description: No incident with that id

  /incidents/{id}/resolve:
    post:
      operationId: resolveIncident
      tags: [incidents]
      summary: Mark an incident resolved (manager only)
      description: >-
        Marks an incident resolved (its underlying problem is considered
        fixed/handled). "resolved" implies "reviewed".
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "403":
          description: Manager role required
        "404":
          description: No incident with that id

  /me:
    get:
      operationId: getMe
      tags: [roles]
      summary: Current signed-in user's identity and role
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /me/onboarding-seen:
    post:
      operationId: markOnboardingSeen
      tags: [roles]
      summary: Mark the first-login "Get Started" overview as seen
      description: >-
        Sets the current user's onboardingSeen flag so the "Get Started"
        overview never auto-opens again on any of their devices. Idempotent.
      responses:
        "200":
          description: Updated current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /me/tour-completed:
    post:
      operationId: markTourCompleted
      tags: [roles]
      summary: Mark the guided tour as completed
      description: >-
        Sets the current user's tourCompleted flag once they reach the guided
        tour's final step, so the app can tell a brand-new user from one who has
        already finished the tour. Idempotent.
      responses:
        "200":
          description: Updated current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List all defined roles and their capabilities (manage-staff)
      responses:
        "200":
          description: Role catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleDefinition"
        "403":
          description: Missing capability
    post:
      operationId: createRole
      tags: [roles]
      summary: Create a new role (manage-staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRole"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDefinition"
        "400":
          description: Invalid input
        "403":
          description: Missing capability or attempt to grant a capability you lack
        "409":
          description: A role with that name already exists

  /roles/{name}:
    put:
      operationId: updateRole
      tags: [roles]
      summary: Update a role's capabilities (manage-staff)
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleCapabilitiesUpdate"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDefinition"
        "400":
          description: Invalid input
        "403":
          description: Missing capability or attempt to grant a capability you lack
        "404":
          description: Role not found
    delete:
      operationId: deleteRole
      tags: [roles]
      summary: Delete a role (manage-staff)
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Role deleted
        "400":
          description: Built-in role or role still assigned to users
        "403":
          description: Missing capability
        "404":
          description: Role not found

  /users:
    get:
      operationId: listStaff
      tags: [roles]
      summary: List staff members and their roles (manager only)
      responses:
        "200":
          description: Staff roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
        "403":
          description: Manager role required

  /users/{userId}/role:
    put:
      operationId: setStaffRole
      tags: [roles]
      summary: Change a staff member's role (manager only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffRoleUpdate"
      responses:
        "200":
          description: Updated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          description: Invalid input
        "403":
          description: Manager role required

  /users/{userId}/password:
    put:
      operationId: resetStaffPassword
      tags: [roles]
      summary: Reset a staff member's password (manager only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetStaffPassword"
      responses:
        "204":
          description: Password reset
        "400":
          description: Invalid input
        "403":
          description: Manager role required
        "404":
          description: User not found

  /users/{userId}:
    delete:
      operationId: deleteStaffMember
      tags: [roles]
      summary: Remove a staff member (manager only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Staff member removed
        "400":
          description: Cannot remove the last manager
        "403":
          description: Manager role required
        "404":
          description: User not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ProductionRun:
      type: object
      required:
        - id
        - label
        - casesNeeded
        - casesLeft
        - skidsCompleted
        - pizzasPerMin
        - totalTimeSec
        - batchesNeeded
        - inputs
        - createdAt
      properties:
        id:
          type: integer
        label:
          type: string
        casesNeeded:
          type: integer
        casesLeft:
          type: integer
        skidsCompleted:
          type: integer
        pizzasPerMin:
          type: string
        totalTimeSec:
          type: integer
        batchesNeeded:
          type: string
        inputs:
          type: object
          additionalProperties: true
        notes:
          type: string
        createdAt:
          type: string
          format: date-time

    ProductionRunInput:
      type: object
      required:
        - casesNeeded
        - casesLeft
        - skidsCompleted
        - pizzasPerMin
        - totalTimeSec
        - batchesNeeded
        - inputs
      properties:
        label:
          type: string
        casesNeeded:
          type: integer
        casesLeft:
          type: integer
        skidsCompleted:
          type: integer
        pizzasPerMin:
          type: string
        totalTimeSec:
          type: integer
        batchesNeeded:
          type: string
        inputs:
          type: object
          additionalProperties: true
        notes:
          type: string

    InventoryLocation:
      type: object
      required:
        - id
        - name
        - isOnsite
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        isOnsite:
          type: boolean
        createdAt:
          type: string
          format: date-time

    LocationStock:
      type: object
      required:
        - locationId
        - locationName
        - isOnsite
        - onHand
      properties:
        locationId:
          type: integer
        locationName:
          type: string
        isOnsite:
          type: boolean
        onHand:
          type: number

    InventoryLot:
      type: object
      required:
        - id
        - itemId
        - lotNumber
        - qtyReceived
        - qtyRemaining
        - createdAt
      properties:
        id:
          type: integer
        itemId:
          type: integer
        locationId:
          type: [integer, "null"]
        lotNumber:
          type: string
        qtyReceived:
          type: number
        qtyRemaining:
          type: number
        receivedDate:
          type: [string, "null"]
        expirationDate:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time

    InventoryItem:
      type: object
      required:
        - id
        - key
        - category
        - name
        - unit
        - reorderThreshold
        - onHand
        - lots
        - byLocation
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        key:
          type: string
        category:
          type: string
        name:
          type: string
        unit:
          type: string
        reorderThreshold:
          type: number
        onHand:
          type: number
        lots:
          type: array
          items:
            $ref: "#/components/schemas/InventoryLot"
        byLocation:
          type: array
          items:
            $ref: "#/components/schemas/LocationStock"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateInventoryItemInput:
      type: object
      required:
        - key
        - category
        - name
        - unit
      properties:
        key:
          type: string
        category:
          type: string
        name:
          type: string
        unit:
          type: string
        reorderThreshold:
          type: number

    UpdateInventoryItemInput:
      type: object
      properties:
        name:
          type: string
        reorderThreshold:
          type: number

    RestockInput:
      type: object
      required:
        - itemKey
        - category
        - name
        - unit
        - qty
      properties:
        itemKey:
          type: string
        category:
          type: string
        name:
          type: string
        unit:
          type: string
        qty:
          type: number
        lotNumber:
          type: string
        receivedDate:
          type: [string, "null"]
        expirationDate:
          type: [string, "null"]
        locationId:
          type: integer

    CreateInventoryLocationInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        isOnsite:
          type: boolean

    UpdateInventoryLocationInput:
      type: object
      properties:
        name:
          type: string
        isOnsite:
          type: boolean

    TransferInput:
      type: object
      required:
        - itemId
        - fromLocationId
        - toLocationId
        - qty
      properties:
        itemId:
          type: integer
        fromLocationId:
          type: integer
        toLocationId:
          type: integer
        qty:
          type: number

    AdjustInput:
      type: object
      required:
        - itemId
        - qtyDelta
      properties:
        itemId:
          type: integer
        qtyDelta:
          type: number
        note:
          type: string

    ConsumeLine:
      type: object
      required:
        - itemKey
        - qty
      properties:
        itemKey:
          type: string
        qty:
          type: number

    ConsumeInput:
      type: object
      required:
        - runId
        - lines
      properties:
        runId:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ConsumeLine"

    MergeInventoryItem:
      type: object
      required:
        - fromKey
        - toKey
        - toName
        - category
        - unit
      properties:
        fromKey:
          type: string
        toKey:
          type: string
        toName:
          type: string
        category:
          type: string
        unit:
          type: string

    MergeInventoryInput:
      type: object
      required:
        - merges
      properties:
        merges:
          type: array
          items:
            $ref: "#/components/schemas/MergeInventoryItem"

    MergeOutcome:
      type: object
      required:
        - fromKey
        - toKey
        - status
      properties:
        fromKey:
          type: string
        toKey:
          type: string
        status:
          type: string
          enum: [applied, skipped]
        reason:
          type: string
          enum: [blank-key, same-key, source-not-tracked, same-item]

    MergeInventoryResult:
      type: object
      required:
        - merged
        - results
      properties:
        merged:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/MergeOutcome"

    ConsumeResult:
      type: object
      required:
        - applied
      properties:
        applied:
          type: boolean
        consumed:
          type: integer

    InventoryLedgerEntry:
      type: object
      required:
        - id
        - itemId
        - type
        - qtyDelta
        - note
        - createdAt
      properties:
        id:
          type: integer
        itemId:
          type: integer
        lotId:
          type: [integer, "null"]
        type:
          type: string
        qtyDelta:
          type: number
        runId:
          type: [string, "null"]
        note:
          type: string
        createdAt:
          type: string
          format: date-time

    InventorySettings:
      type: object
      required:
        - expirySoonDays
      properties:
        expirySoonDays:
          type: integer

    UpdateInventorySettingsInput:
      type: object
      required:
        - expirySoonDays
      properties:
        expirySoonDays:
          type: integer

    ProactiveAlertSettings:
      type: object
      required:
        - enabled
        - pollSeconds
        - cooldownSeconds
      properties:
        enabled:
          type: boolean
        pollSeconds:
          type: integer
        cooldownSeconds:
          type: integer

    UpdateProactiveAlertSettingsInput:
      type: object
      required:
        - enabled
        - pollSeconds
        - cooldownSeconds
      properties:
        enabled:
          type: boolean
        pollSeconds:
          type: integer
        cooldownSeconds:
          type: integer

    PhotoCandidate:
      type: object
      required:
        - key
        - category
        - name
        - unit
      properties:
        key:
          type: string
        category:
          type: string
        name:
          type: string
        unit:
          type: string

    IdentifyPhotoInput:
      type: object
      required:
        - imageBase64
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image data (no data URI prefix)
        mimeType:
          type: string
          description: Image MIME type, e.g. image/jpeg
        candidates:
          type: array
          description: Known inventory + production items to match against
          items:
            $ref: "#/components/schemas/PhotoCandidate"

    PhotoGuess:
      type: object
      required:
        - name
        - qty
        - unit
        - category
        - matchedKey
        - confidence
      properties:
        name:
          type: string
        qty:
          type: number
        unit:
          type: string
        category:
          type: string
          enum: [ingredient, packaging]
        matchedKey:
          type: [string, "null"]
          description: Stable key of a matched known item, or null for a new item
        confidence:
          type: number
          description: 0..1 model confidence in this identification

    IdentifyPhotoResult:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PhotoGuess"

    QualityCheckPhotoInput:
      type: object
      required:
        - imageBase64
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image data (no data URI prefix)
        mimeType:
          type: string
          description: Image MIME type, e.g. image/jpeg
        productType:
          type: string
          enum: [pizza, crust, other]
          description: What the photo is of, to focus the assessment
        notes:
          type: string
          description: >-
            Optional plain-language context the user wants considered (e.g. the
            product/run, expected size, or a specific concern).

    QualityIssue:
      type: object
      description: One specific quality concern the AI observed in the photo.
      required:
        - type
        - severity
        - detail
      properties:
        type:
          type: string
          description: Short category of the issue (e.g. size, topping coverage, appearance, burn)
        severity:
          type: string
          enum: [minor, major, critical]
        detail:
          type: string
          description: One plain-language sentence describing the issue

    QualityAssessment:
      type: object
      required:
        - summary
        - status
        - confidence
        - issues
      properties:
        summary:
          type: string
          description: One-or-two-sentence plain-language overall assessment
        status:
          type: string
          enum: [pass, warn, fail]
          description: Overall verdict — pass (looks good), warn (minor issues), fail (clear defects)
        confidence:
          type: number
          description: 0..1 model confidence in this assessment
        issues:
          type: array
          items:
            $ref: "#/components/schemas/QualityIssue"

    QualityCheckResult:
      type: object
      required:
        - assessment
        - generatedAt
      properties:
        assessment:
          $ref: "#/components/schemas/QualityAssessment"
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when the photo could not be assessed

    QualityCheckRecordInput:
      type: object
      description: >-
        A reviewed-and-confirmed quality check to persist into the manager
        history.
      required:
        - productType
        - status
        - confidence
        - summary
        - issues
      properties:
        productType:
          type: string
          enum: [pizza, crust, other]
        status:
          type: string
          enum: [pass, warn, fail]
        confidence:
          type: number
          description: 0..1 model confidence at check time
        summary:
          type: string
          description: Plain-language overall assessment
        issues:
          type: array
          items:
            $ref: "#/components/schemas/QualityIssue"
        notes:
          type: string
          description: Optional plain-language context the reviewer attached
        thumbnail:
          type: string
          description: >-
            Optional small base64 data URI of the analyzed photo; dropped
            server-side when too large.

    QualityCheckRecord:
      type: object
      description: A persisted quality check in the manager history.
      required:
        - id
        - productType
        - status
        - confidence
        - summary
        - issues
        - createdAt
      properties:
        id:
          type: integer
        productType:
          type: string
          enum: [pizza, crust, other]
        status:
          type: string
          enum: [pass, warn, fail]
        confidence:
          type: number
        summary:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/QualityIssue"
        notes:
          type: string
          nullable: true
        thumbnail:
          type: string
          nullable: true
        reviewerName:
          type: string
          nullable: true
        createdAt:
          type: string
          description: ISO-8601 timestamp the check was recorded

    WasteInsightInput:
      type: object
      description: >-
        Request for an expiry/waste insight. Inventory and expiry data are read
        server-side; the optional plannedItems give the AI the production context
        it needs to suggest which planned products to run first.
      properties:
        plannedItems:
          type: array
          description: >-
            Items the current/upcoming production plan would consume, so the AI
            can recommend which planned products to run first to use at-risk
            stock. Optional.
          items:
            $ref: "#/components/schemas/PhotoCandidate"

    WasteInsightItem:
      type: object
      description: An inventory item flagged as expired or expiring soon.
      required:
        - key
        - name
        - category
        - unit
        - status
        - qtyAtRisk
        - earliestExpiration
        - daysUntilExpiry
      properties:
        key:
          type: string
        name:
          type: string
        category:
          type: string
        unit:
          type: string
        status:
          type: string
          enum: [expired, soon]
        qtyAtRisk:
          type: number
          description: Quantity in flagged (expired or expiring-soon) lots
        earliestExpiration:
          type: [string, "null"]
          description: Earliest expiration date among the flagged lots (YYYY-MM-DD)
        daysUntilExpiry:
          type: [number, "null"]
          description: Days until the earliest flagged lot expires (negative if already expired)

    WasteInsightResult:
      type: object
      required:
        - flagged
        - suggestion
        - generatedAt
      properties:
        flagged:
          type: array
          items:
            $ref: "#/components/schemas/WasteInsightItem"
        suggestion:
          type: [string, "null"]
          description: Plain-language run-order suggestion, or null when nothing is at risk
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when no suggestion could be produced

    AuthCredentials:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 6
          maxLength: 200

    AuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/StaffMember"

    ChangePasswordCredentials:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 200
        newPassword:
          type: string
          minLength: 6
          maxLength: 200

    Capability:
      type: string
      enum:
        - manage-staff
        - manage-inventory
        - edit-production-rules
        - approve-password-resets
        - review-incidents
        - use-ai-tools
      description: >-
        A discrete permission. A role grants a set of capabilities, and a user
        holds the union of their role's capabilities.

    RoleDefinition:
      type: object
      required:
        - name
        - capabilities
        - builtin
      properties:
        name:
          type: string
          description: Unique role name (also its identifier).
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        builtin:
          type: boolean
          description: >-
            Whether this is a built-in role. The "manager" role is protected
            (cannot be deleted and must keep the manage-staff capability) and
            "operator" is the default no-capability role. Built-in roles cannot
            be deleted.

    CreateRole:
      type: object
      required:
        - name
        - capabilities
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"

    RoleCapabilitiesUpdate:
      type: object
      required:
        - capabilities
      properties:
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: >-
            Optional new name for the role (rename). When present and different
            from the path name, the role is renamed and every staff assignment
            is moved to the new name. Built-in roles cannot be renamed.

    StaffMember:
      type: object
      required:
        - userId
        - role
        - capabilities
        - email
        - name
        - onboardingSeen
        - tourCompleted
        - sandbox
        - sandboxCopiedAt
        - sandboxStale
      properties:
        userId:
          type: string
        role:
          type: string
          description: The name of the role assigned to this user.
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
          description: The capabilities granted by this user's role.
        email:
          type: [string, "null"]
        name:
          type: [string, "null"]
        onboardingSeen:
          type: boolean
          description: >-
            Whether the user has dismissed the first-login "Get Started"
            overview.
        tourCompleted:
          type: boolean
          description: >-
            Whether the user has finished the guided tour (reached its final
            step).
        sandbox:
          type: boolean
          description: >-
            Whether this is the seeded sandbox account, which operates in the
            isolated "sandbox" data scope. Clients show a persistent sandbox
            banner and offer a "Reset sandbox" action when true.
        sandboxCopiedAt:
          type: [string, "null"]
          description: >-
            ISO timestamp of when the sandbox was last re-copied from live, or
            null when it has never been copied. Only meaningful for the sandbox
            account (null for everyone else); clients show it in the banner as
            "Sandbox copied from live at …".
        sandboxStale:
          type: boolean
          description: >-
            Whether the sandbox copy is stale and due for an automatic refresh
            from live. The client drives the re-copy (reusing the manual reset
            flow); the server owns the staleness cutoff so web and mobile stay
            in lockstep. Always false for non-sandbox accounts.

    StaffRoleUpdate:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          description: The name of the role to assign to the user.

    ResetStaffPassword:
      type: object
      required:
        - newPassword
      properties:
        newPassword:
          type: string
          minLength: 6
          maxLength: 200

    OkResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean

    UsernameAvailability:
      type: object
      required:
        - available
      properties:
        available:
          type: boolean
          description: True when no account already uses this username.

    ForgotPasswordRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64

    ResetPasswordRequest:
      type: object
      required:
        - username
        - code
        - newPassword
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        code:
          type: string
          minLength: 1
          maxLength: 64
        newPassword:
          type: string
          minLength: 6
          maxLength: 200

    PasswordResetRequest:
      type: object
      required:
        - id
        - userId
        - username
        - requestedAt
      properties:
        id:
          type: string
        userId:
          type: string
        username:
          type: string
        requestedAt:
          type: string
          format: date-time

    ApprovePasswordResetResult:
      type: object
      required:
        - username
        - code
        - expiresAt
      properties:
        username:
          type: string
        code:
          type: string
        expiresAt:
          type: string
          format: date-time

    OptimizeStoppage:
      type: object
      required:
        - reason
        - durationSec
        - open
      properties:
        reason:
          type: string
        durationSec:
          type: number
        open:
          type: boolean
          description: True if the stoppage is still in progress (no end time)

    OptimizeRun:
      type: object
      required:
        - id
        - label
        - brand
        - flavor
        - dieType
        - status
        - casesNeeded
        - casesMade
        - casesLeft
        - plannedPpm
        - actualPpm
        - minutesRemaining
        - netElapsedSec
        - downtimeSec
        - stoppages
      properties:
        id:
          type: string
        label:
          type: string
        brand:
          type: string
        flavor:
          type: string
        dieType:
          type: string
        status:
          type: string
          enum: [running, upcoming, finished]
        casesNeeded:
          type: number
        casesMade:
          type: number
        casesLeft:
          type: number
        plannedPpm:
          type: number
          description: Planned pizzas-per-minute from line config
        actualPpm:
          type: [number, "null"]
          description: Observed pizzas-per-minute, or null if not yet measurable
        minutesRemaining:
          type: [number, "null"]
        netElapsedSec:
          type: number
        downtimeSec:
          type: number
        stoppages:
          type: array
          items:
            $ref: "#/components/schemas/OptimizeStoppage"

    OptimizeScheduledRun:
      type: object
      required:
        - date
        - brand
        - flavor
        - dieType
        - casesNeeded
      properties:
        date:
          type: string
        brand:
          type: string
        flavor:
          type: string
        dieType:
          type: string
        casesNeeded:
          type: number

    OptimizeInput:
      type: object
      required:
        - date
        - nowMs
        - runs
      properties:
        date:
          type: string
        nowMs:
          type: number
          description: Client clock (ms epoch) so the model can reason about timing
        runToTime:
          type: string
          description: Target completion time of day (HH:MM), or empty if unset
        todayPpm:
          type: number
          description: Today's aggregate pizzas-per-minute so far
        benchmarkPpm:
          type: [number, "null"]
          description: Historical average pizzas-per-minute, or null if no history
        runs:
          type: array
          description: Today's runs (running, upcoming, and finished)
          items:
            $ref: "#/components/schemas/OptimizeRun"
        scheduledRuns:
          type: array
          description: Future planned runs
          items:
            $ref: "#/components/schemas/OptimizeScheduledRun"
        historyRuns:
          type: array
          description: Recent finished runs from prior days
          items:
            $ref: "#/components/schemas/OptimizeRun"

    OptimizeAction:
      type: object
      description: >-
        Optional one-tap action a manager can apply from a recommendation.
        Advisory until explicitly tapped; each kind maps to an existing client
        mutation. Run-targeted kinds reference today's run ids.
      required:
        - kind
        - label
      properties:
        kind:
          type: string
          enum: [set_target_time, set_run_target, reorder_run]
        label:
          type: string
          description: Short imperative button caption
        time:
          type: string
          description: "Target finish time HH:MM (set_target_time)"
        runId:
          type: string
          description: Target run id (set_run_target, reorder_run)
        casesNeeded:
          type: number
          description: New case target (set_run_target)
        beforeRunId:
          type: [string, "null"]
          description: >-
            reorder_run: move runId immediately before this run id, or null to
            move it last

    OptimizeRecommendation:
      type: object
      required:
        - category
        - title
        - detail
        - impact
        - appliesTo
      properties:
        category:
          type: string
          enum: [run, break, efficiency]
        title:
          type: string
        detail:
          type: string
        impact:
          type: string
          enum: [high, medium, low]
        appliesTo:
          type: [string, "null"]
          description: Run label or scope this applies to, or null for shift-wide
        action:
          oneOf:
            - $ref: "#/components/schemas/OptimizeAction"
            - type: "null"
          description: Optional one-tap action, or null when nothing is safely applicable
        review:
          $ref: "#/components/schemas/ReviewVerdict"

    OptimizeResult:
      type: object
      required:
        - recommendations
        - generatedAt
      properties:
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/OptimizeRecommendation"
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when data is insufficient for analysis

    AskInput:
      type: object
      description: >-
        A free-form question about the day plus the full live day-state the
        answer must be grounded in. Reuses the OptimizeInput shape so both
        clients send identically-shaped data.
      required:
        - question
        - dayState
      properties:
        question:
          type: string
          description: The user's plain-language question about the day
        dayState:
          $ref: "#/components/schemas/OptimizeInput"

    AskResult:
      type: object
      required:
        - answer
        - turns
        - generatedAt
      properties:
        answer:
          type: string
          description: The grounded plain-language answer
        turns:
          type: array
          description: >-
            The asking user's recent conversation window (oldest first) after
            this exchange was recorded, so the client can render the thread from
            server truth.
          items:
            $ref: "#/components/schemas/ConversationTurn"
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when the question could not be answered from data

    CommandInput:
      type: object
      description: >-
        A single spoken utterance plus the full live day-state it must be
        interpreted against. Reuses the OptimizeInput shape so both clients send
        identically-shaped grounding data (the same data /ai/ask uses), letting
        the server resolve fuzzy run references to concrete run ids.
      required:
        - utterance
        - dayState
      properties:
        utterance:
          type: string
          description: The user's spoken phrase (a question or an action command)
        dayState:
          $ref: "#/components/schemas/OptimizeInput"

    RecipeAssistRow:
      type: object
      description: One ingredient line of a recipe (ingredient name + pounds).
      required:
        - ingredient
        - lbs
      properties:
        ingredient:
          type: string
        lbs:
          type: number
          description: Pounds of this ingredient in the recipe/batch

    RecipeAssistRecipe:
      type: object
      description: >-
        One of the current run's recipes the question may be about — a named set
        of ingredient rows tagged by kind (dough, sauce, cheese, other).
      required:
        - kind
        - name
        - rows
      properties:
        id:
          type: string
          description: >-
            Stable settings-field key identifying which recipe this is (e.g.
            doughRecipe, frontlineRecipe, app1CheeseRecipe). Lets an "apply"
            suggestion target this exact recipe deterministically.
        kind:
          type: string
          description: What the recipe is for (dough, sauce, cheese, other)
        name:
          type: string
          description: The recipe's name (may be empty if unnamed)
        rows:
          type: array
          items:
            $ref: "#/components/schemas/RecipeAssistRow"

    RecipeAssistContext:
      type: object
      description: >-
        Optional run numbers the model may use to ground scaling math so its
        answer is consistent with what the app computes.
      properties:
        brand:
          type: string
        flavor:
          type: string
        casesNeeded:
          type: number
        pizzasPerCase:
          type: number
        doughballWeightOz:
          type: number
          description: Target weight of one doughball in ounces

    RecipeAssistInput:
      type: object
      description: >-
        A plain-language recipe/ingredient question plus the real recipe rows,
        the known ingredient pool, and optional run context the answer must be
        grounded in. Both clients send identically-shaped data.
      required:
        - question
        - recipes
      properties:
        question:
          type: string
          description: The user's plain-language recipe/ingredient question
        recipes:
          type: array
          description: The current run's recipes (dough/sauce/cheese), may be empty
          items:
            $ref: "#/components/schemas/RecipeAssistRecipe"
        ingredientNames:
          type: array
          description: Known ingredient names, so substitutions stay within the app's pool
          items:
            type: string
        context:
          $ref: "#/components/schemas/RecipeAssistContext"

    RecipeAssistResult:
      type: object
      required:
        - answer
        - generatedAt
      properties:
        answer:
          type: string
          description: The grounded plain-language answer
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when the question could not be answered from data
        suggestion:
          $ref: "#/components/schemas/RecipeAssistSuggestion"

    RecipeAssistSuggestion:
      type: object
      description: >-
        An optional structured, confirm-first edit the worker can apply in one
        tap — the exact resulting ingredient rows of a scaled or substituted
        recipe. Present only for SCALE/SUBSTITUTE questions where the model could
        produce exact rows; absent for EXPLAIN questions or when it is unsure.
        Advisory: nothing is applied until the worker confirms.
      required:
        - kind
        - recipeId
        - rows
      properties:
        kind:
          type: string
          enum: [scale, substitute]
          description: Whether this resizes a recipe (scale) or swaps an ingredient (substitute)
        recipeId:
          type: string
          description: >-
            The id of the recipe to apply this to, copied from the matching
            RecipeAssistRecipe.id sent in the request.
        recipeName:
          type: string
          description: The target recipe's display name (for the confirmation UI)
        summary:
          type: string
          description: A short button/label describing the change (e.g. "Apply scaled dough 1.5x")
        rows:
          type: array
          description: The COMPLETE new set of ingredient rows for that recipe after the change
          items:
            $ref: "#/components/schemas/RecipeAssistRow"

    ProactiveAlert:
      type: object
      description: >-
        A single proactive, dismissible shift nudge. The key is a stable
        lowercase slug naming the KIND of nudge (e.g. "behind-plan",
        "break-window") so repeats of the same situation can be de-duped/cooled
        down client-side; it is never run-instance or timestamp specific.
      required:
        - key
        - category
        - title
        - detail
        - impact
      properties:
        key:
          type: string
          description: Stable de-dup slug for the kind of nudge
        category:
          type: string
          enum: [run, break, efficiency]
        title:
          type: string
          description: Short glanceable headline
        detail:
          type: string
          description: One or two plain-language sentences a manager can act on
        impact:
          type: string
          enum: [high, medium, low]

    ProactiveAlertResult:
      type: object
      required:
        - alert
        - generatedAt
      properties:
        alert:
          oneOf:
            - $ref: "#/components/schemas/ProactiveAlert"
            - type: "null"
          description: The single nudge to surface now, or null when nothing applies
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when no alert could be produced

    ForecastHistoryRun:
      type: object
      description: A finished run from a past day, used to learn demand patterns.
      required:
        - brand
        - flavor
        - dieType
        - cases
        - netRunMin
      properties:
        brand:
          type: string
        flavor:
          type: string
        dieType:
          type: string
          description: May be empty when unknown
        cases:
          type: number
          description: Cases actually produced for this run
        netRunMin:
          type: number
          description: Net run minutes (excludes downtime); a throughput signal

    ForecastHistoryDay:
      type: object
      description: One past production day with its finished runs.
      required:
        - date
        - runs
      properties:
        date:
          type: string
          description: ISO date (YYYY-MM-DD) of the production day
        runs:
          type: array
          items:
            $ref: "#/components/schemas/ForecastHistoryRun"

    ForecastInput:
      type: object
      required:
        - targetDate
        - nowMs
        - history
      properties:
        targetDate:
          type: string
          description: ISO date (YYYY-MM-DD) of the upcoming day to forecast
        nowMs:
          type: number
          description: Client clock in epoch ms (for relative reasoning)
        history:
          type: array
          description: Recent finished production days, most useful when several weeks deep
          items:
            $ref: "#/components/schemas/ForecastHistoryDay"
        scheduledRuns:
          type: array
          description: Runs already planned for future days (incl. any existing plan for the target day)
          items:
            $ref: "#/components/schemas/OptimizeScheduledRun"

    ForecastRun:
      type: object
      description: One suggested run in the predicted plan (advisory; not committed).
      required:
        - brand
        - flavor
        - dieType
        - casesNeeded
        - rationale
      properties:
        brand:
          type: string
        flavor:
          type: string
        dieType:
          type: string
          description: May be empty when the model is unsure
        casesNeeded:
          type: number
          description: Rough suggested case target
        rationale:
          type: string
          description: Short reason this run is suggested (grounded in history)

    ForecastPlan:
      type: object
      required:
        - targetDate
        - confidence
        - summary
        - runs
      properties:
        targetDate:
          type: string
        confidence:
          type: string
          enum: [high, medium, low]
          description: Honest confidence given how much history supports the prediction
        summary:
          type: string
          description: Plain-language rationale for the whole plan, incl. caveats
        runs:
          type: array
          description: Suggested runs in a sensible production sequence
          items:
            $ref: "#/components/schemas/ForecastRun"

    ForecastResult:
      type: object
      required:
        - forecast
        - generatedAt
      properties:
        forecast:
          oneOf:
            - $ref: "#/components/schemas/ForecastPlan"
            - type: "null"
          description: The predicted plan, or null when history is too thin to predict
        generatedAt:
          type: number
        note:
          type: string
          description: Explanation when no forecast could responsibly be produced

    ForecastAccuracyInput:
      type: object
      description: Actual finished production history to grade past forecasts against.
      required:
        - nowMs
        - history
      properties:
        nowMs:
          type: number
          description: Client clock in epoch ms (for relative reasoning)
        history:
          type: array
          description: Recent finished production days (the actual results to compare forecasts to)
          items:
            $ref: "#/components/schemas/ForecastHistoryDay"

    ForecastAccuracyProduct:
      type: object
      description: One product's predicted vs. actual cases for a reviewed day.
      required:
        - label
        - predictedCases
        - actualCases
        - status
      properties:
        label:
          type: string
          description: Product label (brand + flavor) as recorded/run
        predictedCases:
          type: number
          description: Cases the forecast predicted (0 if it was not predicted)
        actualCases:
          type: number
          description: Cases actually produced (0 if it did not run)
        status:
          type: string
          enum: [hit, over, under, missed, unexpected]
          description: >-
            hit = predicted ≈ actual; over/under = predicted more/fewer than ran;
            missed = predicted but did not run; unexpected = ran but not predicted

    ForecastAccuracyReview:
      type: object
      description: One past forecast graded against the day's actual finished runs.
      required:
        - date
        - confidence
        - predictedTotalCases
        - actualTotalCases
        - caseAccuracyPct
        - products
      properties:
        date:
          type: string
          description: ISO date (YYYY-MM-DD) the forecast was for
        confidence:
          type: string
          enum: [high, medium, low]
          description: Confidence the forecast was issued with
        predictedTotalCases:
          type: number
        actualTotalCases:
          type: number
        caseAccuracyPct:
          type: number
          description: 0–100 closeness of predicted total cases to actual total cases
        products:
          type: array
          items:
            $ref: "#/components/schemas/ForecastAccuracyProduct"

    ForecastAccuracyTrendProduct:
      type: object
      description: A product the forecast consistently mis-predicts across reviewed days.
      required:
        - label
        - daysOver
        - daysUnder
        - daysScored
      properties:
        label:
          type: string
          description: Product label (brand + flavor)
        daysOver:
          type: number
          description: Reviewed days this product was over-predicted
        daysUnder:
          type: number
          description: Reviewed days this product was under-predicted
        daysScored:
          type: number
          description: Reviewed days this product appeared in at all

    ForecastAccuracyTrend:
      type: object
      description: Cross-day calibration summary rolled up from the per-day reviews.
      required:
        - daysScored
        - averageCaseAccuracyPct
        - chronicOver
        - chronicUnder
      properties:
        daysScored:
          type: number
          description: Number of reviewed (forecast + finished) days included
        averageCaseAccuracyPct:
          type: number
          description: Mean case-accuracy across the reviewed days (0–100)
        chronicOver:
          type: array
          description: Products repeatedly over-predicted, most frequent first
          items:
            $ref: "#/components/schemas/ForecastAccuracyTrendProduct"
        chronicUnder:
          type: array
          description: Products repeatedly under-predicted, most frequent first
          items:
            $ref: "#/components/schemas/ForecastAccuracyTrendProduct"

    ForecastAccuracyResult:
      type: object
      required:
        - reviews
        - trend
        - generatedAt
      properties:
        reviews:
          type: array
          description: Per-date reviews, most recent first
          items:
            $ref: "#/components/schemas/ForecastAccuracyReview"
        trend:
          $ref: "#/components/schemas/ForecastAccuracyTrend"
        generatedAt:
          type: number
        note:
          type: string
          description: Explanation when there is nothing to review yet

    FillMissingField:
      type: object
      description: One still-blank run-setup field the model should suggest a value for.
      required:
        - key
        - label
        - category
        - kind
      properties:
        key:
          type: string
          description: Stable field key (matches the run-settings field name)
        label:
          type: string
          description: Human-readable field label
        category:
          type: string
          enum:
            [identity, line, packaging, sauce, applicator, pepperoni, dough]
        kind:
          type: string
          enum: [number, text, select]
        options:
          type: array
          description: Allowed values when kind is "select"
          items:
            type: string

    FillMissingContextItem:
      type: object
      description: A field already filled in, given to the model for grounding.
      required:
        - key
        - label
        - value
      properties:
        key:
          type: string
        label:
          type: string
        value:
          type: string

    FillMissingInput:
      type: object
      required:
        - brand
        - flavor
        - fields
      properties:
        brand:
          type: string
        flavor:
          type: string
        dieType:
          type: string
          description: Die/size of the run, if known
        context:
          type: array
          description: Fields already known, for grounding the suggestions
          items:
            $ref: "#/components/schemas/FillMissingContextItem"
        fields:
          type: array
          description: The blank fields needing a suggested value
          items:
            $ref: "#/components/schemas/FillMissingField"

    FillMissingSuggestion:
      type: object
      required:
        - key
        - value
        - rationale
      properties:
        key:
          type: string
          description: The field key this suggestion is for (echoes a requested key)
        value:
          type: string
          description: Suggested value, as a string (numbers/selects coerced client-side)
        rationale:
          type: string
          description: Short plain-language reason for the suggested value
        review:
          $ref: "#/components/schemas/ReviewVerdict"

    FillMissingResult:
      type: object
      required:
        - suggestions
        - generatedAt
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/FillMissingSuggestion"
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when no suggestions could be made

    MatchImportCandidateFlavor:
      type: object
      description: An imported flavor (under a resolved saved brand) needing a match.
      required:
        - brand
        - flavor
      properties:
        brand:
          type: string
          description: The saved brand this flavor belongs to (already resolved)
        flavor:
          type: string
          description: The imported flavor name that did not exactly match

    MatchImportInput:
      type: object
      required:
        - brands
        - brandFlavors
        - unmatchedBrands
        - unmatchedFlavors
      properties:
        brands:
          type: array
          description: All saved brand names (the allowed match targets for brands)
          items:
            type: string
        brandFlavors:
          type: object
          description: Saved flavors keyed by brand name (allowed flavor targets)
          additionalProperties:
            type: array
            items:
              type: string
        unmatchedBrands:
          type: array
          description: Imported brand names with no exact saved match
          items:
            type: string
        unmatchedFlavors:
          type: array
          description: Imported flavors (under a resolved brand) with no exact match
          items:
            $ref: "#/components/schemas/MatchImportCandidateFlavor"

    MatchImportBrandMatch:
      type: object
      required:
        - candidate
        - match
      properties:
        candidate:
          type: string
          description: The imported brand name (echoes an unmatchedBrands entry)
        match:
          type: string
          description: The saved brand it best matches (always one of brands)
        review:
          $ref: "#/components/schemas/ReviewVerdict"

    MatchImportFlavorMatch:
      type: object
      required:
        - brand
        - candidate
        - match
      properties:
        brand:
          type: string
          description: The saved brand the flavor belongs to
        candidate:
          type: string
          description: The imported flavor name (echoes an unmatchedFlavors entry)
        match:
          type: string
          description: The saved flavor it best matches (always within that brand)
        review:
          $ref: "#/components/schemas/ReviewVerdict"

    ImportAlias:
      type: object
      description: A learned mapping from a raw imported name to a saved canonical name.
      required:
        - type
        - externalName
        - canonicalName
      properties:
        type:
          type: string
          enum: [brand, flavor]
          description: Whether this alias maps a brand name or a flavor name
        externalName:
          type: string
          description: The raw imported name (matched case-insensitively)
        canonicalName:
          type: string
          description: The saved name the imported name resolves to
        brandContext:
          type: string
          nullable: true
          description: >-
            For flavor aliases, the canonical parent brand the flavor belongs to;
            null/omitted for brand aliases.

    ImportAliasList:
      type: object
      required:
        - aliases
      properties:
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/ImportAlias"

    SaveImportAliasesInput:
      type: object
      required:
        - aliases
      properties:
        aliases:
          type: array
          description: The batch of aliases to upsert (confirmed during an import)
          items:
            $ref: "#/components/schemas/ImportAlias"

    FillMissingValue:
      type: object
      description: A learned value a user confirmed for a blank run-setup field.
      required:
        - brand
        - flavor
        - fieldKey
        - value
      properties:
        brand:
          type: string
          description: The run's brand (matched case-insensitively)
        flavor:
          type: string
          description: The run's flavor (matched case-insensitively)
        fieldKey:
          type: string
          description: The run-setup field key this value is for
        value:
          type: string
          description: The confirmed value (a plain number string for number fields)

    FillMissingValueList:
      type: object
      required:
        - values
      properties:
        values:
          type: array
          items:
            $ref: "#/components/schemas/FillMissingValue"

    SaveFillMissingValuesInput:
      type: object
      required:
        - values
      properties:
        values:
          type: array
          description: The batch of learned values to upsert (confirmed by the user)
          items:
            $ref: "#/components/schemas/FillMissingValue"

    PhotoAlias:
      type: object
      description: A learned mapping from a vision-model guessed name to an inventory item key.
      required:
        - guessName
        - itemKey
      properties:
        guessName:
          type: string
          description: The raw name the vision model returned (matched case-insensitively)
        itemKey:
          type: string
          description: The inventory item key the guessed name resolves to

    PhotoAliasList:
      type: object
      required:
        - aliases
      properties:
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/PhotoAlias"

    SavePhotoAliasesInput:
      type: object
      required:
        - aliases
      properties:
        aliases:
          type: array
          description: The batch of photo aliases to upsert (confirmed during intake)
          items:
            $ref: "#/components/schemas/PhotoAlias"

    ReviewVerdict:
      type: object
      description: >-
        A reviewer-AI "second set of eyes" verdict for one suggestion. Advisory
        only — surfaced in the review UI, never blocks applying the suggestion.
        Absent when the reviewer was unavailable (fail-safe).
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok, warn, reject]
          description: ok = looks fine, warn = double-check, reject = likely wrong/unsafe
        reason:
          type: string
          description: Short reason for a warn/reject verdict

    AiCorrection:
      type: object
      description: >-
        A factory-wide confirmed name correction: read fromText as toText. Tagged
        by domain (ingredient, brand, flavor, die, item). Shared across every AI
        helper so a fix learned once is honored everywhere.
      required:
        - domain
        - fromText
        - toText
      properties:
        domain:
          type: string
          description: What kind of name this is (ingredient, brand, flavor, die, item)
        fromText:
          type: string
          description: The messy/wrong name that was corrected (matched case-insensitively)
        toText:
          type: string
          description: The canonical name it should be read as

    AiCorrectionList:
      type: object
      required:
        - corrections
      properties:
        corrections:
          type: array
          items:
            $ref: "#/components/schemas/AiCorrection"

    SaveAiCorrectionsInput:
      type: object
      required:
        - corrections
      properties:
        corrections:
          type: array
          description: The batch of confirmed corrections to upsert into the shared pool
          items:
            $ref: "#/components/schemas/AiCorrection"

    FacilityKnowledge:
      type: object
      description: >-
        A durable, plain-language operational fact in the shared facility-wide AI
        knowledge pool. Tagged by domain (a coarse topic such as downtime,
        throughput, incident, ingredient, general) with a stable key so
        re-recording the same observation updates it in place. Read by every AI
        feature, so a pattern learned once is known everywhere.
      required:
        - domain
        - key
        - fact
      properties:
        domain:
          type: string
          description: Coarse topic tag (e.g. downtime, throughput, incident, ingredient, general)
        key:
          type: string
          description: Stable identity within a domain (matched case-insensitively for upsert)
        fact:
          type: string
          description: The durable observation in plain language

    FacilityKnowledgeList:
      type: object
      required:
        - knowledge
      properties:
        knowledge:
          type: array
          items:
            $ref: "#/components/schemas/FacilityKnowledge"

    SaveFacilityKnowledgeInput:
      type: object
      required:
        - knowledge
      properties:
        knowledge:
          type: array
          description: The batch of facility-knowledge facts to upsert into the shared pool
          items:
            $ref: "#/components/schemas/FacilityKnowledge"

    ConversationTurn:
      type: object
      description: >-
        One turn in a user's AI conversation memory — a single message either
        from the user or the assistant.
      required:
        - role
        - text
      properties:
        role:
          type: string
          enum: [user, assistant]
          description: Who produced this turn
        text:
          type: string
          description: The message text

    ConversationHistory:
      type: object
      required:
        - turns
      properties:
        turns:
          type: array
          description: The user's recent conversation turns, oldest first
          items:
            $ref: "#/components/schemas/ConversationTurn"

    AppendConversationInput:
      type: object
      required:
        - turns
      properties:
        turns:
          type: array
          description: One or more turns to append to the current user's conversation memory
          items:
            $ref: "#/components/schemas/ConversationTurn"

    MergeAlias:
      type: object
      description: A learned mapping from a merged-away ingredient name to the kept name.
      required:
        - externalName
        - canonicalName
      properties:
        externalName:
          type: string
          description: The ingredient name that was merged away (matched case-insensitively)
        canonicalName:
          type: string
          description: The canonical name it was folded into

    MergeAliasList:
      type: object
      required:
        - aliases
      properties:
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/MergeAlias"

    SaveMergeAliasesInput:
      type: object
      required:
        - aliases
      properties:
        aliases:
          type: array
          description: The batch of merge aliases to upsert
          items:
            $ref: "#/components/schemas/MergeAlias"

    DeniedMerge:
      type: object
      description: >-
        An unordered pair of ingredient names the user told the app to never
        propose merging together (matched case-insensitively, either direction).
      required:
        - nameA
        - nameB
      properties:
        nameA:
          type: string
          description: One name of the denied pair
        nameB:
          type: string
          description: The other name of the denied pair

    DeniedMergeList:
      type: object
      required:
        - denied
      properties:
        denied:
          type: array
          items:
            $ref: "#/components/schemas/DeniedMerge"

    SaveDeniedMergesInput:
      type: object
      required:
        - pairs
      properties:
        pairs:
          type: array
          description: The batch of denied pairs to add or remove
          items:
            $ref: "#/components/schemas/DeniedMerge"

    ProductionRule:
      type: object
      description: >-
        A manager-defined factory-wide production rule. Flat shape: only the
        fields relevant to `type` are used. "flexible" rules warn; "strict" rules
        block starting a run.
      required:
        - id
        - name
        - type
        - enforcement
        - enabled
      properties:
        id:
          type: string
          description: Stable client-generated id
        name:
          type: string
          description: Human-readable rule name
        type:
          type: string
          enum: [required-field, numeric-range, sequence]
        enforcement:
          type: string
          enum: [flexible, strict]
        enabled:
          type: boolean
        field:
          type: string
          nullable: true
          description: Run field key (required-field, numeric-range)
        min:
          type: number
          nullable: true
          description: Inclusive lower bound (numeric-range)
        max:
          type: number
          nullable: true
          description: Inclusive upper bound (numeric-range)
        attribute:
          type: string
          nullable: true
          description: Run attribute key for the transition (sequence)
        before:
          type: string
          nullable: true
          description: Disallowed preceding attribute value (sequence)
        after:
          type: string
          nullable: true
          description: Disallowed following attribute value (sequence)
        bypass:
          type: array
          nullable: true
          description: >-
            Exceptions: when the current run matches any of these conditions the
            rule is waived entirely (no warning, no block). Applies to any type.
          items:
            $ref: "#/components/schemas/RuleBypassCondition"
        checklist:
          type: array
          nullable: true
          description: >-
            Exceptions: ordered step labels a manager attaches to a (strict)
            rule. When the rule is violated and not bypassed, the operator must
            acknowledge every step before Start unblocks for that run.
          items:
            type: string

    RuleBypassCondition:
      type: object
      description: >-
        A single bypass condition for a production rule. The rule is waived when
        the current run's `field` matches `value` (text fields case-insensitive,
        number fields by numeric equality).
      required:
        - field
        - value
      properties:
        field:
          type: string
          description: Run field key (from the shared RULE_FIELDS catalog)
        value:
          type: string
          description: Value under which the rule is waived

    ProductionRuleList:
      type: object
      required:
        - rules
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/ProductionRule"

    SaveProductionRulesInput:
      type: object
      required:
        - rules
      properties:
        rules:
          type: array
          description: The batch of rules to create or update (by id)
          items:
            $ref: "#/components/schemas/ProductionRule"

    DeleteProductionRulesInput:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          description: The ids of the rules to delete
          items:
            type: string

    SuggestMergesInput:
      type: object
      required:
        - names
      properties:
        names:
          type: array
          description: The full pool of mergeable ingredient/die names to cluster
          items:
            type: string
        aliases:
          type: array
          description: Learned merge aliases to ground the suggestions
          items:
            $ref: "#/components/schemas/MergeAlias"

    MergeSuggestion:
      type: object
      required:
        - target
        - sources
      properties:
        target:
          type: string
          description: The recommended canonical name to keep
        sources:
          type: array
          description: The duplicate names to merge into the target
          items:
            type: string
        reason:
          type: string
          description: Optional short rationale for the suggested grouping
        review:
          $ref: "#/components/schemas/ReviewVerdict"

    SuggestMergesResult:
      type: object
      required:
        - suggestions
        - generatedAt
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/MergeSuggestion"
        generatedAt:
          type: number
          description: Epoch ms when the suggestions were generated
        note:
          type: string
          description: Optional brief overall comment from the model

    SpecImportAlias:
      type: object
      description: A learned mapping from a raw spreadsheet label to a canonical app name.
      required:
        - kind
        - externalName
        - canonicalName
      properties:
        kind:
          type: string
          enum: [brand, flavor, appType, pepType, cheeseIngredient, doughIngredient, sauceIngredient]
          description: Which name-space the mapping lives in
        externalName:
          type: string
          description: The raw spreadsheet label (matched case-insensitively)
        canonicalName:
          type: string
          description: The saved canonical name the label resolves to
        context:
          type: string
          nullable: true
          description: >-
            Disambiguator within a kind (e.g. the canonical brand for a flavor
            alias); null/omitted otherwise.

    SpecImportAliasList:
      type: object
      required:
        - aliases
      properties:
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/SpecImportAlias"

    SaveSpecImportAliasesInput:
      type: object
      required:
        - aliases
      properties:
        aliases:
          type: array
          description: The batch of spec-import aliases to upsert
          items:
            $ref: "#/components/schemas/SpecImportAlias"

    ParseSpecSheetKnown:
      type: object
      description: The app's known canonical lists, supplied to ground the AI parse.
      properties:
        brands:
          type: array
          items:
            type: string
        flavorsByBrand:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        appTypes:
          type: array
          items:
            type: string
        pepTypes:
          type: array
          items:
            type: string
        cheeseIngredients:
          type: array
          items:
            type: string
        doughIngredients:
          type: array
          items:
            type: string
        sauceIngredients:
          type: array
          items:
            type: string
        dieTypes:
          type: array
          items:
            type: string

    ParseSpecSheetInput:
      type: object
      required:
        - workbookText
      properties:
        workbookText:
          type: string
          description: The flattened, bounded text of the uploaded workbook
        known:
          $ref: "#/components/schemas/ParseSpecSheetKnown"
        aliases:
          type: array
          description: Learned spec-import aliases to ground name mapping
          items:
            $ref: "#/components/schemas/SpecImportAlias"

    SpecImportApplicator:
      type: object
      required:
        - type
        - ozPerPizza
      properties:
        type:
          type: string
        ozPerPizza:
          type: number

    SpecImportPepperoni:
      type: object
      required:
        - type
        - sticks
        - ozPerPizza
      properties:
        type:
          type: string
        sticks:
          type: number
        ozPerPizza:
          type: number

    SpecImportProfile:
      type: object
      required:
        - brand
        - flavor
        - applicators
        - pepperonis
      properties:
        brand:
          type: string
        flavor:
          type: string
        dieType:
          type: string
        sauceOzPerPizza:
          type: number
        applicators:
          type: array
          items:
            $ref: "#/components/schemas/SpecImportApplicator"
        pepperonis:
          type: array
          items:
            $ref: "#/components/schemas/SpecImportPepperoni"
        review:
          $ref: "#/components/schemas/ReviewVerdict"

    SpecImportRecipeRow:
      type: object
      required:
        - ingredient
        - lbs
      properties:
        ingredient:
          type: string
        lbs:
          type: number

    SpecImportRecipe:
      type: object
      required:
        - kind
        - name
        - rows
      properties:
        kind:
          type: string
          enum: [dough, sauce, cheese]
        name:
          type: string
        brand:
          type: string
        flavor:
          type: string
        doughballOz:
          type: number
        app:
          type: number
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SpecImportRecipeRow"
        review:
          $ref: "#/components/schemas/ReviewVerdict"

    ParseSpecSheetResult:
      type: object
      required:
        - profiles
        - recipes
        - generatedAt
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/SpecImportProfile"
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/SpecImportRecipe"
        note:
          type: string
        generatedAt:
          type: number

    MatchImportResult:
      type: object
      required:
        - brandMatches
        - flavorMatches
        - generatedAt
      properties:
        brandMatches:
          type: array
          items:
            $ref: "#/components/schemas/MatchImportBrandMatch"
        flavorMatches:
          type: array
          items:
            $ref: "#/components/schemas/MatchImportFlavorMatch"
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when no matches could be made

    IncidentContext:
      type: object
      description: Captured details about a reported issue or a crash
      properties:
        description:
          type: string
          description: The user's own words describing what went wrong (user reports)
        errorMessage:
          type: string
          description: The uncaught error's message (crashes)
        errorStack:
          type: string
          description: The uncaught error's stack/component trace (crashes)
        userAgent:
          type: string
          description: Client user-agent / device string, when available

    ReportIncidentInput:
      type: object
      required:
        - source
        - screen
        - appPlatform
      properties:
        source:
          type: string
          enum: [user_report, auto_crash]
        screen:
          type: string
          description: Screen/route the user was on
          maxLength: 200
        appPlatform:
          type: string
          enum: [web, mobile]
        appVersion:
          type: string
          maxLength: 100
        description:
          type: string
          description: The user's description of the problem (user reports)
          maxLength: 4000
        errorMessage:
          type: string
          description: Uncaught error message (crashes)
          maxLength: 4000
        errorStack:
          type: string
          description: Uncaught error stack (crashes)
          maxLength: 8000
        userAgent:
          type: string
          maxLength: 500

    IncidentRecurrence:
      type: object
      description: >-
        "Seen before" signal computed at report time from past similar incidents
        in the shared facility-memory pool. Null on the incident/diagnosis when
        the problem has no precedent.
      required:
        - count
        - lastWorkaround
      properties:
        count:
          type: integer
          description: How many prior similar incidents were found
        lastWorkaround:
          type: [string, "null"]
          description: The recovery step that helped previously, if any

    IncidentDiagnosis:
      type: object
      required:
        - incidentId
        - diagnosis
        - workaround
        - recurrence
      properties:
        incidentId:
          type: string
        diagnosis:
          type: string
          description: Plain-language explanation of what likely went wrong
        workaround:
          type: string
          description: Suggested next step / workaround for the user
        recurrence:
          oneOf:
            - $ref: "#/components/schemas/IncidentRecurrence"
            - type: "null"
          description: Recurrence signal, or null when this problem has no precedent

    Incident:
      type: object
      required:
        - id
        - source
        - reporterId
        - reporterName
        - reporterRole
        - screen
        - appPlatform
        - appVersion
        - context
        - diagnosis
        - workaround
        - recurrence
        - status
        - createdAt
        - reviewedAt
        - resolvedAt
      properties:
        id:
          type: string
        source:
          type: string
          enum: [user_report, auto_crash]
        reporterId:
          type: [string, "null"]
        reporterName:
          type: [string, "null"]
        reporterRole:
          type: [string, "null"]
        screen:
          type: string
        appPlatform:
          type: string
        appVersion:
          type: [string, "null"]
        context:
          $ref: "#/components/schemas/IncidentContext"
        diagnosis:
          type: [string, "null"]
        workaround:
          type: [string, "null"]
        recurrence:
          oneOf:
            - $ref: "#/components/schemas/IncidentRecurrence"
            - type: "null"
          description: Recurrence signal, or null when this problem has no precedent
        status:
          type: string
          enum: [new, reviewed, resolved]
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, "null"]
          format: date-time
        resolvedAt:
          type: [string, "null"]
          format: date-time

    UnreviewedIncidentCount:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
