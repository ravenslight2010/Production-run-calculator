      operationId: markCycleCountCounted
      tags: [cycleCount]
      summary: Mark a cycle-count section counted
      description: >-
        Stamps the schedule's `lastCountedAt` to the current date, clearing it
        from the "Time to Count" due list until its cadence elapses again.
        Available to any signed-in user (floor staff perform the counts), unlike
        the manager-only schedule edits.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The id of the cycle-count schedule to stamp as counted
