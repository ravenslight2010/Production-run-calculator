      tags: [ingredients]
      summary: Soft-delete ingredients by id (manager only)
      description: >-
        Marks a batch of ingredients disabled by id (soft delete — the id may
        still be referenced by historical recipe rows, which keep resolving to
        its last known name). Manager role required.
