          application/json:
            schema:
              $ref: "#/components/schemas/SavePremixSheetInput"
      responses:
        "200":
          description: The full updated premix-sheet list after the save
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPremixSheetList"
        "400":
          description: Invalid input

  /premix-sheets/{id}:
    delete:
      operationId: deletePremixSheet
      tags: [premixImport]
      summary: Delete a saved premix sheet by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The full updated premix-sheet list after the delete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPremixSheetList"

  /import-aliases:
    get:
      operationId: listImportAliases
      tags: [importAliases]
      summary: List learned import aliases (brand/flavor name mappings)
      description: >-
        Returns every learned import alias — a saved mapping from a raw imported
        brand/flavor name to the saved (canonical) name a user previously
        confirmed it matches. Clients use these to auto-apply remembered matches
        in the Excel import dialog before falling back to AI/fuzzy matching.
        Available to any signed-in user (operators included).
      responses:
        "200":
          description: All learned aliases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAliasList"
    post:
      operationId: saveImportAliases
      tags: [importAliases]
      summary: Save learned import aliases (case-insensitive upsert)
      description: >-
        Persists a batch of brand/flavor name mappings confirmed by the user
        during an Excel import. Existing aliases (matched case-insensitively on
        type + externalName + brandContext) are updated; new ones are inserted.
        Available to any signed-in user (operators included).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveImportAliasesInput"
      responses:
        "200":
          description: The full updated alias list after the upsert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAliasList"
        "400":
          description: Invalid input

  /fill-missing-values:
    get:
      operationId: listFillMissingValues
      tags: [fillMissingValues]
      summary: List learned fill-missing values (per product + field)
      description: >-
        Returns every learned "fill in missing data" value — a value a user
        previously confirmed for a blank run-setup field, keyed by the run's
        product (brand + flavor) and the field. Clients use these to propose the
        remembered value as a top-priority source before falling back to
        profile/spec/default/AI. Available to any signed-in user.
      responses:
        "200":
          description: All learned values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillMissingValueList"
    post:
      operationId: saveFillMissingValues
      tags: [fillMissingValues]
      summary: Save learned fill-missing values (case-insensitive upsert)
      description: >-
        Persists a batch of confirmed field values, keyed case-insensitively on
        brand + flavor + fieldKey. Existing entries are updated; new ones are
        inserted. Available to any signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveFillMissingValuesInput"
      responses:
        "200":
          description: The full updated value list after the upsert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillMissingValueList"
        "400":
          description: Invalid input

  /ingredient-batch-weights:
    get:
      operationId: listIngredientBatchWeights
      tags: [ingredientBatchWeights]
      summary: List learned per-ingredient batch weights
      description: >-
        Returns every learned ingredient batch weight — the "Batch Weight
        (lbs)" a user previously entered for a plain ingredient (applicator
        topping, non-default pep type, or ready-made sauce barrel), keyed by
        ingredient name. Clients auto-fill the remembered weight when that
        ingredient is picked again, the same way mixes and cheese recipes carry
        their own batch weight. Available to any signed-in user.
      responses:
        "200":
          description: All learned batch weights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngredientBatchWeightList"
    post:
      operationId: saveIngredientBatchWeights
      tags: [ingredientBatchWeights]
      summary: Save learned ingredient batch weights (case-insensitive upsert)
      description: >-
        Persists a batch of entered batch weights, keyed case-insensitively on
        ingredient name. Existing entries are updated; new ones are inserted.
        Available to any signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveIngredientBatchWeightsInput"
      responses:
        "200":
          description: The full updated weight list after the upsert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngredientBatchWeightList"
        "400":
          description: Invalid input

  /photo-aliases:
    get:
      operationId: listPhotoAliases
      tags: [photoAliases]
      summary: List learned photo-intake aliases (guessName -> itemKey)
      description: >-
        Returns every learned photo-intake alias — a saved mapping from a vision
        model's guessed item name to the inventory item key a user confirmed it
        matches. Clients use these to auto-apply remembered matches when
        identifying inventory from a photo. Available to any signed-in user.
      responses:
        "200":
          description: All learned photo aliases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoAliasList"
    post:
      operationId: savePhotoAliases
      tags: [photoAliases]
      summary: Save learned photo-intake aliases (case-insensitive upsert)
      description: >-
        Persists a batch of guessName -> itemKey mappings confirmed by the user
        during photo intake. Existing entries (matched case-insensitively on
        guessName) are updated; new ones are inserted. Available to any signed-in
        user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePhotoAliasesInput"
      responses:
        "200":
          description: The full updated alias list after the upsert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoAliasList"
        "400":
          description: Invalid input

  /incidents:
    post:
      operationId: reportIncident
      tags: [incidents]
      summary: Report an issue or a crash and get an AI diagnosis
      description: >-
        Records an incident (a user-reported problem or an auto-captured crash)
        and returns a plain-language AI diagnosis plus a suggested workaround.
        Allowed for any signed-in user. The diagnosis is also stored on the
        incident for managers to review later. Rate-limited per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportIncidentInput"
      responses:
        "200":
          description: Incident recorded; diagnosis returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentDiagnosis"
        "400":
          description: Invalid input
        "429":
          description: Too many requests
    get:
      operationId: listIncidents
      tags: [incidents]
      summary: List incidents (manager only)
      description: >-
        Returns recorded incidents (newest first) for a manager to review,
        including the captured context and the AI diagnosis.
      responses:
        "200":
          description: Incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
        "403":
          description: Manager role required

  /incidents/unreviewed-count:
    get:
      operationId: getUnreviewedIncidentCount
      tags: [incidents]
      summary: Count of unreviewed incidents (manager only)
      description: >-
        Returns the number of incidents still marked new/unreviewed, used to
        drive the manager nav badge.
      responses:
        "200":
          description: Unreviewed incident count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreviewedIncidentCount"
        "403":
          description: Manager role required

  /incidents/{id}:
    get:
      operationId: getIncident
      tags: [incidents]
      summary: Get one incident (manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "403":
          description: Manager role required
        "404":
          description: No incident with that id

  /incidents/{id}/review:
    post:
      operationId: reviewIncident
      tags: [incidents]
      summary: Mark an incident reviewed (manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "403":
          description: Manager role required
        "404":
          description: No incident with that id

  /incidents/{id}/resolve:
    post:
      operationId: resolveIncident
      tags: [incidents]
      summary: Mark an incident resolved (manager only)
      description: >-
        Marks an incident resolved (its underlying problem is considered
        fixed/handled). "resolved" implies "reviewed".
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "403":
          description: Manager role required
        "404":
          description: No incident with that id

  /me:
    get:
      operationId: getMe
      tags: [roles]
      summary: Current signed-in user's identity and role
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /me/onboarding-seen:
    post:
      operationId: markOnboardingSeen
      tags: [roles]
      summary: Mark the first-login "Get Started" overview as seen
      description: >-
        Sets the current user's onboardingSeen flag so the "Get Started"
        overview never auto-opens again on any of their devices. Idempotent.
      responses:
        "200":
          description: Updated current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /me/tour-completed:
    post:
      operationId: markTourCompleted
      tags: [roles]
      summary: Mark the guided tour as completed
      description: >-
        Sets the current user's tourCompleted flag once they reach the guided
        tour's final step, so the app can tell a brand-new user from one who has
        already finished the tour. Idempotent.
      responses:
        "200":
          description: Updated current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /me/floor-mode:
    post:
      operationId: setFloorMode
      tags: [roles]
      summary: Set the current user's Floor Mode on/off preference
      description: >-
        Stores whether Floor Mode (the idle big-numbers monitor) is enabled for
        the current user, so the preference follows them across devices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFloorMode"
      responses:
        "200":
          description: Updated current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List all defined roles and their capabilities (manage-staff)
      responses:
        "200":
          description: Role catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleDefinition"
        "403":
          description: Missing capability
    post:
      operationId: createRole
      tags: [roles]
      summary: Create a new role (manage-staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRole"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDefinition"
        "400":
          description: Invalid input
        "403":
          description: Missing capability or attempt to grant a capability you lack
        "409":
          description: A role with that name already exists

  /roles/{name}:
    put:
      operationId: updateRole
      tags: [roles]
      summary: Update a role's capabilities (manage-staff)
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleCapabilitiesUpdate"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDefinition"
        "400":
          description: Invalid input
        "403":
          description: Missing capability or attempt to grant a capability you lack
        "404":
          description: Role not found
    delete:
      operationId: deleteRole
      tags: [roles]
      summary: Delete a role (manage-staff)
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Role deleted
        "400":
          description: Built-in role or role still assigned to users
        "403":
          description: Missing capability
        "404":
          description: Role not found

  /users:
    get:
      operationId: listStaff
      tags: [roles]
      summary: List staff members and their roles (manager only)
      responses:
        "200":
          description: Staff roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
        "403":
          description: Manager role required

  /users/{userId}/role:
    put:
      operationId: setStaffRole
      tags: [roles]
      summary: Change a staff member's role (manager only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffRoleUpdate"
      responses:
        "200":
          description: Updated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          description: Invalid input
        "403":
          description: Manager role required

  /users/{userId}/password:
    put:
      operationId: resetStaffPassword
      tags: [roles]
      summary: Reset a staff member's password (manager only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetStaffPassword"
      responses:
        "204":
          description: Password reset
        "400":
          description: Invalid input
        "403":
          description: Manager role required
        "404":
          description: User not found

  /users/{userId}:
    delete:
      operationId: deleteStaffMember
      tags: [roles]
      summary: Remove a staff member (manager only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Staff member removed
        "400":
          description: Cannot remove the last manager
        "403":
          description: Manager role required
        "404":
          description: User not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ProductionRun:
      type: object
      required:
        - id
        - label
        - casesNeeded
        - casesLeft
        - skidsCompleted
        - pizzasPerMin
        - totalTimeSec
        - batchesNeeded
        - inputs
        - createdAt
      properties:
        id:
          type: integer
        label:
          type: string
        casesNeeded:
          type: integer
        casesLeft:
          type: integer
        skidsCompleted:
          type: integer
        pizzasPerMin:
          type: string
        totalTimeSec:
          type: integer
        batchesNeeded:
          type: string
        inputs:
          type: object
          additionalProperties: true
        notes:
          type: string
        createdAt:
          type: string
          format: date-time

    ProductionRunInput:
      type: object
      required:
        - casesNeeded
        - casesLeft
        - skidsCompleted
        - pizzasPerMin
        - totalTimeSec
        - batchesNeeded
        - inputs
      properties:
        label:
          type: string
        casesNeeded:
          type: integer
        casesLeft:
          type: integer
        skidsCompleted:
          type: integer
        pizzasPerMin:
          type: string
        totalTimeSec:
          type: integer
        batchesNeeded:
          type: string
        inputs:
          type: object
          additionalProperties: true
        notes:
          type: string

    InventoryLocation:
      type: object
      required:
        - id
        - name
        - isOnsite
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        isOnsite:
          type: boolean
        createdAt:
          type: string
          format: date-time

    LocationStock:
      type: object
      required:
        - locationId
        - locationName
        - isOnsite
        - onHand
      properties:
        locationId:
          type: integer
        locationName:
          type: string
        isOnsite:
          type: boolean
        onHand:
          type: number

    InventoryLot:
      type: object
      required:
        - id
        - itemId
        - lotNumber
        - qtyReceived
        - qtyRemaining
        - createdAt
      properties:
        id:
          type: integer
        itemId:
          type: integer
        locationId:
          type: [integer, "null"]
        lotNumber:
          type: string
        qtyReceived:
          type: number
        qtyRemaining:
          type: number
        receivedDate:
          type: [string, "null"]
        expirationDate:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time

    InventoryItem:
      type: object
      required:
        - id
        - key
        - category
        - name
        - unit
        - reorderThreshold
        - onHand
        - lots
        - byLocation
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        key:
          type: string
        category:
          type: string
        name:
          type: string
        unit:
          type: string
        reorderThreshold:
          type: number
        onHand:
          type: number
        lots:
          type: array
          items:
            $ref: "#/components/schemas/InventoryLot"
        byLocation:
          type: array
          items:
            $ref: "#/components/schemas/LocationStock"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateInventoryItemInput:
      type: object
      required:
        - key
        - category
        - name
        - unit
      properties:
        key:
          type: string
        category:
          type: string
        name:
          type: string
        unit:
          type: string
        reorderThreshold:
          type: number

    UpdateInventoryItemInput:
      type: object
      properties:
        name:
          type: string
        reorderThreshold:
          type: number

    RestockInput:
      type: object
      required:
        - itemKey
        - category
        - name
        - unit
        - qty
      properties:
        itemKey:
          type: string
        category:
          type: string
        name:
          type: string
        unit:
          type: string
        qty:
          type: number
        lotNumber:
          type: string
        receivedDate:
          type: [string, "null"]
        expirationDate:
          type: [string, "null"]
        locationId:
          type: integer

    CreateInventoryLocationInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        isOnsite:
          type: boolean

    UpdateInventoryLocationInput:
      type: object
      properties:
        name:
          type: string
        isOnsite:
          type: boolean

    TransferInput:
      type: object
      required:
        - itemId
        - fromLocationId
        - toLocationId
        - qty
      properties:
        itemId:
          type: integer
        fromLocationId:
          type: integer
        toLocationId:
          type: integer
        qty:
          type: number

    AdjustInput:
      type: object
      required:
        - itemId
        - qtyDelta
      properties:
        itemId:
          type: integer
        qtyDelta:
          type: number
        note:
          type: string

    ConsumeLine:
      type: object
      required:
        - itemKey
        - qty
      properties:
        itemKey:
          type: string
        qty:
          type: number

    ConsumeInput:
      type: object
      required:
        - runId
        - lines
      properties:
        runId:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ConsumeLine"

    MergeInventoryItem:
      type: object
      required:
        - fromKey
        - toKey
        - toName
        - category
        - unit
      properties:
        fromKey:
          type: string
        toKey:
          type: string
        toName:
          type: string
        category:
          type: string
        unit:
          type: string

    MergeInventoryInput:
      type: object
      required:
        - merges
      properties:
        merges:
          type: array
          items:
            $ref: "#/components/schemas/MergeInventoryItem"

    MergeOutcome:
      type: object
      required:
        - fromKey
        - toKey
        - status
      properties:
        fromKey:
          type: string
        toKey:
          type: string
        status:
          type: string
          enum: [applied, skipped]
        reason:
          type: string
          enum: [blank-key, same-key, source-not-tracked, same-item]

    MergeInventoryResult:
      type: object
      required:
        - merged
        - results
      properties:
        merged:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/MergeOutcome"

    ConsumeResult:
      type: object
      required:
        - applied
      properties:
        applied:
          type: boolean
        consumed:
          type: integer

    InventoryLedgerEntry:
      type: object
      required:
        - id
        - itemId
        - type
        - qtyDelta
        - note
        - createdAt
      properties:
        id:
          type: integer
        itemId:
          type: integer
        lotId:
          type: [integer, "null"]
        type:
          type: string
        qtyDelta:
          type: number
        runId:
          type: [string, "null"]
        note:
          type: string
        createdAt:
          type: string
          format: date-time

    InventorySettings:
      type: object
      required:
        - expirySoonDays
      properties:
        expirySoonDays:
          type: integer

    UpdateInventorySettingsInput:
      type: object
      required:
        - expirySoonDays
      properties:
        expirySoonDays:
          type: integer

    ProactiveAlertSettings:
      type: object
      required:
        - enabled
        - pollSeconds
        - cooldownSeconds
      properties:
        enabled:
          type: boolean
        pollSeconds:
          type: integer
        cooldownSeconds:
          type: integer

    UpdateProactiveAlertSettingsInput:
      type: object
      required:
        - enabled
        - pollSeconds
        - cooldownSeconds
      properties:
        enabled:
          type: boolean
        pollSeconds:
          type: integer
        cooldownSeconds:
          type: integer

    PhotoCandidate:
      type: object
      description: >-
        Known inventory/production item passed to an AI prompt (vision match
        candidates, planned production items). Fields are length-bounded so a
        crafted request can't inflate the model prompt for cost/DoS purposes.
      required:
        - key
        - category
        - name
        - unit
      properties:
        key:
          type: string
          maxLength: 200
        category:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 200
        unit:
          type: string
          maxLength: 50

    IdentifyPhotoInput:
      type: object
      required:
        - imageBase64
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image data (no data URI prefix)
        mimeType:
          type: string
          description: Image MIME type, e.g. image/jpeg
        candidates:
          type: array
          description: Known inventory + production items to match against
          items:
            $ref: "#/components/schemas/PhotoCandidate"

    PhotoGuess:
      type: object
      required:
        - name
        - qty
        - unit
        - category
        - matchedKey
        - confidence
      properties:
        name:
          type: string
        qty:
          type: number
        unit:
          type: string
        category:
          type: string
          enum: [ingredient, packaging]
        matchedKey:
          type: [string, "null"]
          description: Stable key of a matched known item, or null for a new item
        confidence:
          type: number
          description: 0..1 model confidence in this identification

    IdentifyPhotoResult:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PhotoGuess"

    QualityCheckPhotoInput:
      type: object
      required:
        - imageBase64
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image data (no data URI prefix)
        mimeType:
          type: string
          description: Image MIME type, e.g. image/jpeg
        productType:
          type: string
          enum: [pizza, crust, other]
          description: What the photo is of, to focus the assessment
        notes:
          type: string
          description: >-
            Optional plain-language context the user wants considered (e.g. the
            product/run, expected size, or a specific concern).

    QualityIssue:
      type: object
      description: One specific quality concern the AI observed in the photo.
      required:
        - type
        - severity
        - detail
      properties:
        type:
          type: string
          description: Short category of the issue (e.g. size, topping coverage, appearance, burn)
        severity:
          type: string
          enum: [minor, major, critical]
        detail:
          type: string
          description: One plain-language sentence describing the issue

    QualityAssessment:
      type: object
      required:
        - summary
        - status
        - confidence
        - issues
      properties:
        summary:
          type: string
          description: One-or-two-sentence plain-language overall assessment
        status:
          type: string
          enum: [pass, warn, fail]
          description: Overall verdict — pass (looks good), warn (minor issues), fail (clear defects)
        confidence:
          type: number
          description: 0..1 model confidence in this assessment
        issues:
          type: array
          items:
            $ref: "#/components/schemas/QualityIssue"

    QualityCheckResult:
      type: object
      required:
        - assessment
        - generatedAt
      properties:
        assessment:
          $ref: "#/components/schemas/QualityAssessment"
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when the photo could not be assessed

    ProductionSheetPhotoInput:
      type: object
      required:
        - imageBase64
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image data (no data URI prefix)
        mimeType:
          type: string
          description: Image MIME type, e.g. image/jpeg
        notes:
          type: string
          description: >-
            Optional plain-language context the user wants considered (e.g. which
            line the sheet is for, or the date the sheet covers).

    ProductionSheetRow:
      type: object
      description: One run row the AI read off the production sheet.
      required:
        - brand
        - flavor
        - dieType
        - casesNeeded
        - date
        - confidence
      properties:
        brand:
          type: string
        flavor:
          type: string
        dieType:
          type: string
          description: Die size / crust spec as written on the sheet (may be blank)
        casesNeeded:
          type: number
          description: Cases to produce for this run (0 when not readable)
        date:
          type: [string, "null"]
          description: ISO date (YYYY-MM-DD) the sheet shows for this run, or null
        confidence:
          type: number
          description: 0..1 model confidence in this extracted row

    ProductionSheetPhotoResult:
      type: object
      required:
        - rows
        - generatedAt
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ProductionSheetRow"
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when the sheet could not be read

    LabelExpected:
      type: object
      description: >-
        The values the client expects the label/pallet to show. All optional —
        only the provided fields are compared.
      properties:
        brand:
          type: string
        flavor:
          type: string
        dieType:
          type: string
        date:
          type: string
        lotCode:
          type: string
        caseCount:
          type: number

    LabelFieldCheck:
      type: object
      description: One expected field compared against what the AI read on the label.
      required:
        - field
        - expected
        - observed
        - match
      properties:
        field:
          type: string
          description: Which field this is (brand, flavor, dieType, date, lotCode, caseCount)
        expected:
          type: [string, "null"]
          description: The expected value the client supplied, or null if none
        observed:
          type: [string, "null"]
          description: What the AI read on the label, or null if unreadable/absent
        match:
          type: string
          enum: [match, mismatch, unreadable]

    LabelVerifyInput:
      type: object
      required:
        - imageBase64
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image data (no data URI prefix)
        mimeType:
          type: string
          description: Image MIME type, e.g. image/jpeg
        expected:
          $ref: "#/components/schemas/LabelExpected"
        notes:
          type: string
          description: Optional plain-language context the user wants considered

    LabelVerifyResult:
      type: object
      required:
        - verdict
        - summary
        - confidence
        - fields
        - generatedAt
      properties:
        verdict:
          type: string
          enum: [pass, warn, fail]
          description: Overall verdict — pass (all match), warn (unreadable/uncertain), fail (mismatch)
        summary:
          type: string
          description: One-or-two-sentence plain-language overall result
        confidence:
          type: number
          description: 0..1 model confidence in this verification
        fields:
          type: array
          items:
            $ref: "#/components/schemas/LabelFieldCheck"
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when the label could not be read

    QualityCheckRecordInput:
      type: object
      description: >-
        A reviewed-and-confirmed quality check to persist into the manager
        history.
      required:
        - productType
        - status
        - confidence
        - summary
        - issues
      properties:
        productType:
          type: string
          enum: [pizza, crust, other]
        status:
          type: string
          enum: [pass, warn, fail]
        confidence:
          type: number
          description: 0..1 model confidence at check time
        summary:
          type: string
          description: Plain-language overall assessment
        issues:
          type: array
          items:
            $ref: "#/components/schemas/QualityIssue"
        notes:
          type: string
          description: Optional plain-language context the reviewer attached
        thumbnail:
          type: string
          description: >-
            Optional small base64 data URI of the analyzed photo; dropped
            server-side when too large.

    QualityCheckRecord:
      type: object
      description: A persisted quality check in the manager history.
      required:
        - id
        - productType
        - status
        - confidence
        - summary
        - issues
        - createdAt
      properties:
        id:
          type: integer
        productType:
          type: string
          enum: [pizza, crust, other]
        status:
          type: string
          enum: [pass, warn, fail]
        confidence:
          type: number
        summary:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/QualityIssue"
        notes:
          type: string
          nullable: true
        thumbnail:
          type: string
          nullable: true
        reviewerName:
          type: string
          nullable: true
        createdAt:
          type: string
          description: ISO-8601 timestamp the check was recorded

    WasteInsightInput:
      type: object
      description: >-
        Request for an expiry/waste insight. Inventory and expiry data are read
        server-side; the optional plannedItems give the AI the production context
        it needs to suggest which planned products to run first.
      properties:
        plannedItems:
          type: array
          description: >-
            Items the current/upcoming production plan would consume, so the AI
            can recommend which planned products to run first to use at-risk
            stock. Optional.
          items:
            $ref: "#/components/schemas/PhotoCandidate"

    WasteInsightItem:
      type: object
      description: An inventory item flagged as expired or expiring soon.
      required:
        - key
        - name
        - category
        - unit
        - status
        - qtyAtRisk
        - earliestExpiration
        - daysUntilExpiry
      properties:
        key:
          type: string
        name:
          type: string
        category:
          type: string
        unit:
          type: string
        status:
          type: string
          enum: [expired, soon]
        qtyAtRisk:
          type: number
          description: Quantity in flagged (expired or expiring-soon) lots
        earliestExpiration:
          type: [string, "null"]
          description: Earliest expiration date among the flagged lots (YYYY-MM-DD)
        daysUntilExpiry:
          type: [number, "null"]
          description: Days until the earliest flagged lot expires (negative if already expired)

    WasteInsightResult:
      type: object
      required:
        - flagged
        - suggestion
        - generatedAt
      properties:
        flagged:
          type: array
          items:
            $ref: "#/components/schemas/WasteInsightItem"
        suggestion:
          type: [string, "null"]
          description: Plain-language run-order suggestion, or null when nothing is at risk
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when no suggestion could be produced

    AuthCredentials:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 6
          maxLength: 200

    SignUpCredentials:
      allOf:
        - $ref: "#/components/schemas/AuthCredentials"
        - type: object
          required:
            - accessCode
          properties:
            accessCode:
              type: string
              minLength: 1
              maxLength: 200
              description: >-
                Facility access code configured server-side (STAFF_SIGNUP_CODE)
                and shared out of band with legitimate new staff.

    AuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/StaffMember"

    ChangePasswordCredentials:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 200
        newPassword:
          type: string
          minLength: 6
          maxLength: 200

    Capability:
      type: string
      enum:
        - manage-staff
        - manage-inventory
        - edit-production-rules
        - approve-password-resets
        - review-incidents
        - use-ai-tools
      description: >-
        A discrete permission. A role grants a set of capabilities, and a user
        holds the union of their role's capabilities.

    RoleDefinition:
      type: object
      required:
        - name
        - capabilities
        - builtin
      properties:
        name:
          type: string
          description: Unique role name (also its identifier).
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        builtin:
          type: boolean
          description: >-
            Whether this is a built-in role. The "manager" role is protected
            (cannot be deleted and must keep the manage-staff capability) and
            "operator" is the default no-capability role. Built-in roles cannot
            be deleted.

    SetFloorMode:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Whether Floor Mode should be enabled for this user.

    CreateRole:
      type: object
      required:
        - name
        - capabilities
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"

    RoleCapabilitiesUpdate:
      type: object
      required:
        - capabilities
      properties:
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: >-
            Optional new name for the role (rename). When present and different
            from the path name, the role is renamed and every staff assignment
            is moved to the new name. Built-in roles cannot be renamed.

    StaffMember:
      type: object
      required:
        - userId
        - role
        - capabilities
        - email
        - name
        - onboardingSeen
        - tourCompleted
        - floorModeEnabled
        - sandbox
        - sandboxCopiedAt
        - sandboxStale
      properties:
        userId:
          type: string
        role:
          type: string
          description: The name of the role assigned to this user.
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
          description: The capabilities granted by this user's role.
        email:
          type: [string, "null"]
        name:
          type: [string, "null"]
        onboardingSeen:
          type: boolean
          description: >-
            Whether the user has dismissed the first-login "Get Started"
            overview.
        tourCompleted:
          type: boolean
          description: >-
            Whether the user has finished the guided tour (reached its final
            step).
        floorModeEnabled:
          type: boolean
          description: >-
            Whether Floor Mode (the idle big-numbers monitor) is enabled for
            this user. Per-user so the preference follows them across devices.
        sandbox:
          type: boolean
          description: >-
            Whether this is the seeded sandbox account, which operates in the
            isolated "sandbox" data scope. Clients show a persistent sandbox
            banner and offer a "Reset sandbox" action when true.
        sandboxCopiedAt:
          type: [string, "null"]
          description: >-
            ISO timestamp of when the sandbox was last re-copied from live, or
            null when it has never been copied. Only meaningful for the sandbox
            account (null for everyone else); clients show it in the banner as
            "Sandbox copied from live at …".
        sandboxStale:
          type: boolean
          description: >-
            Whether the sandbox copy is stale and due for an automatic refresh
            from live. The client drives the re-copy (reusing the manual reset
            flow); the server owns the staleness cutoff so web and mobile stay
            in lockstep. Always false for non-sandbox accounts.

    StaffRoleUpdate:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          description: The name of the role to assign to the user.

    ResetStaffPassword:
      type: object
      required:
        - newPassword
      properties:
        newPassword:
          type: string
          minLength: 6
          maxLength: 200

    OkResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean

    UsernameAvailability:
      type: object
      required:
        - available
      properties:
        available:
          type: boolean
          description: True when no account already uses this username.

    ForgotPasswordRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64

    ResetPasswordRequest:
      type: object
      required:
        - username
        - code
        - newPassword
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        code:
          type: string
          minLength: 1
          maxLength: 64
        newPassword:
          type: string
          minLength: 6
          maxLength: 200

    PasswordResetRequest:
      type: object
      required:
        - id
        - userId
        - username
        - requestedAt
      properties:
        id:
          type: string
        userId:
          type: string
        username:
          type: string
        requestedAt:
          type: string
          format: date-time

    ApprovePasswordResetResult:
      type: object
      required:
        - username
        - code
        - expiresAt
      properties:
        username:
          type: string
        code:
          type: string
        expiresAt:
          type: string
          format: date-time

    OptimizeStoppage:
      type: object
      required:
        - reason
        - durationSec
        - open
      properties:
        reason:
          type: string
        durationSec:
          type: number
        open:
          type: boolean
          description: True if the stoppage is still in progress (no end time)

    OptimizeRun:
      type: object
      required:
        - id
        - label
        - brand
        - flavor
        - dieType
        - status
        - casesNeeded
        - casesMade
        - casesLeft
        - plannedPpm
        - actualPpm
        - minutesRemaining
        - netElapsedSec
        - downtimeSec
        - stoppages
      properties:
        id:
          type: string
        label:
          type: string
        brand:
          type: string
        flavor:
          type: string
        dieType:
          type: string
        status:
          type: string
          enum: [running, upcoming, finished]
        casesNeeded:
          type: number
        casesMade:
          type: number
        casesLeft:
          type: number
        plannedPpm:
          type: number
          description: Planned pizzas-per-minute from line config
        actualPpm:
          type: [number, "null"]
          description: Observed pizzas-per-minute, or null if not yet measurable
        minutesRemaining:
          type: [number, "null"]
        netElapsedSec:
          type: number
        downtimeSec:
          type: number
        stoppages:
          type: array
          items:
            $ref: "#/components/schemas/OptimizeStoppage"

    OptimizeScheduledRun:
      type: object
      required:
        - date
        - brand
        - flavor
        - dieType
        - casesNeeded
      properties:
        date:
          type: string
        brand:
          type: string
        flavor:
          type: string
        dieType:
          type: string
        casesNeeded:
          type: number

    OptimizeInput:
      type: object
      required:
        - date
        - nowMs
        - runs
      properties:
        date:
          type: string
        nowMs:
          type: number
          description: Client clock (ms epoch) so the model can reason about timing
        runToTime:
          type: string
          description: Target completion time of day (HH:MM), or empty if unset
        todayPpm:
          type: number
          description: Today's aggregate pizzas-per-minute so far
        benchmarkPpm:
          type: [number, "null"]
          description: Historical average pizzas-per-minute, or null if no history
        runs:
          type: array
          description: Today's runs (running, upcoming, and finished)
          items:
            $ref: "#/components/schemas/OptimizeRun"
        scheduledRuns:
          type: array
          description: Future planned runs
          items:
            $ref: "#/components/schemas/OptimizeScheduledRun"
        historyRuns:
          type: array
          description: Recent finished runs from prior days
          items:
            $ref: "#/components/schemas/OptimizeRun"
        reorderDemandByKey:
          type: object
          description: >-
            Client-resolved material demand from upcoming (today-or-later)
            scheduled runs, keyed by inventory item key. Brand/recipe profiles
            live client-side, so the server can't resolve scheduled-run demand
            itself; the client sends it so the proactive reorder nudge can
            project on-hand exactly like the warehouse "Reorder Now" card.
            Optional; omitted/empty means demand is not subtracted.
          additionalProperties:
            type: number

    OptimizeAction:
      type: object
      description: >-
        Optional one-tap action a manager can apply from a recommendation.
        Advisory until explicitly tapped; each kind maps to an existing client
        mutation. Run-targeted kinds reference today's run ids.
      required:
        - kind
        - label
      properties:
        kind:
          type: string
          enum: [set_target_time, set_run_target, reorder_run]
        label:
          type: string
          description: Short imperative button caption
        time:
          type: string
          description: "Target finish time HH:MM (set_target_time)"
        runId:
          type: string
          description: Target run id (set_run_target, reorder_run)
        casesNeeded:
          type: number
          description: New case target (set_run_target)
        beforeRunId:
          type: [string, "null"]
          description: >-
            reorder_run: move runId immediately before this run id, or null to
            move it last

    OptimizeRecommendation:
      type: object
      required:
        - category
        - title
        - detail
        - impact
        - appliesTo
      properties:
        category:
          type: string
          enum: [run, break, efficiency]
        title:
          type: string
        detail:
          type: string
        impact:
          type: string
          enum: [high, medium, low]
        appliesTo:
          type: [string, "null"]
          description: Run label or scope this applies to, or null for shift-wide
        action:
          oneOf:
            - $ref: "#/components/schemas/OptimizeAction"
            - type: "null"
          description: Optional one-tap action, or null when nothing is safely applicable
        review:
          $ref: "#/components/schemas/ReviewVerdict"

    OptimizeResult:
      type: object
      required:
        - recommendations
        - generatedAt
      properties:
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/OptimizeRecommendation"
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when data is insufficient for analysis

    AskInput:
      type: object
      description: >-
        A free-form question about the day plus the full live day-state the
        answer must be grounded in. Reuses the OptimizeInput shape so both
        clients send identically-shaped data.
      required:
        - question
        - dayState
      properties:
        question:
          type: string
          description: The user's plain-language question about the day
        dayState:
          $ref: "#/components/schemas/OptimizeInput"

    AskResult:
      type: object
      required:
        - answer
        - turns
        - generatedAt
      properties:
        answer:
          type: string
          description: The grounded plain-language answer
        turns:
          type: array
          description: >-
            The asking user's recent conversation window (oldest first) after
            this exchange was recorded, so the client can render the thread from
            server truth.
          items:
            $ref: "#/components/schemas/ConversationTurn"
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when the question could not be answered from data

    CommandInput:
      type: object
      description: >-
        A single spoken utterance plus the full live day-state it must be
        interpreted against. Reuses the OptimizeInput shape so both clients send
        identically-shaped grounding data (the same data /ai/ask uses), letting
        the server resolve fuzzy run references to concrete run ids.
      required:
        - utterance
        - dayState
      properties:
        utterance:
          type: string
          description: The user's spoken phrase (a question or an action command)
        dayState:
          $ref: "#/components/schemas/OptimizeInput"

    RecipeAssistRow:
      type: object
      description: One ingredient line of a recipe (ingredient name + pounds).
      required:
        - ingredient
        - lbs
      properties:
        ingredient:
          type: string
        lbs:
          type: number
          description: Pounds of this ingredient in the recipe/batch

    RecipeAssistRecipe:
      type: object
      description: >-
        One of the current run's recipes the question may be about — a named set
        of ingredient rows tagged by kind (dough, sauce, cheese, other).
      required:
        - kind
        - name
        - rows
      properties:
        id:
          type: string
          description: >-
            Stable settings-field key identifying which recipe this is (e.g.
            doughRecipe, frontlineRecipe, app1CheeseRecipe). Lets an "apply"
            suggestion target this exact recipe deterministically.
        kind:
          type: string
          description: What the recipe is for (dough, sauce, cheese, other)
        name:
          type: string
          description: The recipe's name (may be empty if unnamed)
        rows:
          type: array
          items:
            $ref: "#/components/schemas/RecipeAssistRow"

    RecipeAssistContext:
      type: object
      description: >-
        Optional run numbers the model may use to ground scaling math so its
        answer is consistent with what the app computes.
      properties:
        brand:
          type: string
        flavor:
          type: string
        casesNeeded:
          type: number
        pizzasPerCase:
          type: number
        doughballWeightOz:
          type: number
          description: Target weight of one doughball in ounces

    RecipeAssistInput:
      type: object
      description: >-
        A plain-language recipe/ingredient question plus the real recipe rows,
        the known ingredient pool, and optional run context the answer must be
        grounded in. Both clients send identically-shaped data.
      required:
        - question
        - recipes
      properties:
        question:
          type: string
          description: The user's plain-language recipe/ingredient question
        recipes:
          type: array
          description: The current run's recipes (dough/sauce/cheese), may be empty
          items:
            $ref: "#/components/schemas/RecipeAssistRecipe"
        ingredientNames:
          type: array
          description: Known ingredient names, so substitutions stay within the app's pool
          items:
            type: string
        context:
          $ref: "#/components/schemas/RecipeAssistContext"

    RecipeAssistResult:
      type: object
      required:
        - answer
        - generatedAt
      properties:
        answer:
          type: string
          description: The grounded plain-language answer
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when the question could not be answered from data
        suggestion:
          $ref: "#/components/schemas/RecipeAssistSuggestion"

    RecipeAssistSuggestion:
      type: object
      description: >-
        An optional structured, confirm-first edit the worker can apply in one
        tap — the exact resulting ingredient rows of a scaled or substituted
        recipe. Present only for SCALE/SUBSTITUTE questions where the model could
        produce exact rows; absent for EXPLAIN questions or when it is unsure.
        Advisory: nothing is applied until the worker confirms.
      required:
        - kind
        - recipeId
        - rows
      properties:
        kind:
          type: string
          enum: [scale, substitute]
          description: Whether this resizes a recipe (scale) or swaps an ingredient (substitute)
        recipeId:
          type: string
          description: >-
            The id of the recipe to apply this to, copied from the matching
            RecipeAssistRecipe.id sent in the request.
        recipeName:
          type: string
          description: The target recipe's display name (for the confirmation UI)
        summary:
          type: string
          description: A short button/label describing the change (e.g. "Apply scaled dough 1.5x")
        rows:
          type: array
          description: The COMPLETE new set of ingredient rows for that recipe after the change
          items:
            $ref: "#/components/schemas/RecipeAssistRow"

    SpecReconcileRow:
      type: object
      required:
        - ingredient
        - lbs
      properties:
        ingredient:
          type: string
        lbs:
          type: number

    SpecReconcileRecipe:
      type: object
      description: >-
        A single recipe (dough/sauce/cheese) reduced to the fields the reconcile
        diff needs. Extra fields are allowed so a saved spec sheet's richer
        recipe objects pass through unchanged.
      required:
        - kind
        - name
        - rows
      additionalProperties: true
      properties:
        kind:
          type: string
          enum: [dough, sauce, cheese]
        name:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SpecReconcileRow"

    SavedSpecSheetData:
      type: object
      description: The canonicalized ParsedSpecImport snapshot captured at import time.
      additionalProperties: true
      properties:
        profiles:
          type: array
          items:
            type: object
            additionalProperties: true
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/SpecReconcileRecipe"
        note:
          type: string

    SavedSpecSheet:
      type: object
      required:
        - id
        - label
        - createdAt
        - data
      properties:
        id:
          type: integer
        label:
          type: string
        sourceKey:
          type: string
          nullable: true
          description: >-
            Stable per-file identity (normalized uploaded filename). Retention keeps
            the two most recent snapshots per sourceKey. Null for legacy snapshots.
        createdAt:
          type: number
          description: Epoch milliseconds the snapshot was saved
        data:
          $ref: "#/components/schemas/SavedSpecSheetData"

    SavedSpecSheetList:
      type: object
      required:
        - specSheets
      properties:
        specSheets:
          type: array
          items:
            $ref: "#/components/schemas/SavedSpecSheet"

    SaveSpecSheetInput:
      type: object
      required:
        - label
        - data
      properties:
        label:
          type: string
        sourceKey:
          type: string
          description: >-
            Optional stable per-file identity (normalized uploaded filename) so
            retention keeps the two most recent versions of each distinct spec
            sheet. Omitted by older/mobile clients (they share a legacy bucket).
        data:
          $ref: "#/components/schemas/SavedSpecSheetData"

    SpecReconcileApplicator:
      type: object
      required:
        - type
        - ozPerPizza
      properties:
        type:
          type: string
        ozPerPizza:
          type: number

    SpecReconcilePepperoni:
      type: object
      required:
        - type
        - sticks
        - ozPerPizza
      properties:
        type:
          type: string
        sticks:
          type: number
        ozPerPizza:
          type: number

    SpecReconcileProfile:
      type: object
      description: >-
        A brand+flavor profile reduced to the run-setup spec fields the reconcile
        diff needs (die type, sauce oz/pizza, applicator and pepperoni slots).
        Extra fields are allowed so a richer profile object passes through.
      required:
        - brand
        - flavor
        - applicators
        - pepperonis
      additionalProperties: true
      properties:
        brand:
          type: string
        flavor:
          type: string
        dieType:
          type: string
        sauceOzPerPizza:
          type: number
        applicators:
          type: array
          items:
            $ref: "#/components/schemas/SpecReconcileApplicator"
        pepperonis:
          type: array
          items:
            $ref: "#/components/schemas/SpecReconcilePepperoni"

    SpecReconcileInput:
      type: object
      required:
        - specSheetId
        - currentRecipes
      properties:
        specSheetId:
          type: integer
          description: The id of the saved spec sheet to check against
        currentRecipes:
          type: array
          description: The app's current recipe library (dough/sauce/cheese)
          items:
            $ref: "#/components/schemas/SpecReconcileRecipe"
        currentProfiles:
          type: array
          description: >-
            The app's current brand+flavor profiles, so the diff can also compare
            profile spec fields (die/sauce/applicators/pepperonis). Optional for
            backward compatibility; when omitted, only recipes are compared.
          items:
            $ref: "#/components/schemas/SpecReconcileProfile"

    ReconcileDiscrepancy:
      type: object
      required:
        - kind
        - recipeName
        - type
        - message
      properties:
        kind:
          type: string
          enum: [dough, sauce, cheese]
        recipeName:
          type: string
        type:
          type: string
          enum: [missing-recipe, missing-ingredient, extra-ingredient, amount-mismatch]
        ingredient:
          type: string
        specLbs:
          type: number
        currentLbs:
          type: number
        message:
          type: string

    SpecReconcileResult:
      type: object
      required:
        - specSheetId
        - discrepancies
        - generatedAt
      properties:
        specSheetId:
          type: integer
        discrepancies:
          type: array
          items:
            $ref: "#/components/schemas/ReconcileDiscrepancy"
        summary:
          type: string
          description: Advisory plain-language summary; absent/empty when the AI is unavailable
        generatedAt:
          type: number

    MixComponentSpec:
      type: object
      required:
        - ingredient
        - perPizza
      properties:
        ingredient:
          type: string
        perPizza:
          type: number
          description: Pounds of this ingredient per pizza

    SavedMix:
      type: object
      description: >-
        A single manager-defined mix, as stored factory-wide. Extra fields are
        allowed so a snapshot round-trips unchanged.
      additionalProperties: true
      required:
        - id
        - name
        - brand
        - flavor
        - batchSize
        - daysEarly
        - amountAlreadyMade
        - components
        - enabled
      properties:
        id:
          type: string
        scope:
          type: string
        name:
          type: string
        brand:
          type: string
        flavor:
          type: string
        batchSize:
          type: number
        daysEarly:
          type: number
        notes:
          type: string
        amountAlreadyMade:
          type: number
        components:
          type: array
          items:
            $ref: "#/components/schemas/MixComponentSpec"
        enabled:
          type: boolean

    SavedPremixSheetData:
      type: array
      description: The Mix[] snapshot captured when a premix workbook was imported.
      items:
        $ref: "#/components/schemas/SavedMix"

    SavedPremixSheet:
      type: object
      required:
        - id
        - label
        - createdAt
        - data
      properties:
        id:
          type: integer
        label:
          type: string
        sourceKey:
          type: string
          nullable: true
          description: >-
            Stable per-file identity (normalized uploaded filename). Retention keeps
            the two most recent snapshots per sourceKey. Null for legacy snapshots.
        createdAt:
          type: number
          description: Epoch milliseconds the snapshot was saved
        data:
          $ref: "#/components/schemas/SavedPremixSheetData"

    SavedPremixSheetList:
      type: object
      required:
        - premixSheets
      properties:
        premixSheets:
          type: array
          items:
            $ref: "#/components/schemas/SavedPremixSheet"

    SavePremixSheetInput:
      type: object
      required:
        - label
        - data
      properties:
        label:
          type: string
        sourceKey:
          type: string
          description: >-
            Optional stable per-file identity (normalized uploaded filename) so
            retention keeps the two most recent versions of each distinct premix
            workbook. Omitted by older/mobile clients (they share a legacy bucket).
        data:
          $ref: "#/components/schemas/SavedPremixSheetData"

    MixDiscrepancyWire:
      type: object
      required:
        - source
        - type
        - brand
        - flavor
        - mixName
        - message
      properties:
        source:
          type: string
          enum: [premix, spec]
        type:
          type: string
          enum: [missing-mix, missing-component, extra-component, amount-mismatch]
        brand:
          type: string
        flavor:
          type: string
        mixName:
          type: string
        ingredient:
          type: string
        sheetPerPizza:
          type: number
        mixPerPizza:
          type: number
        message:
          type: string

    MixReconcileInput:
      type: object
      required:
        - discrepancies
      properties:
        label:
          type: string
          description: Optional label for what was compared (e.g. the sheet name)
        discrepancies:
          type: array
          description: The deterministic discrepancies computed client-side
          items:
            $ref: "#/components/schemas/MixDiscrepancyWire"

    MixReconcileResult:
      type: object
      required:
        - generatedAt
      properties:
        summary:
          type: string
          description: Advisory plain-language summary; absent/empty when the AI is unavailable
        generatedAt:
          type: number

    MixAssistMix:
      type: object
      required:
        - name
        - brand
        - flavor
        - components
      properties:
        name:
          type: string
        brand:
          type: string
        flavor:
          type: string
        batchSize:
          type: number
        daysEarly:
          type: number
        amountAlreadyMade:
          type: number
        enabled:
          type: boolean
        components:
          type: array
          items:
            $ref: "#/components/schemas/MixComponentSpec"

    MixAssistInput:
      type: object
      required:
        - question
        - mixes
      properties:
        question:
          type: string
        mixes:
          type: array
          items:
            $ref: "#/components/schemas/MixAssistMix"

    MixAssistResult:
      type: object
      required:
        - answer
        - generatedAt
      properties:
        answer:
          type: string
        generatedAt:
          type: number
        note:
          type: string

    ProactiveAlert:
      type: object
      description: >-
        A single proactive, dismissible shift nudge. The key is a stable
        lowercase slug naming the KIND of nudge (e.g. "behind-plan",
        "break-window") so repeats of the same situation can be de-duped/cooled
        down client-side; it is never run-instance or timestamp specific.
      required:
        - key
        - category
        - title
        - detail
        - impact
      properties:
        key:
          type: string
          description: Stable de-dup slug for the kind of nudge
        category:
          type: string
          enum: [run, break, efficiency]
        title:
          type: string
          description: Short glanceable headline
        detail:
          type: string
          description: One or two plain-language sentences a manager can act on
        impact:
          type: string
          enum: [high, medium, low]

    ProactiveAlertResult:
      type: object
      required:
        - alert
        - generatedAt
      properties:
        alert:
          oneOf:
            - $ref: "#/components/schemas/ProactiveAlert"
            - type: "null"
          description: The single nudge to surface now, or null when nothing applies
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when no alert could be produced

    ForecastHistoryRun:
      type: object
      description: A finished run from a past day, used to learn demand patterns.
      required:
        - brand
        - flavor
        - dieType
        - cases
        - netRunMin
      properties:
        brand:
          type: string
        flavor:
          type: string
        dieType:
          type: string
          description: May be empty when unknown
        cases:
          type: number
          description: Cases actually produced for this run
        netRunMin:
          type: number
          description: Net run minutes (excludes downtime); a throughput signal

    ForecastHistoryDay:
      type: object
      description: One past production day with its finished runs.
      required:
        - date
        - runs
      properties:
        date:
          type: string
          description: ISO date (YYYY-MM-DD) of the production day
        runs:
          type: array
          items:
            $ref: "#/components/schemas/ForecastHistoryRun"

    ForecastInput:
      type: object
      required:
        - targetDate
        - nowMs
        - history
      properties:
        targetDate:
          type: string
          description: ISO date (YYYY-MM-DD) of the first upcoming day to forecast
        horizonDays:
          type: integer
          minimum: 1
          maximum: 7
          description: >-
            How many consecutive days to forecast starting at targetDate
            (1-7, default 1). Each day gets its own plan grounded in that
            weekday's history.
        nowMs:
          type: number
          description: Client clock in epoch ms (for relative reasoning)
        history:
          type: array
          description: Recent finished production days, most useful when several weeks deep
          items:
            $ref: "#/components/schemas/ForecastHistoryDay"
        scheduledRuns:
          type: array
          description: Runs already planned for future days (incl. any existing plan for the target day)
          items:
            $ref: "#/components/schemas/OptimizeScheduledRun"

    ForecastRun:
      type: object
      description: One suggested run in the predicted plan (advisory; not committed).
      required:
        - brand
        - flavor
        - dieType
        - casesNeeded
        - rationale
      properties:
        brand:
          type: string
        flavor:
          type: string
        dieType:
          type: string
          description: May be empty when the model is unsure
        casesNeeded:
          type: number
          description: Rough suggested case target
        rationale:
          type: string
          description: Short reason this run is suggested (grounded in history)

    ForecastPlan:
      type: object
      required:
        - targetDate
        - confidence
        - summary
        - runs
      properties:
        targetDate:
          type: string
        confidence:
          type: string
          enum: [high, medium, low]
          description: Honest confidence given how much history supports the prediction
        summary:
          type: string
          description: Plain-language rationale for the whole plan, incl. caveats
        runs:
          type: array
          description: Suggested runs in a sensible production sequence
          items:
            $ref: "#/components/schemas/ForecastRun"

    ForecastResult:
      type: object
      required:
        - forecast
        - generatedAt
      properties:
        forecast:
          oneOf:
            - $ref: "#/components/schemas/ForecastPlan"
            - type: "null"
          description: >-
            The predicted plan for the first day (back-compat), or null when
            history is too thin to predict. Equals forecasts[0] when present.
        forecasts:
          type: array
          description: >-
            One predicted plan per requested day in the horizon, in date order.
            Present whenever at least one day could be forecast; single-element
            for a one-day horizon.
          items:
            $ref: "#/components/schemas/ForecastPlan"
        generatedAt:
          type: number
        note:
          type: string
          description: Explanation when no forecast could responsibly be produced

    SummaryRunInput:
      type: object
      description: One run as shaped by the client for the production summary.
      required:
        - brand
        - flavor
        - casesPlanned
        - casesProduced
        - finished
        - downtimeMinutes
        - stoppageCount
      properties:
        brand:
          type: string
        flavor:
          type: string
        casesPlanned:
          type: number
          description: Cases the run was planned to make (casesNeeded)
        casesProduced:
          type: number
          description: Cases actually produced/finished
        finished:
          type: boolean
          description: Whether the run was completed
        downtimeMinutes:
          type: number
          description: Total stoppage/downtime minutes on the run
        stoppageCount:
          type: number
          description: Number of discrete stoppages on the run

    SummaryInput:
      type: object
      required:
        - scope
        - date
        - nowMs
        - runs
      properties:
        scope:
          type: string
          enum: [day, week]
          description: Whether to recap a single day or a rolling week
        date:
          type: string
          description: ISO date for the day, or the week-ending date for a weekly recap
        nowMs:
          type: number
          description: Client clock in epoch ms
        runs:
          type: array
          description: Runs in scope (today's runs, or the week's finished runs)
          items:
            $ref: "#/components/schemas/SummaryRunInput"
        incidentCount:
          type: number
          description: Issues reported within the scope (optional context)
        wasteFlaggedCount:
          type: number
          description: Inventory items flagged at-risk / waste within the scope (optional)

    SummaryStats:
      type: object
      description: Deterministic aggregates the recap is built from (shown in the UI).
      required:
        - scope
        - date
        - runsPlanned
        - runsFinished
        - casesPlanned
        - casesProduced
        - attainmentPct
        - totalDowntimeMinutes
        - totalStoppages
        - unfinishedRuns
        - incidentCount
        - wasteFlaggedCount
        - hasData
      properties:
        scope:
          type: string
          enum: [day, week]
        date:
          type: string
        runsPlanned:
          type: number
        runsFinished:
          type: number
        casesPlanned:
          type: number
        casesProduced:
          type: number
        attainmentPct:
          type: number
        totalDowntimeMinutes:
          type: number
        totalStoppages:
          type: number
        topDowntime:
          oneOf:
            - type: object
              required: [label, minutes]
              properties:
                label:
                  type: string
                minutes:
                  type: number
            - type: "null"
          description: The single run with the most downtime, or null
        unfinishedRuns:
          type: array
          items:
            type: string
        incidentCount:
          type: number
        wasteFlaggedCount:
          type: number
        hasData:
          type: boolean

    SummaryResult:
      type: object
      required:
        - summary
        - stats
        - generatedAt
        - aiGenerated
      properties:
        summary:
          type: string
          description: Plain-language recap (AI narration, or deterministic fallback)
        stats:
          $ref: "#/components/schemas/SummaryStats"
        generatedAt:
          type: number
        aiGenerated:
          type: boolean
          description: True when the AI narrated; false when the deterministic fallback was used

    IncidentClustersInput:
      type: object
      description: >-
        No client-supplied data is required — the server reads the incident log
        itself. An optional lookbackDays trims how far back to cluster.
      properties:
        lookbackDays:
          type: number
          description: Only cluster incidents created within this many days (default 30)

    IncidentCluster:
      type: object
      required:
        - theme
        - rootCauseHypothesis
        - recommendedAction
        - severity
        - incidentIds
        - incidentCount
      properties:
        theme:
          type: string
          description: Short human-readable label for the grouped issue
        rootCauseHypothesis:
          type: string
          description: Plain-language guess at what these incidents share
        recommendedAction:
          type: string
          description: A safe, advisory next step (never an automated fix)
        severity:
          type: string
          enum: [low, medium, high]
        incidentIds:
          type: array
          items:
            type: string
          description: Verified ids of the incidents in this cluster
        incidentCount:
          type: number
          description: Recurrence-weighted occurrences across the cluster

    IncidentClustersResult:
      type: object
      required:
        - clusters
        - totalIncidents
        - generatedAt
        - aiGenerated
      properties:
        clusters:
          type: array
          items:
            $ref: "#/components/schemas/IncidentCluster"
        totalIncidents:
          type: number
          description: How many incidents were considered
        note:
          type: string
          description: Optional explanation (e.g. too few incidents to cluster)
        generatedAt:
          type: number
        aiGenerated:
          type: boolean
          description: True when the AI proposed the grouping; false for the deterministic fallback

    AnomalyRunInput:
      type: object
      description: One finished run, in the flat shape both apps produce for summaries.
      required:
        - brand
        - flavor
        - casesPlanned
        - casesProduced
        - downtimeMinutes
        - stoppageCount
      properties:
        brand:
          type: string
        flavor:
          type: string
        casesPlanned:
          type: number
        casesProduced:
          type: number
        downtimeMinutes:
          type: number
        stoppageCount:
          type: number

    AnomalyInput:
      type: object
      required:
        - today
        - history
      properties:
        today:
          type: array
          description: Today's finished runs to check
          items:
            $ref: "#/components/schemas/AnomalyRunInput"
        history:
          type: array
          description: Recent finished runs from prior days (baseline pool)
          items:
            $ref: "#/components/schemas/AnomalyRunInput"

    Anomaly:
      type: object
      required:
        - runLabel
        - brand
        - flavor
        - metric
        - observed
        - baseline
        - severity
        - baselineSamples
        - description
      properties:
        runLabel:
          type: string
        brand:
          type: string
        flavor:
          type: string
        metric:
          type: string
          enum: [downtime, yield, stoppages]
        observed:
          type: number
        baseline:
          type: number
        severity:
          type: string
          enum: [low, medium, high]
        baselineSamples:
          type: number
        description:
          type: string

    AnomalyResult:
      type: object
      required:
        - anomalies
        - checkedRuns
        - baselineRuns
        - summary
        - generatedAt
        - aiGenerated
      properties:
        anomalies:
          type: array
          items:
            $ref: "#/components/schemas/Anomaly"
        checkedRuns:
          type: number
        baselineRuns:
          type: number
        summary:
          type: string
          description: Plain-language narration (AI), or empty when nothing was flagged / AI unavailable
        note:
          type: string
          description: Optional explanation (e.g. not enough history to judge)
        generatedAt:
          type: number
        aiGenerated:
          type: boolean
          description: True when the AI narrated; false otherwise

    ScheduleOptimizeRunInput:
      type: object
      description: One run planned for the day, in the flat shape both apps produce.
      required:
        - id
        - label
        - brand
        - flavor
        - allergen
      properties:
        id:
          type: string
        label:
          type: string
          description: Human label for messaging, e.g. "Run 2 · Margherita"
        brand:
          type: string
        flavor:
          type: string
        allergen:
          type: string
          description: >-
            Food allergen for the run ("none" = no allergen). Free-form so
            allergens named on imported spec sheets beyond egg/soy (e.g. "milk")
            flow into allergen-sequence checks instead of being dropped to none.
        dieType:
          type: string
          description: Die/crust type; a change between adjacent runs is a changeover

    ScheduleOptimizeRuleInput:
      type: object
      description: A factory sequence production rule (only sequence-type rules affect ordering).
      required:
        - id
        - name
        - type
        - enforcement
        - enabled
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [required-field, numeric-range, sequence]
        enforcement:
          type: string
          enum: [flexible, strict]
        enabled:
          type: boolean
        attribute:
          type: string
        before:
          type: string
        after:
          type: string

    ScheduleOptimizeInput:
      type: object
      required:
        - runs
      properties:
        runs:
          type: array
          description: The runs planned for the day, in their current order
          items:
            $ref: "#/components/schemas/ScheduleOptimizeRunInput"
        rules:
          type: array
          description: Factory production rules (optional; only sequence rules apply)
          items:
            $ref: "#/components/schemas/ScheduleOptimizeRuleInput"

    ScheduleMetrics:
      type: object
      required:
        - allergenViolations
        - ruleViolations
        - changeovers
      properties:
        allergenViolations:
          type: number
        ruleViolations:
          type: number
        changeovers:
          type: number

    ScheduleOptimizeResponse:
      type: object
      required:
        - order
        - changed
        - improved
        - before
        - after
        - summary
        - generatedAt
        - aiGenerated
      properties:
        order:
          type: array
          description: Suggested run order (run ids), best-first
          items:
            type: string
        changed:
          type: boolean
          description: True when the suggested order differs from the input order
        improved:
          type: boolean
          description: True when the suggested order is strictly better than the input
        before:
          $ref: "#/components/schemas/ScheduleMetrics"
        after:
          $ref: "#/components/schemas/ScheduleMetrics"
        summary:
          type: string
          description: Plain-language narration (AI), or empty when no improvement / AI unavailable
        note:
          type: string
          description: Optional explanation (e.g. already optimally ordered)
        generatedAt:
          type: number
        aiGenerated:
          type: boolean
          description: True when the AI narrated; false otherwise

    ForecastAccuracyInput:
      type: object
      description: Actual finished production history to grade past forecasts against.
      required:
        - nowMs
        - history
      properties:
        nowMs:
          type: number
          description: Client clock in epoch ms (for relative reasoning)
        history:
          type: array
          description: Recent finished production days (the actual results to compare forecasts to)
          items:
            $ref: "#/components/schemas/ForecastHistoryDay"

    ForecastAccuracyProduct:
      type: object
      description: One product's predicted vs. actual cases for a reviewed day.
      required:
        - label
        - predictedCases
        - actualCases
        - status
      properties:
        label:
          type: string
          description: Product label (brand + flavor) as recorded/run
        predictedCases:
          type: number
          description: Cases the forecast predicted (0 if it was not predicted)
        actualCases:
          type: number
          description: Cases actually produced (0 if it did not run)
        status:
          type: string
          enum: [hit, over, under, missed, unexpected]
          description: >-
            hit = predicted ≈ actual; over/under = predicted more/fewer than ran;
            missed = predicted but did not run; unexpected = ran but not predicted

    ForecastAccuracyReview:
      type: object
      description: One past forecast graded against the day's actual finished runs.
      required:
        - date
        - confidence
        - predictedTotalCases
        - actualTotalCases
        - caseAccuracyPct
        - products
      properties:
        date:
          type: string
          description: ISO date (YYYY-MM-DD) the forecast was for
        confidence:
          type: string
          enum: [high, medium, low]
          description: Confidence the forecast was issued with
        predictedTotalCases:
          type: number
        actualTotalCases:
          type: number
        caseAccuracyPct:
          type: number
          description: 0–100 closeness of predicted total cases to actual total cases
        products:
          type: array
          items:
            $ref: "#/components/schemas/ForecastAccuracyProduct"

    ForecastAccuracyTrendProduct:
      type: object
      description: A product the forecast consistently mis-predicts across reviewed days.
      required:
        - label
        - daysOver
        - daysUnder
        - daysScored
      properties:
        label:
          type: string
          description: Product label (brand + flavor)
        daysOver:
          type: number
          description: Reviewed days this product was over-predicted
        daysUnder:
          type: number
          description: Reviewed days this product was under-predicted
        daysScored:
          type: number
          description: Reviewed days this product appeared in at all

    ForecastAccuracyTrend:
      type: object
      description: Cross-day calibration summary rolled up from the per-day reviews.
      required:
        - daysScored
        - averageCaseAccuracyPct
        - chronicOver
        - chronicUnder
      properties:
        daysScored:
          type: number
          description: Number of reviewed (forecast + finished) days included
        averageCaseAccuracyPct:
          type: number
          description: Mean case-accuracy across the reviewed days (0–100)
        chronicOver:
          type: array
          description: Products repeatedly over-predicted, most frequent first
          items:
            $ref: "#/components/schemas/ForecastAccuracyTrendProduct"
        chronicUnder:
          type: array
          description: Products repeatedly under-predicted, most frequent first
          items:
            $ref: "#/components/schemas/ForecastAccuracyTrendProduct"

    ForecastAccuracyResult:
      type: object
      required:
        - reviews
        - trend
        - generatedAt
      properties:
        reviews:
          type: array
          description: Per-date reviews, most recent first
          items:
            $ref: "#/components/schemas/ForecastAccuracyReview"
        trend:
          $ref: "#/components/schemas/ForecastAccuracyTrend"
        generatedAt:
          type: number
        note:
          type: string
          description: Explanation when there is nothing to review yet

    FillMissingField:
      type: object
      description: One still-blank run-setup field the model should suggest a value for.
      required:
        - key
        - label
        - category
        - kind
      properties:
        key:
          type: string
          description: Stable field key (matches the run-settings field name)
        label:
          type: string
          description: Human-readable field label
        category:
          type: string
          enum:
            [identity, line, packaging, sauce, applicator, pepperoni, dough]
        kind:
          type: string
          enum: [number, text, select]
        options:
          type: array
          description: Allowed values when kind is "select"
          items:
            type: string

    FillMissingContextItem:
      type: object
      description: A field already filled in, given to the model for grounding.
      required:
        - key
        - label
        - value
      properties:
        key:
          type: string
        label:
          type: string
        value:
          type: string

    FillMissingInput:
      type: object
      required:
        - brand
        - flavor
        - fields
      properties:
        brand:
          type: string
        flavor:
          type: string
        dieType:
          type: string
          description: Die/size of the run, if known
        context:
          type: array
          description: Fields already known, for grounding the suggestions
          items:
            $ref: "#/components/schemas/FillMissingContextItem"
        fields:
          type: array
          description: The blank fields needing a suggested value
          items:
            $ref: "#/components/schemas/FillMissingField"

    FillMissingSuggestion:
      type: object
      required:
        - key
        - value
        - rationale
      properties:
        key:
          type: string
          description: The field key this suggestion is for (echoes a requested key)
        value:
          type: string
          description: Suggested value, as a string (numbers/selects coerced client-side)
        rationale:
          type: string
          description: Short plain-language reason for the suggested value
        review:
          $ref: "#/components/schemas/ReviewVerdict"

    FillMissingResult:
      type: object
      required:
        - suggestions
        - generatedAt
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/FillMissingSuggestion"
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when no suggestions could be made

    MatchImportCandidateFlavor:
      type: object
      description: An imported flavor (under a resolved saved brand) needing a match.
      required:
        - brand
        - flavor
      properties:
        brand:
          type: string
          description: The saved brand this flavor belongs to (already resolved)
        flavor:
          type: string
          description: The imported flavor name that did not exactly match

    MatchImportCandidateIngredient:
      type: object
      description: An imported recipe ingredient name (scoped to a recipe kind) needing a match.
      required:
        - kind
        - name
      properties:
        kind:
          type: string
          enum: [dough, sauce, cheese]
          description: The recipe kind whose ingredient pool this name belongs to
        name:
          type: string
          description: The imported ingredient name that did not exactly match

    MatchImportInput:
      type: object
      required:
        - brands
        - brandFlavors
        - unmatchedBrands
        - unmatchedFlavors
      properties:
        brands:
          type: array
          description: All saved brand names (the allowed match targets for brands)
          items:
            type: string
        brandFlavors:
          type: object
          description: Saved flavors keyed by brand name (allowed flavor targets)
          additionalProperties:
            type: array
            items:
              type: string
        unmatchedBrands:
          type: array
          description: Imported brand names with no exact saved match
          items:
            type: string
        unmatchedFlavors:
          type: array
          description: Imported flavors (under a resolved brand) with no exact match
          items:
            $ref: "#/components/schemas/MatchImportCandidateFlavor"
        knownIngredients:
          type: object
          description: >-
            Saved recipe ingredient names keyed by recipe kind (dough/sauce/cheese);
            the allowed match targets for ingredient names. Optional.
          additionalProperties:
            type: array
            items:
              type: string
        knownAppTypes:
          type: array
          description: All saved applicator/topping type names (allowed targets). Optional.
          items:
            type: string
        knownPepTypes:
          type: array
          description: All saved pepperoni type names (allowed targets). Optional.
          items:
            type: string
        unmatchedIngredients:
          type: array
          description: Imported recipe ingredient names with no exact saved match. Optional.
          items:
            $ref: "#/components/schemas/MatchImportCandidateIngredient"
        unmatchedAppTypes:
          type: array
          description: Imported applicator/topping type names with no exact saved match. Optional.
          items:
            type: string
        unmatchedPepTypes:
          type: array
          description: Imported pepperoni type names with no exact saved match. Optional.
          items:
            type: string

    MatchImportBrandMatch:
      type: object
      required:
        - candidate
        - match
      properties:
        candidate:
          type: string
          description: The imported brand name (echoes an unmatchedBrands entry)
        match:
          type: string
          description: The saved brand it best matches (always one of brands)
        review:
          $ref: "#/components/schemas/ReviewVerdict"

    MatchImportFlavorMatch:
      type: object
      required:
        - brand
        - candidate
        - match
      properties:
        brand:
          type: string
          description: The saved brand the flavor belongs to
        candidate:
          type: string
          description: The imported flavor name (echoes an unmatchedFlavors entry)
        match:
          type: string
          description: The saved flavor it best matches (always within that brand)
        review:
          $ref: "#/components/schemas/ReviewVerdict"

    ImportAlias:
      type: object
      description: A learned mapping from a raw imported name to a saved canonical name.
      required:
        - type
        - externalName
        - canonicalName
      properties:
        type:
          type: string
          enum: [brand, flavor]
          description: Whether this alias maps a brand name or a flavor name
        externalName:
          type: string
          description: The raw imported name (matched case-insensitively)
        canonicalName:
          type: string
          description: The saved name the imported name resolves to
        brandContext:
          type: string
          nullable: true
          description: >-
            For flavor aliases, the canonical parent brand the flavor belongs to;
            null/omitted for brand aliases.

    ImportAliasList:
      type: object
      required:
        - aliases
      properties:
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/ImportAlias"

    SaveImportAliasesInput:
      type: object
      required:
        - aliases
      properties:
        aliases:
          type: array
          description: The batch of aliases to upsert (confirmed during an import)
          items:
            $ref: "#/components/schemas/ImportAlias"

    FillMissingValue:
      type: object
      description: A learned value a user confirmed for a blank run-setup field.
      required:
        - brand
        - flavor
        - fieldKey
        - value
      properties:
        brand:
          type: string
          description: The run's brand (matched case-insensitively)
        flavor:
          type: string
          description: The run's flavor (matched case-insensitively)
        fieldKey:
          type: string
          description: The run-setup field key this value is for
        value:
          type: string
          description: The confirmed value (a plain number string for number fields)

    FillMissingValueList:
      type: object
      required:
        - values
      properties:
        values:
          type: array
          items:
            $ref: "#/components/schemas/FillMissingValue"

    SaveFillMissingValuesInput:
      type: object
      required:
        - values
      properties:
        values:
          type: array
          description: The batch of learned values to upsert (confirmed by the user)
          items:
            $ref: "#/components/schemas/FillMissingValue"

    IngredientBatchWeight:
      type: object
      description: A learned batch weight a user entered for a plain ingredient.
      required:
        - name
        - lbs
      properties:
        name:
          type: string
          description: The ingredient name (matched case-insensitively)
        lbs:
          type: number
          description: The batch weight in lbs the user last entered

    IngredientBatchWeightList:
      type: object
      required:
        - weights
      properties:
        weights:
          type: array
          items:
            $ref: "#/components/schemas/IngredientBatchWeight"

    SaveIngredientBatchWeightsInput:
      type: object
      required:
        - weights
      properties:
        weights:
          type: array
          description: The batch of learned weights to upsert (entered by the user)
          items:
            $ref: "#/components/schemas/IngredientBatchWeight"

    PhotoAlias:
      type: object
      description: A learned mapping from a vision-model guessed name to an inventory item key.
      required:
        - guessName
        - itemKey
      properties:
        guessName:
          type: string
          description: The raw name the vision model returned (matched case-insensitively)
        itemKey:
          type: string
          description: The inventory item key the guessed name resolves to

    PhotoAliasList:
      type: object
      required:
        - aliases
      properties:
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/PhotoAlias"

    SavePhotoAliasesInput:
      type: object
      required:
        - aliases
      properties:
        aliases:
          type: array
          description: The batch of photo aliases to upsert (confirmed during intake)
          items:
            $ref: "#/components/schemas/PhotoAlias"

    ReviewVerdict:
      type: object
      description: >-
        A reviewer-AI "second set of eyes" verdict for one suggestion. Advisory
        only — surfaced in the review UI, never blocks applying the suggestion.
        Absent when the reviewer was unavailable (fail-safe).
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok, warn, reject]
          description: ok = looks fine, warn = double-check, reject = likely wrong/unsafe
        reason:
          type: string
          description: Short reason for a warn/reject verdict

    AiCorrection:
      type: object
      description: >-
        A factory-wide confirmed name correction: read fromText as toText. Tagged
        by domain (ingredient, brand, flavor, die, item). Shared across every AI
        helper so a fix learned once is honored everywhere.
      required:
        - domain
        - fromText
        - toText
      properties:
        domain:
          type: string
          description: What kind of name this is (ingredient, brand, flavor, die, item)
        fromText:
          type: string
          description: The messy/wrong name that was corrected (matched case-insensitively)
        toText:
          type: string
          description: The canonical name it should be read as

    AiCorrectionList:
      type: object
      required:
        - corrections
      properties:
        corrections:
          type: array
          items:
            $ref: "#/components/schemas/AiCorrection"

    SaveAiCorrectionsInput:
      type: object
      required:
        - corrections
      properties:
        corrections:
          type: array
          description: The batch of confirmed corrections to upsert into the shared pool
          items:
            $ref: "#/components/schemas/AiCorrection"

    FacilityKnowledge:
      type: object
      description: >-
        A durable, plain-language operational fact in the shared facility-wide AI
        knowledge pool. Tagged by domain (a coarse topic such as downtime,
        throughput, incident, ingredient, general) with a stable key so
        re-recording the same observation updates it in place. Read by every AI
        feature, so a pattern learned once is known everywhere.
      required:
        - domain
        - key
        - fact
      properties:
        domain:
          type: string
          description: Coarse topic tag (e.g. downtime, throughput, incident, ingredient, general)
        key:
          type: string
          description: Stable identity within a domain (matched case-insensitively for upsert)
        fact:
          type: string
          description: The durable observation in plain language

    FacilityKnowledgeList:
      type: object
      required:
        - knowledge
      properties:
        knowledge:
          type: array
          items:
            $ref: "#/components/schemas/FacilityKnowledge"

    SaveFacilityKnowledgeInput:
      type: object
      required:
        - knowledge
      properties:
        knowledge:
          type: array
          description: The batch of facility-knowledge facts to upsert into the shared pool
          items:
            $ref: "#/components/schemas/FacilityKnowledge"

    ConversationTurn:
      type: object
      description: >-
        One turn in a user's AI conversation memory — a single message either
        from the user or the assistant.
      required:
        - role
        - text
      properties:
        role:
          type: string
          enum: [user, assistant]
          description: Who produced this turn
        text:
          type: string
          description: The message text

    ConversationHistory:
      type: object
      required:
        - turns
      properties:
        turns:
          type: array
          description: The user's recent conversation turns, oldest first
          items:
            $ref: "#/components/schemas/ConversationTurn"

    AppendConversationInput:
      type: object
      required:
        - turns
      properties:
        turns:
          type: array
          description: One or more turns to append to the current user's conversation memory
          items:
            $ref: "#/components/schemas/ConversationTurn"

    MergeSuggestCategory:
      type: string
      description: >-
        Which merge tab a suggestion/alias/denial belongs to, so pools never
        leak across tabs. Defaults to "ingredient" for backward compatibility.
      enum: [ingredient, mixes, dough, sauce, cheese, brand, flavor]

    MergeAlias:
      type: object
      description: A learned mapping from a merged-away name to the kept name.
      required:
        - externalName
        - canonicalName
      properties:
        externalName:
          type: string
          description: The name that was merged away (matched case-insensitively)
        canonicalName:
          type: string
          description: The canonical name it was folded into

    MergeAliasList:
      type: object
      required:
        - aliases
      properties:
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/MergeAlias"

    SaveMergeAliasesInput:
      type: object
      required:
        - aliases
      properties:
        aliases:
          type: array
          description: The batch of merge aliases to upsert
          items:
            $ref: "#/components/schemas/MergeAlias"
        category:
          $ref: "#/components/schemas/MergeSuggestCategory"
        brand:
          type: string
          description: When category is "flavor", the single brand this batch is scoped to.

    DeniedMerge:
      type: object
      description: >-
        An unordered pair of names the user told the app to never propose
        merging together (matched case-insensitively, either direction).
      required:
        - nameA
        - nameB
      properties:
        nameA:
          type: string
          description: One name of the denied pair
        nameB:
          type: string
          description: The other name of the denied pair

    DeniedMergeList:
      type: object
      required:
        - denied
      properties:
        denied:
          type: array
          items:
            $ref: "#/components/schemas/DeniedMerge"

    SaveDeniedMergesInput:
      type: object
      required:
        - pairs
      properties:
        pairs:
          type: array
          description: The batch of denied pairs to add or remove
          items:
            $ref: "#/components/schemas/DeniedMerge"
        category:
          $ref: "#/components/schemas/MergeSuggestCategory"
        brand:
          type: string
          description: When category is "flavor", the single brand this batch is scoped to.

    MergedAwayList:
      type: object
      required:
        - names
      properties:
        names:
          type: array
          description: The factory-wide set of merged-away names
          items:
            type: string

    SaveMergedAwayInput:
      type: object
      required:
        - names
      properties:
        names:
          type: array
          description: The batch of merged-away names to add or remove
          items:
            type: string

    ProductionRule:
      type: object
      description: >-
        A manager-defined factory-wide production rule. Flat shape: only the
        fields relevant to `type` are used. "flexible" rules warn; "strict" rules
        block starting a run.
      required:
        - id
        - name
        - type
        - enforcement
        - enabled
      properties:
        id:
          type: string
          description: Stable client-generated id
        name:
          type: string
          description: Human-readable rule name
        type:
          type: string
          enum: [required-field, numeric-range, sequence]
        enforcement:
          type: string
          enum: [flexible, strict]
        enabled:
          type: boolean
        field:
          type: string
          nullable: true
          description: Run field key (required-field, numeric-range)
        min:
          type: number
          nullable: true
          description: Inclusive lower bound (numeric-range)
        max:
          type: number
          nullable: true
          description: Inclusive upper bound (numeric-range)
        attribute:
          type: string
          nullable: true
          description: Run attribute key for the transition (sequence)
        before:
          type: string
          nullable: true
          description: Disallowed preceding attribute value (sequence)
        after:
          type: string
          nullable: true
          description: Disallowed following attribute value (sequence)
        bypass:
          type: array
          nullable: true
          description: >-
            Exceptions: when the current run matches any of these conditions the
            rule is waived entirely (no warning, no block). Applies to any type.
          items:
            $ref: "#/components/schemas/RuleBypassCondition"
        checklist:
          type: array
          nullable: true
          description: >-
            Exceptions: ordered step labels a manager attaches to a (strict)
            rule. When the rule is violated and not bypassed, the operator must
            acknowledge every step before Start unblocks for that run.
          items:
            type: string

    RuleBypassCondition:
      type: object
      description: >-
        A single bypass condition for a production rule. The rule is waived when
        the current run's `field` matches `value` (text fields case-insensitive,
        number fields by numeric equality).
      required:
        - field
        - value
      properties:
        field:
          type: string
          description: Run field key (from the shared RULE_FIELDS catalog)
        value:
          type: string
          description: Value under which the rule is waived

    ProductionRuleList:
      type: object
      required:
        - rules
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/ProductionRule"

    SaveProductionRulesInput:
      type: object
      required:
        - rules
      properties:
        rules:
          type: array
          description: The batch of rules to create or update (by id)
          items:
            $ref: "#/components/schemas/ProductionRule"

    DeleteProductionRulesInput:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          description: The ids of the rules to delete
          items:
            type: string

    FreezerPullItem:
      type: object
      description: >-
        A manager-defined factory-wide freezer-pull item: an ingredient that
        must be pulled from the freezer `daysEarly` days before the run that
        uses it. Disabled items are kept but produce no warehouse notice.
      required:
        - id
        - ingredient
        - daysEarly
        - enabled
      properties:
        id:
          type: string
          description: Stable client-generated id
        ingredient:
          type: string
          description: Ingredient name, matched case-insensitively against run need rows
        daysEarly:
          type: integer
          description: Days before the run this item must be pulled (default 3)
        enabled:
          type: boolean

    FreezerPullItemList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FreezerPullItem"

    SaveFreezerPullItemsInput:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: The batch of freezer-pull items to create or update (by id)
          items:
            $ref: "#/components/schemas/FreezerPullItem"

    DeleteFreezerPullItemsInput:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          description: The ids of the freezer-pull items to delete
          items:
            type: string

    RunTemplate:
      type: object
      description: >-
        A facility-wide saved run-setup template. `values` holds the run
        configuration in the shared cross-platform wire shape and is opaque to
        the server (each app maps it to/from its own local form shape).
      required:
        - id
        - name
        - values
        - createdAt
      properties:
        id:
          type: string
          description: Stable client-generated id
        name:
          type: string
          description: Human-readable template name
        values:
          type: object
          additionalProperties: true
          description: Run configuration (cross-platform wire shape; opaque to the server)
        brand:
          type: string
        flavor:
          type: string
        createdAt:
          type: string
          description: ISO-8601 timestamp the template was created

    RunTemplateList:
      type: object
      required:
        - templates
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/RunTemplate"

    SaveRunTemplatesInput:
      type: object
      required:
        - templates
      properties:
        templates:
          type: array
          description: The batch of run templates to create or update (by id)
          items:
            $ref: "#/components/schemas/RunTemplate"

    DeleteRunTemplatesInput:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          description: The ids of the run templates to delete
          items:
            type: string

    SupervisorPin:
      type: object
      required:
        - pin
      properties:
        pin:
          type: string
          description: The facility supervisor PIN

    MixComponent:
      type: object
      description: >-
        One ingredient of a mix and how many pounds of it go into a single
        pizza's worth of the finished mix.
      required:
        - ingredient
        - perPizza
      properties:
        ingredient:
          type: string
          description: Ingredient name
        perPizza:
          type: number
          description: Pounds of this ingredient per pizza

    Mix:
      type: object
      description: >-
        A manager-defined factory-wide pre-blended mix (veggie/topping, cheese,
        sauce, …) made ahead for a given product. Matched against scheduled runs
        by brand + flavor (case-insensitive); component pounds scale by the run's
        pizza count. Disabled mixes are kept but produce no make-day plan entry.
      required:
        - id
        - name
        - brand
        - flavor
        - batchSize
        - daysEarly
        - amountAlreadyMade
        - components
        - enabled
      properties:
        id:
          type: string
          description: Stable client-generated id
        name:
          type: string
          description: Display name of the mix
        brand:
          type: string
          description: Product brand, matched case-insensitively against scheduled runs
        flavor:
          type: string
          description: Product flavor, matched case-insensitively against scheduled runs
        batchSize:
          type: number
          description: Pounds of finished mix per batch
        daysEarly:
          type: integer
          description: Days before the run this mix may be made ahead (default 0)
        notes:
          type: string
          description: Optional free-form notes
        amountAlreadyMade:
          type: number
          description: Pounds already made/on hand, subtracted from the total
        components:
          type: array
          description: The ingredients that make up the mix
          items:
            $ref: "#/components/schemas/MixComponent"
        enabled:
          type: boolean

    MixList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Mix"

    SaveMixesInput:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: The batch of mixes to create or update (by id)
          items:
            $ref: "#/components/schemas/Mix"

    DeleteMixesInput:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          description: The ids of the mixes to delete
          items:
            type: string

    IngredientCategory:
      type: string
      description: >-
        Which recipe surface(s) an ingredient applies to. "general" ingredients
        are also offered on every other category's picker.
      enum: [cheese, dough, frontline, mix, pep, general]

    Ingredient:
      type: object
      description: >-
        A factory-wide catalog entry (Task #102). Recipe rows reference an
        ingredient by id; renaming/merging/deleting is a server operation that
        updates every reference with no client-side rewrite.
      required:
        - id
        - name
        - categories
        - enabled
      properties:
        id:
          type: string
          description: Stable client-generated id
        name:
          type: string
          description: Current display name
        categories:
          type: array
          items:
            $ref: "#/components/schemas/IngredientCategory"
        mergedInto:
          type: string
          nullable: true
          description: >-
            When set, this ingredient was merged into another ingredient's id;
            resolve display name by following this pointer.
        enabled:
          type: boolean
          description: false = soft-deleted (kept so old rows still resolve)

    IngredientList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"

    SaveIngredientsInput:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: The batch of ingredients to create or rename (by id)
          items:
            $ref: "#/components/schemas/Ingredient"

    DeleteIngredientsInput:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          description: The ids of the ingredients to soft-delete
          items:
            type: string

    MergeIngredientsInput:
      type: object
      required:
        - sourceIds
        - targetId
      properties:
        sourceIds:
          type: array
          description: The ingredient ids to merge away
          items:
            type: string
        targetId:
          type: string
          description: The ingredient id the sources should merge into

    CheeseComponent:
      type: object
      description: >-
        One ingredient of a cheese recipe and how many pounds of it go into a
        single batch of the finished blend.
      required:
        - ingredient
        - lbs
      properties:
        ingredient:
          type: string
          description: Ingredient name
        lbs:
          type: number
          description: Pounds of this ingredient per batch

    CheeseRecipe:
      type: object
      description: >-
        A manager-defined factory-wide cheese recipe (a named cheese blend a
        customer uses on the line). Belongs to a customer (brand), carries the
        product flavors it is assigned to, the customer's cheese-shredder setting,
        an optional cellulose note, and a list of components — each an ingredient
        and its PER-BATCH pounds. The run applicator "Cheese" cards pick one and
        hydrate their rows from its components. Disabled recipes are kept but
        hidden from run pickers.
      required:
        - id
        - name
        - brand
        - flavors
        - shredderSetting
        - components
        - enabled
      properties:
        id:
          type: string
          description: Stable client-generated id
        name:
          type: string
          description: Display name of the cheese recipe
        brand:
          type: string
          description: Customer this recipe belongs to (empty = any)
        flavors:
          type: array
          description: >-
            Product flavors this recipe is assigned to (the per-flavor assignment
            lines). Empty = applies to any flavor / "All Varieties".
          items:
            type: string
        shredderSetting:
          type: string
          description: The customer's cheese-shredder setting as printed on the sheet
        cellulose:
          type: string
          description: Optional cellulose metadata from the sheet
        notes:
          type: string
          description: Optional free-form notes
        components:
          type: array
          description: The ingredients that make up one batch of the recipe
          items:
            $ref: "#/components/schemas/CheeseComponent"
        enabled:
          type: boolean

    CheeseRecipeList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CheeseRecipe"

    SaveCheeseRecipesInput:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: The batch of cheese recipes to create or update (by id)
          items:
            $ref: "#/components/schemas/CheeseRecipe"

    DeleteCheeseRecipesInput:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          description: The ids of the cheese recipes to delete
          items:
            type: string

    NamedRecipeComponent:
      type: object
      description: >-
        One ingredient of a named recipe (dough or sauce) and how many pounds of
        it the recipe uses.
      required:
        - ingredient
        - lbs
      properties:
        ingredient:
          type: string
          description: Ingredient name
        lbs:
          type: number
          description: Pounds of this ingredient

    NamedRecipe:
      type: object
      description: >-
        A manager-defined factory-wide named recipe used by the Dough and Sauce
        sections: a name plus a list of components — each an ingredient and its
        pounds. Unlike cheese/mixes there is no brand/flavor grouping. The run
        form's Dough / Sauce cards pick one and hydrate their rows from its
        components. Disabled recipes are kept but hidden from run pickers.
      required:
        - id
        - name
        - components
        - enabled
      properties:
        id:
          type: string
          description: Stable client-generated id
        name:
          type: string
          description: Display name of the recipe
        notes:
          type: string
          description: Optional free-form notes
        components:
          type: array
          description: The ingredients that make up the recipe
          items:
            $ref: "#/components/schemas/NamedRecipeComponent"
        enabled:
          type: boolean

    NamedRecipeList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NamedRecipe"

    SaveNamedRecipesInput:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: The batch of named recipes to create or update (by id)
          items:
            $ref: "#/components/schemas/NamedRecipe"

    DeleteNamedRecipesInput:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          description: The ids of the named recipes to delete
          items:
            type: string

    CycleCountSchedule:
      type: object
      description: >-
        A manager-defined factory-wide cycle-count schedule: a warehouse section
        that must be counted every `cadenceDays` days. `lastCountedAt` is the
        date it was last counted (null = never). Disabled schedules are kept but
        produce no reminder.
      required:
        - id
        - section
        - cadenceDays
        - lastCountedAt
        - enabled
      properties:
        id:
          type: string
          description: Stable client-generated id
        section:
          type: string
          description: The warehouse section/area to count
        cadenceDays:
          type: integer
          description: How many days may elapse between counts (default 7)
        lastCountedAt:
          type: string
          nullable: true
          description: Date last counted (YYYY-MM-DD), or null if never counted
        enabled:
          type: boolean

    CycleCountScheduleList:
      type: object
      required:
        - schedules
      properties:
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/CycleCountSchedule"

    SaveCycleCountSchedulesInput:
      type: object
      required:
        - schedules
      properties:
        schedules:
          type: array
          description: The batch of cycle-count schedules to create or update (by id)
          items:
            $ref: "#/components/schemas/CycleCountSchedule"

    DeleteCycleCountSchedulesInput:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          description: The ids of the cycle-count schedules to delete
          items:
            type: string

    MarkCycleCountCountedInput:
      type: object
      properties:
        today:
          type: string
          description: >-
            The client's local factory day (YYYY-MM-DD) to stamp as the
            last-counted date. Sent so the stamp matches the same local-day
            basis the clients use to compute the due list (avoiding timezone
            off-by-one drift). If omitted or malformed, the server falls back to
            its own current date.

    SuggestMergesInput:
      type: object
      required:
        - names
      properties:
        names:
          type: array
          description: The full pool of mergeable ingredient/die names to cluster
          items:
            type: string
        aliases:
          type: array
          description: Learned merge aliases to ground the suggestions
          items:
            $ref: "#/components/schemas/MergeAlias"
        category:
          $ref: "#/components/schemas/MergeSuggestCategory"
        brand:
          type: string
          description: >-
            When category is "flavor", the single brand `names` was scoped
            to — used only to tailor the AI prompt's wording.

    MergeSuggestion:
      type: object
      required:
        - target
        - sources
      properties:
        target:
          type: string
          description: The recommended canonical name to keep
        sources:
          type: array
          description: The duplicate names to merge into the target
          items:
            type: string
        reason:
          type: string
          description: Optional short rationale for the suggested grouping
        review:
          $ref: "#/components/schemas/ReviewVerdict"

    SuggestMergesResult:
      type: object
      required:
        - suggestions
        - generatedAt
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/MergeSuggestion"
        generatedAt:
          type: number
          description: Epoch ms when the suggestions were generated
        note:
          type: string
          description: Optional brief overall comment from the model

    SpecImportAlias:
      type: object
      description: A learned mapping from a raw spreadsheet label to a canonical app name.
      required:
        - kind
        - externalName
        - canonicalName
      properties:
        kind:
          type: string
          enum: [brand, flavor, appType, pepType, cheeseIngredient, doughIngredient, sauceIngredient]
          description: Which name-space the mapping lives in
        externalName:
          type: string
          description: The raw spreadsheet label (matched case-insensitively)
        canonicalName:
          type: string
          description: The saved canonical name the label resolves to
        context:
          type: string
          nullable: true
          description: >-
            Disambiguator within a kind (e.g. the canonical brand for a flavor
            alias); null/omitted otherwise.

    SpecImportAliasList:
      type: object
      required:
        - aliases
      properties:
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/SpecImportAlias"

    SaveSpecImportAliasesInput:
      type: object
      required:
        - aliases
      properties:
        aliases:
          type: array
          description: The batch of spec-import aliases to upsert
          items:
            $ref: "#/components/schemas/SpecImportAlias"

    ParseSpecSheetKnown:
      type: object
      description: The app's known canonical lists, supplied to ground the AI parse.
      properties:
        brands:
          type: array
          items:
            type: string
        flavorsByBrand:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        appTypes:
          type: array
          items:
            type: string
        pepTypes:
          type: array
          items:
            type: string
        cheeseIngredients:
          type: array
          items:
            type: string
        doughIngredients:
          type: array
          items:
            type: string
        sauceIngredients:
          type: array
          items:
            type: string
        sauceNames:
          type: array
          description: Existing sauce/frontline recipe names (incl. ready-made sauces) to ground profile sauceName
          items:
            type: string
        dieTypes:
          type: array
          items:
            type: string
        doughRecipes:
          type: array
          description: Existing dough recipe names (grounds paraphrased recipe names)
          items:
            type: string
        sauceRecipes:
          type: array
          description: Existing sauce recipe names (grounds paraphrased recipe names)
          items:
            type: string
        cheeseRecipes:
          type: array
          description: Existing cheese recipe names (grounds paraphrased recipe names)
          items:
            type: string

    ParseSpecSheetInput:
      type: object
      required:
        - workbookText
      properties:
        workbookText:
          type: string
          description: The flattened, bounded text of the uploaded workbook
        known:
          $ref: "#/components/schemas/ParseSpecSheetKnown"
        aliases:
          type: array
          description: Learned spec-import aliases to ground name mapping
          items:
            $ref: "#/components/schemas/SpecImportAlias"

    SpecImportApplicator:
      type: object
      required:
        - type
        - ozPerPizza
      properties:
        type:
          type: string
        ozPerPizza:
          type: number
        batchLbs:
          type: number
          description: >-
            Batch size in lbs one made batch of this topping weighs, when the
            sheet states it. Fallback only — a cheese/topping recipe for this
            slot derives the batch size from its row sum instead. Optional.

    SpecImportPepperoni:
      type: object
      required:
        - type
        - sticks
        - ozPerPizza
      properties:
        type:
          type: string
        sticks:
          type: number
        ozPerPizza:
          type: number
        batchLbs:
          type: number
          description: >-
            Batch size in lbs one made pepperoni batch weighs, when the sheet
            states it. Optional.

    SpecImportProfile:
      type: object
      required:
        - brand
        - flavor
        - applicators
        - pepperonis
      properties:
        brand:
          type: string
        flavor:
          type: string
        dieType:
          type: string
        sauceOzPerPizza:
          type: number
        sauceName:
          type: string
          description: >-
            Name of the sauce when the sheet names a specific one (e.g. BBQ,
            Ranch). Bought/ready-made sauces have no mixing recipe in the
            workbook; the name lets the app pull them as-is by name.
        pizzasPerCase:
          type: number
          description: >-
            Case pack: how many pizzas go in one case, when the sheet states it.
            Optional.
        sauceBarrelLbs:
          type: number
          description: >-
            Sauce barrel size in lbs one made barrel weighs, when the sheet
            states it. Fallback only — a mixed sauce recipe derives the barrel
            size from its row sum instead. Optional.
        applicators:
          type: array
          items:
            $ref: "#/components/schemas/SpecImportApplicator"
        pepperonis:
          type: array
          items:
            $ref: "#/components/schemas/SpecImportPepperoni"
        review:
          $ref: "#/components/schemas/ReviewVerdict"

    SpecImportRecipeRow:
      type: object
      required:
        - ingredient
        - lbs
      properties:
        ingredient:
          type: string
        lbs:
          type: number

    SpecImportRecipeTarget:
      type: object
      required:
        - brand
        - flavor
      properties:
        brand:
          type: string
        flavor:
          type: string

    SpecImportRecipe:
      type: object
      required:
        - kind
        - name
        - rows
      properties:
        kind:
          type: string
          enum: [dough, sauce, cheese]
        name:
          type: string
        brand:
          type: string
        flavor:
          type: string
        targets:
          type: array
          description: >-
            Brand+flavor profiles this one recipe applies to. Lets a single
            recipe tie to many profiles instead of being duplicated per
            brand/flavor. Unioned with the singular brand/flavor.
          items:
            $ref: "#/components/schemas/SpecImportRecipeTarget"
        doughballOz:
          type: number
        doughBatchYield:
          type: number
          description: >-
            Dough only: how many crusts one dough batch yields, when the sheet
            states it. Fallback only — the recipe rows + doughball weight derive
            the yield instead when both are present. Optional.
        app:
          type: number
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SpecImportRecipeRow"
        review:
          $ref: "#/components/schemas/ReviewVerdict"

    ParseSpecSheetResult:
      type: object
      required:
        - profiles
        - recipes
        - generatedAt
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/SpecImportProfile"
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/SpecImportRecipe"
        note:
          type: string
        warnings:
          type: array
          description: >-
            Flavor-grounding corrections/flags the server-side sanitizer made
            (e.g. an AI-paraphrased flavor snapped back to what the sheet says).
            Review UIs surface these prominently, attached to the affected
            profile row.
          items:
            $ref: "#/components/schemas/SpecImportWarning"
        generatedAt:
          type: number

    SpecImportWarning:
      type: object
      required:
        - brand
        - flavor
        - message
      properties:
        brand:
          type: string
          description: Brand of the profile the warning concerns
        flavor:
          type: string
          description: Final (post-correction) flavor of the profile the warning concerns
        message:
          type: string
          description: Human-readable explanation of the correction/flag

    MatchImportNameMatch:
      type: object
      required:
        - candidate
        - match
      properties:
        candidate:
          type: string
          description: The imported name (echoes an unmatched entry)
        match:
          type: string
          description: The saved name it best matches (always one of the known list)
        review:
          $ref: "#/components/schemas/ReviewVerdict"

    MatchImportIngredientMatch:
      type: object
      required:
        - kind
        - candidate
        - match
      properties:
        kind:
          type: string
          enum: [dough, sauce, cheese]
          description: The recipe kind whose ingredient pool the match belongs to
        candidate:
          type: string
          description: The imported ingredient name (echoes an unmatchedIngredients entry)
        match:
          type: string
          description: The saved ingredient it best matches (within that kind's pool)
        review:
          $ref: "#/components/schemas/ReviewVerdict"

    MatchImportResult:
      type: object
      required:
        - brandMatches
        - flavorMatches
        - generatedAt
      properties:
        brandMatches:
          type: array
          items:
            $ref: "#/components/schemas/MatchImportBrandMatch"
        flavorMatches:
          type: array
          items:
            $ref: "#/components/schemas/MatchImportFlavorMatch"
        ingredientMatches:
          type: array
          description: Confident matches for imported recipe ingredient names. Optional.
          items:
            $ref: "#/components/schemas/MatchImportIngredientMatch"
        appTypeMatches:
          type: array
          description: Confident matches for imported applicator/topping type names. Optional.
          items:
            $ref: "#/components/schemas/MatchImportNameMatch"
        pepTypeMatches:
          type: array
          description: Confident matches for imported pepperoni type names. Optional.
          items:
            $ref: "#/components/schemas/MatchImportNameMatch"
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when no matches could be made

    MatchPremixInput:
      type: object
      required:
        - brands
        - brandFlavors
        - unmatchedNames
      properties:
        brands:
          type: array
          description: All saved brand names (the allowed match targets for brands)
          items:
            type: string
        brandFlavors:
          type: object
          description: Saved flavors keyed by brand name (allowed flavor targets)
          additionalProperties:
            type: array
            items:
              type: string
        unmatchedNames:
          type: array
          description: Imported premix product names that did not ground locally
          items:
            type: string

    MatchPremixMatch:
      type: object
      required:
        - name
        - brand
        - flavor
      properties:
        name:
          type: string
          description: The imported premix name (echoes an unmatchedNames entry)
        brand:
          type: string
          description: The saved brand it best matches (always one of brands)
        flavor:
          type: string
          description: The saved flavor under that brand, or empty when none fits
        review:
          $ref: "#/components/schemas/ReviewVerdict"

    MatchPremixResult:
      type: object
      required:
        - matches
        - generatedAt
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/MatchPremixMatch"
        generatedAt:
          type: number
        note:
          type: string
          description: Optional message when no matches could be made

    IncidentContext:
      type: object
      description: Captured details about a reported issue or a crash
      properties:
        description:
          type: string
          description: The user's own words describing what went wrong (user reports)
        errorMessage:
          type: string
          description: The uncaught error's message (crashes)
        errorStack:
          type: string
          description: The uncaught error's stack/component trace (crashes)
        userAgent:
          type: string
          description: Client user-agent / device string, when available

    ReportIncidentInput:
      type: object
      required:
        - source
        - screen
        - appPlatform
      properties:
        source:
          type: string
          enum: [user_report, auto_crash]
        screen:
          type: string
          description: Screen/route the user was on
          maxLength: 200
        appPlatform:
          type: string
          enum: [web, mobile]
        appVersion:
          type: string
          maxLength: 100
        description:
          type: string
          description: The user's description of the problem (user reports)
          maxLength: 4000
        errorMessage:
          type: string
          description: Uncaught error message (crashes)
          maxLength: 4000
        errorStack:
          type: string
          description: Uncaught error stack (crashes)
          maxLength: 8000
        userAgent:
          type: string
          maxLength: 500

    IncidentRecurrence:
      type: object
      description: >-
        "Seen before" signal computed at report time from past similar incidents
        in the shared facility-memory pool. Null on the incident/diagnosis when
        the problem has no precedent.
      required:
        - count
        - lastWorkaround
      properties:
        count:
          type: integer
          description: How many prior similar incidents were found
        lastWorkaround:
          type: [string, "null"]
          description: The recovery step that helped previously, if any

    IncidentDiagnosis:
      type: object
      required:
        - incidentId
        - diagnosis
        - workaround
        - recurrence
      properties:
        incidentId:
          type: string
        diagnosis:
          type: string
          description: Plain-language explanation of what likely went wrong
        workaround:
          type: string
          description: Suggested next step / workaround for the user
        recurrence:
          oneOf:
            - $ref: "#/components/schemas/IncidentRecurrence"
            - type: "null"
          description: Recurrence signal, or null when this problem has no precedent

    Incident:
      type: object
      required:
        - id
        - source
        - reporterId
        - reporterName
        - reporterRole
        - screen
        - appPlatform
        - appVersion
        - context
        - diagnosis
        - workaround
        - recurrence
        - status
        - createdAt
        - reviewedAt
        - resolvedAt
      properties:
        id:
          type: string
        source:
          type: string
          enum: [user_report, auto_crash]
        reporterId:
          type: [string, "null"]
        reporterName:
          type: [string, "null"]
        reporterRole:
          type: [string, "null"]
        screen:
          type: string
        appPlatform:
          type: string
        appVersion:
          type: [string, "null"]
        context:
          $ref: "#/components/schemas/IncidentContext"
        diagnosis:
          type: [string, "null"]
        workaround:
          type: [string, "null"]
        recurrence:
          oneOf:
            - $ref: "#/components/schemas/IncidentRecurrence"
            - type: "null"
          description: Recurrence signal, or null when this problem has no precedent
        status:
          type: string
          enum: [new, reviewed, resolved]
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, "null"]
          format: date-time
        resolvedAt:
          type: [string, "null"]
          format: date-time

    UnreviewedIncidentCount:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
