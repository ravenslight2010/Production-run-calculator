openapi: 3.1.0
info:
  title: V2 Run Control API
  version: 0.1.0
  description: >
    Facility-scoped run control. The host must authenticate staff, enforce
    permissions, and validate same-origin/CSRF protection before mutations.
servers:
  - url: /
security:
  - v2Session: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Check API and V2 database availability
      security: []
      responses:
        "200":
          description: API can query its configured V2 database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/auth/sign-in:
    post:
      operationId: signIn
      summary: Sign in with a V2 staff account
      description: >
        Creates a fresh V2-only session. The server sets an HttpOnly session
        cookie and a separate readable CSRF cookie; credentials and tokens are
        never returned in the response body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSignIn"
      responses:
        "200":
          description: Sign-in accepted; session and CSRF cookies are set
          headers:
            Set-Cookie:
              description: Separate v2_session and v2_csrf cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/auth/session:
    get:
      operationId: getSession
      summary: Read the current V2 staff session
      responses:
        "200":
          description: Public staff identity and session expiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/auth/bootstrap-status:
    get:
      operationId: getFirstManagerSetupStatus
      summary: Check whether guarded V2 setup is available
      description: >
        Setup is available only while a V2 bootstrap secret is configured, no
        staff account exists, and the durable one-time bootstrap marker is
        unset. The response never contains the secret or any account credential.
      security: []
      responses:
        "200":
          description: One-time first-manager setup status
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/auth/bootstrap:
    post:
      operationId: bootstrapFirstManager
      summary: Create the first V2 manager once
      description: >
        Requires the server-configured one-time V2 bootstrap code and an empty
        V2 staff-account table. The server sets session and CSRF cookies;
        passwords, bootstrap codes, and session tokens are not returned in the
        response body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirstManagerBootstrap"
      responses:
        "201":
          description: First manager created and signed in
          headers:
            Set-Cookie:
              description: Separate V2 session and CSRF cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/auth/sign-out:
    post:
      operationId: signOut
      summary: Revoke the current V2 staff session
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked or already absent; V2 auth cookies cleared
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/auth/staff:
    get:
      operationId: listStaffAccounts
      summary: List V2 staff accounts and assignable roles
      responses:
        "200":
          description: Bounded staff directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDirectory"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
    post:
      operationId: createStaffAccount
      summary: Create a V2 staff account
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffAccountCreate"
      responses:
        "201":
          description: Staff account created; no credential is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDirectory"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/auth/staff/{staffId}:
    patch:
      operationId: updateStaffAccount
      summary: Disable a staff account or change its role
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - name: staffId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffAccountUpdate"
      responses:
        "200":
          description: Staff account updated; affected sessions are revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDirectory"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/runs:
    get:
      operationId: listRuns
      summary: List runs for the authenticated facility
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Facility-scoped run list
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
    post:
      operationId: createRun
      summary: Create a planned run
      security:
        - v2Session: []
          v2CsrfCookie: []
      description: >
        requestId is an idempotency key. Repeating the same request returns the
        original run; reusing the key for different details returns 409.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, setupSnapshot]
              properties:
                requestId:
                  type: string
                  format: uuid
                setupSnapshot:
                  $ref: "#/components/schemas/RunSetup"
      responses:
        "201":
          description: New planned run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreated"
        "200":
          description: Previously created run confirmed by idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreated"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/runs/{runId}:
    get:
      operationId: getRun
      summary: Read one run from the authenticated facility
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Canonical run state
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run:
                    $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/runs/{runId}/commands:
    post:
      operationId: applyRunCommand
      summary: Apply a revision-guarded run lifecycle command
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [commandId, commandType, expectedRevision]
              properties:
                commandId:
                  type: string
                  minLength: 1
                  maxLength: 200
                commandType:
                  type: string
                  enum: [start, pause, resume, complete]
                expectedRevision:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
      responses:
        "200":
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCommandAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Stale revision or invalid transition; includes canonical state
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RunConflict"
                  - $ref: "#/components/schemas/InvalidTransition"
        "500":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/runs/{runId}/stations/{stationKey}/commands:
    post:
      operationId: applyRunStationCommand
      summary: Save or advance canonical production-station state
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/CsrfToken"
        - in: path
          name: stationKey
          required: true
          schema:
            type: string
            enum: [line, dough, cheese, pepperoni, sauce, frontline, packaging]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StationCommand"
      responses:
        "200":
          description: Station edit or automatic/timer action accepted; response includes canonical run state
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StationCommandAccepted"
                  - $ref: "#/components/schemas/StationCommandNoChange"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Stale run revision or invalid timer/production transition; includes current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationCommandConflict"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    v2Session:
      type: apiKey
      in: cookie
      name: v2_session
    v2CsrfCookie:
      type: apiKey
      in: cookie
      name: v2_csrf
  parameters:
    RunId:
      in: path
      name: runId
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          const: ok
    AuthSignIn:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
        password:
          type: string
          minLength: 1
          maxLength: 128
    FirstManagerBootstrap:
      type: object
      additionalProperties: false
      required: [bootstrapCode, username, password]
      properties:
        bootstrapCode:
          type: string
          minLength: 32
          maxLength: 256
        username:
          type: string
          minLength: 3
          maxLength: 40
        password:
          type: string
          minLength: 6
          maxLength: 128
    StaffAccountCreate:
      type: object
      additionalProperties: false
      required: [username, password, roleName]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
        password:
          type: string
          minLength: 6
          maxLength: 128
        roleName:
          type: string
          minLength: 1
          maxLength: 80
    StaffAccountUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        disabled:
          type: boolean
        roleName:
          type: string
          minLength: 1
          maxLength: 80
    StaffDirectory:
      type: object
      required: [staff, roles]
      properties:
        staff:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/StaffAccount"
        roles:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/StaffRole"
    StaffAccount:
      type: object
      required: [userId, username, role, disabled, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
        disabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
    StaffRole:
      type: object
      required: [name, capabilities]
      properties:
        name:
          type: string
        capabilities:
          type: array
          items:
            type: string
    AuthSession:
      type: object
      required: [staff, expiresAt]
      properties:
        staff:
          $ref: "#/components/schemas/Staff"
        expiresAt:
          type: string
          format: date-time
    Staff:
      type: object
      required: [userId, username, role, capabilities]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
        capabilities:
          type: array
          items:
            type: string
    RunSetup:
      type: object
      additionalProperties: false
      required: [label, targetCases]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        targetCases:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    PauseInterval:
      type: object
      required: [startedAt, endedAt]
      properties:
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: [string, "null"]
          format: date-time
    Run:
      type: object
      required:
        - id
        - status
        - revision
        - createdAt
        - updatedAt
        - startedAt
        - pausedAt
        - resumedAt
        - completedAt
        - serverNow
        - setupSnapshot
        - pauseIntervals
        - stationProgress
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [planned, running, paused, completed]
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        pausedAt:
          type: [string, "null"]
          format: date-time
        resumedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        serverNow:
          type: string
          format: date-time
        setupSnapshot:
          $ref: "#/components/schemas/RunSetup"
        pauseIntervals:
          type: array
          items:
            $ref: "#/components/schemas/PauseInterval"
        stationProgress:
          type: object
          description: Canonical per-station inputs, progress, timer state, and revisions.
          additionalProperties:
            $ref: "#/components/schemas/StationState"
    StationState:
      type: object
      required: [status, revision, inputs, progress, startedAt, pausedAt, completedAt, nextDueAt, updatedAt]
      properties:
        status:
          type: string
          enum: [not_started, running, paused, completed]
        revision:
          type: integer
          minimum: 0
        inputs:
          type: object
          additionalProperties:
            type: number
        progress:
          type: object
          description: Validated station counters and server-owned timer/auto-track anchors.
        startedAt:
          type: [string, "null"]
          format: date-time
        pausedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        nextDueAt:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StationCommand:
      type: object
      additionalProperties: false
      required: [commandId, expectedRevision, mode, changes]
      properties:
        commandId:
          type: string
          minLength: 1
          maxLength: 200
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        mode:
          type: string
          enum: [manual, auto_track, timer_start, timer_pause, timer_resume, timer_reset]
        changes:
          type: object
          description: Station-specific numeric setup or progress fields. Automatic/timer modes require an empty object.
          additionalProperties:
            type: number
            minimum: 0
    StationCommandAccepted:
      type: object
      required: [outcome, replayed, commandId, stationKey, run]
      properties:
        outcome:
          const: accepted
        replayed:
          type: boolean
        commandId:
          type: string
        stationKey:
          type: string
        run:
          $ref: "#/components/schemas/Run"
    StationCommandNoChange:
      type: object
      required: [outcome, currentRun]
      properties:
        outcome:
          type: string
          enum: [not_due, not_enabled]
        currentRun:
          $ref: "#/components/schemas/Run"
    StationCommandConflict:
      type: object
      required: [outcome, currentRun]
      properties:
        outcome:
          type: string
          enum: [conflict, invalid_transition]
        expectedRevision:
          type: integer
        currentRun:
          $ref: "#/components/schemas/Run"
    RunCreated:
      type: object
      required: [outcome, replayed, run]
      properties:
        outcome:
          const: created
        replayed:
          type: boolean
        run:
          $ref: "#/components/schemas/Run"
    RunCommandAccepted:
      type: object
      required: [outcome, replayed, commandId, run]
      properties:
        outcome:
          const: accepted
        replayed:
          type: boolean
        commandId:
          type: string
        run:
          $ref: "#/components/schemas/Run"
    RunConflict:
      type: object
      required: [outcome, expectedRevision, currentRun]
      properties:
        outcome:
          const: conflict
        expectedRevision:
          type: integer
        currentRun:
          $ref: "#/components/schemas/Run"
    InvalidTransition:
      type: object
      required: [outcome, currentStatus]
      properties:
        outcome:
          const: invalid_transition
        currentStatus:
          type: string
          enum: [planned, running, paused, completed]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    Error:
      description: Safe error message
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
