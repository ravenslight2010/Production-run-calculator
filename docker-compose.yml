services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: applies the DB schema, then exits. Runs once per `up`, so an API
  # crash/restart never re-triggers a schema change. push-force is required
  # because plain push hangs on an interactive prompt in a container.
  migrate:
    build:
      context: .
      target: api-migrate
    env_file: .env
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "5000"

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    user: "1001:1001"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # The static web container only needs its address — no app secrets.
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    depends_on:
      api:
        condition: service_started
      caddy-storage-init:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  # Existing named volumes may still be owned by root from the former Caddy
  # runtime. Repair only those mounted paths before the unprivileged web server
  # starts; this one-shot helper has no network and only CAP_CHOWN.
  caddy-storage-init:
    image: caddy:2-alpine
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1001:1001 /data /config"]
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
